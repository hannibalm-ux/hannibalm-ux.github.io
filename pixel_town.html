<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Pixel Town</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&family=VT323&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#12131c; --panel:#1b1d2a; --panel-2:#23263a; --line:#33374f; --text:#e9e6da; --muted:#9a9cb3;
  --accent:#f2c14e; --accent-2:#7fd1ae; --bad:#e46a6a; --good:#7fd17f; --link:#8fb8ff;
}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--text);font:15px/1.45 system-ui,-apple-system,"Segoe UI",sans-serif}
button,select,input{font:inherit;color:inherit}
header{display:flex;flex-wrap:wrap;align-items:center;gap:10px 18px;padding:10px 16px;border-bottom:2px solid var(--line);background:var(--panel)}
h1{font:14px/1 "Press Start 2P",monospace;margin:0;color:var(--accent);letter-spacing:1px}
#clock{font:22px/1 VT323,monospace;display:flex;gap:14px;flex-wrap:wrap;align-items:baseline}
#clock b{color:var(--accent);font-weight:normal;font-size:26px}
.speed{display:flex;gap:4px;margin-left:auto;flex-wrap:wrap}
.speed button,.btn{background:var(--panel-2);border:2px solid var(--line);border-radius:4px;padding:4px 9px;cursor:pointer}
.speed button.on,.btn.on{border-color:var(--accent);color:var(--accent)}
.btn:hover,.speed button:hover{border-color:var(--muted)}
.btn.primary{background:var(--accent);color:#1a1405;border-color:var(--accent)}
main{display:grid;grid-template-columns:minmax(0,1fr) 400px;min-height:calc(100vh - 56px)}
#stage{position:relative;min-width:0;padding:12px 16px;display:flex;flex-direction:column;gap:8px}
#viewWrap{position:relative;width:100%;height:clamp(320px,66vh,820px);border:2px solid var(--line);border-radius:4px;overflow:hidden;background:#0b0c12}
#view{width:100%;height:100%;display:block;image-rendering:pixelated;cursor:grab;touch-action:none}
#view.dragging{cursor:grabbing}
#mini{position:absolute;top:8px;right:8px;width:180px;height:113px;border:2px solid rgba(255,255,255,.35);border-radius:3px;image-rendering:pixelated;cursor:pointer;background:#000}
.camctl{position:absolute;right:8px;bottom:8px;display:flex;gap:4px}
.camctl button{background:rgba(20,21,32,.85);border:1px solid rgba(255,255,255,.3);border-radius:4px;color:#fff;width:34px;height:34px;cursor:pointer;font-size:16px}
.camctl button.on{border-color:var(--accent);color:var(--accent)}
#tip{position:absolute;pointer-events:none;background:rgba(15,16,26,.94);border:1px solid var(--line);padding:5px 8px;border-radius:4px;font-size:13px;display:none;max-width:240px;z-index:3}
#ticker{font:19px/1.2 VT323,monospace;color:var(--muted);min-height:24px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
#ticker span{color:var(--accent)}
.stats{display:flex;flex-wrap:wrap;gap:8px}
.stat{background:var(--panel);border:1px solid var(--line);border-radius:4px;padding:6px 10px;min-width:104px}
.stat small{display:block;color:var(--muted);font-size:11px;text-transform:uppercase;letter-spacing:.5px}
.stat strong{font:22px/1.1 VT323,monospace}
aside{border-left:2px solid var(--line);background:var(--panel);display:flex;flex-direction:column;min-height:0;max-height:calc(100vh - 56px);position:sticky;top:0}
.tabs{display:flex;flex-wrap:wrap;border-bottom:2px solid var(--line)}
.tabs button{flex:1;background:none;border:0;border-bottom:3px solid transparent;padding:9px 4px;cursor:pointer;color:var(--muted);font:10px/1 "Press Start 2P",monospace}
.tabs button.on{color:var(--accent);border-bottom-color:var(--accent)}
.panel{display:none;overflow:auto;padding:12px 14px;flex:1}
.panel.on{display:block}
h2{font:11px/1.4 "Press Start 2P",monospace;color:var(--accent-2);margin:14px 0 8px}
h2:first-child{margin-top:0}
.muted{color:var(--muted)}
.ev{display:grid;grid-template-columns:62px 22px 1fr;gap:4px;padding:5px 0;border-bottom:1px dashed var(--line);font-size:14px}
.ev time{font:17px/1.1 VT323,monospace;color:var(--muted)}
.ev.major{color:#fff}.ev.major time{color:var(--accent)}
.week{border:1px solid var(--line);border-radius:6px;margin-bottom:12px;background:var(--panel-2)}
.week summary{cursor:pointer;padding:10px 12px;list-style:none}
.week summary::-webkit-details-marker{display:none}
.week summary b{font:10px/1.5 "Press Start 2P",monospace;color:var(--accent)}
.week .body{padding:0 12px 12px;font-size:14px}
.week ul{margin:4px 0 8px;padding-left:18px}
table{border-collapse:collapse;width:100%;font-size:13px}
td,th{padding:4px 5px;border-bottom:1px solid var(--line);text-align:left;vertical-align:middle}
th{color:var(--muted);font-weight:normal;font-size:11px;text-transform:uppercase}
td.num{text-align:right;font-variant-numeric:tabular-nums}
.up{color:var(--bad)}.down{color:var(--good)}
.cit{display:flex;gap:8px;align-items:center;padding:4px 6px;border-radius:4px;cursor:pointer;border:1px solid transparent}
.cit:hover{background:var(--panel-2)}
.cit.sel{border-color:var(--accent);background:var(--panel-2)}
.cit img{image-rendering:pixelated;width:30px;height:51px;flex:none}
.cit .who{flex:1;min-width:0}
.cit .who small{display:block;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.bar{height:7px;background:#0d0e16;border-radius:3px;overflow:hidden;margin:2px 0 6px}
.bar i{display:block;height:100%}
.needs{display:grid;grid-template-columns:70px 1fr 34px;gap:0 8px;font-size:12px;align-items:center}
.chip{display:inline-block;background:var(--panel-2);border:1px solid var(--line);border-radius:10px;padding:1px 8px;margin:2px 3px 2px 0;font-size:12px}
.law{border:1px solid var(--line);border-left:4px solid var(--accent-2);border-radius:4px;padding:8px 10px;margin-bottom:8px;background:var(--panel-2);font-size:14px}
.law.pending{border-left-color:var(--accent)}
.law.rej{border-left-color:var(--bad);opacity:.8}
.vote{font-size:13px;padding:3px 0;border-bottom:1px dashed var(--line)}
.Yes{color:var(--good)}.No{color:var(--bad)}.Abstain{color:var(--muted)}
.card{border:1px solid var(--line);border-radius:6px;padding:10px;margin-bottom:10px;background:var(--panel-2);font-size:14px}
.card pre{white-space:pre-wrap;font:13px/1.4 ui-monospace,monospace;background:#0f1018;padding:8px;border-radius:4px;margin:6px 0;max-height:160px;overflow:auto}
.row{display:flex;gap:6px;align-items:center;flex-wrap:wrap}
input[type=text],input[type=search],select{background:#0f1018;border:1px solid var(--line);border-radius:4px;padding:5px 7px}
input[type=text],input[type=search]{flex:1;min-width:120px}
a{color:var(--link)}
#overlay{position:fixed;inset:0;background:rgba(8,9,14,.82);display:none;align-items:center;justify-content:center;z-index:10;padding:16px}
#overlay .box{background:var(--panel);border:2px solid var(--accent);border-radius:8px;padding:18px 20px;max-width:560px;width:100%;max-height:85vh;overflow:auto}
#overlay h3{font:12px/1.5 "Press Start 2P",monospace;color:var(--accent);margin:0 0 10px}
.prog{height:10px;background:#0d0e16;border-radius:4px;overflow:hidden}.prog i{display:block;height:100%;background:var(--accent);width:0}
@media (max-width:980px){
  main{grid-template-columns:minmax(0,1fr)}
  aside{border-left:0;border-top:2px solid var(--line);max-height:none;position:static}
  .speed{margin-left:0}
  #stage{padding:10px 16px}
  #viewWrap{height:clamp(300px,58vh,640px)}
  #mini{width:120px;height:75px}
}
</style>
</head>
<body>
<header>
  <h1>PIXEL TOWN</h1>
  <div id="clock"></div>
  <div class="speed" id="speed"></div>
</header>
<main>
  <section id="stage">
    <div id="viewWrap">
      <canvas id="view"></canvas>
      <canvas id="mini" width="160" height="100" title="Minimap: tap to jump"></canvas>
      <div class="camctl">
        <button id="zOut" title="Zoom out">−</button>
        <button id="zIn" title="Zoom in">+</button>
        <button id="zFit" title="Show whole town">⤢</button>
        <button id="zFollow" title="Follow selected villager">◎</button>
      </div>
    </div>
    <div id="tip"></div>
    <div id="ticker"></div>
    <div class="stats" id="stats"></div>
  </section>
  <aside>
    <div class="tabs" id="tabs">
      <button data-p="chron" class="on">Log</button>
      <button data-p="weeks">Weekly</button>
      <button data-p="people">People</button>
      <button data-p="market">Market</button>
      <button data-p="laws">Laws</button>
      <button data-p="music">Music</button>
    </div>
    <div class="panel on" id="p-chron"></div>
    <div class="panel" id="p-weeks"></div>
    <div class="panel" id="p-people"></div>
    <div class="panel" id="p-market"></div>
    <div class="panel" id="p-laws"></div>
    <div class="panel" id="p-music"></div>
  </aside>
</main>
<div id="overlay"><div class="box" id="overlayBox"></div></div>

<script>
'use strict';
/* =====================================================================
   Pixel Town — browser build of the Technical Design Document.
   One authoritative clock at 24x: 2.5 real s = 1 game minute.
   Deterministic per-minute pipeline: Time(100) → Governance(200) →
   Agents(300) → Economy(400). Laws are data pulled through lawQuery.
   Every decision uses the TDD's deterministic fallback path (no LLM).
   Art: hi-bit pixel art generated procedurally at load (hue-shifted
   ramps, ordered dithering, outlined sprites, 2D lighting).
   ===================================================================== */

// ---------- storage (may be unavailable) ----------
const store = {
  get(k){ try{ const v = localStorage.getItem(k); return v ? JSON.parse(v) : null; }catch(e){ return null; } },
  set(k,v){ try{ localStorage.setItem(k, JSON.stringify(v)); return true; }catch(e){ return false; } },
  del(k){ try{ localStorage.removeItem(k); }catch(e){} }
};
const SAVE_KEY = 'pixeltown.save.v2', OLD_SAVE_KEY = 'pixeltown.save.v1', MUSIC_KEY = 'pixeltown.music.v1';

// ---------- constants ----------
const TILE = 16, MW = 80, MH = 50, WW = MW*TILE, WH = MH*TILE;
const MS_PER_GAME_MIN = 2500;
const DAY = 1440;
const SEASONS = ['Spring','Summer','Fall','Winter'];
const WEEKDAYS = ['Moonday','Tideday','Windsday','Thornsday','Fireday','Starday','Hallday'];
const T = {GRASS:0,PATH:1,WATER:2,BRIDGE:3,TREE:4,BUILD:5,FIELD:6,PLAZA:7,ROCK:8,OBJ:9,FLOWER:10,DOCK:11,SAND:12,PASTURE:13,FENCE:14};
const WALK = new Set([T.GRASS,T.PATH,T.BRIDGE,T.PLAZA,T.FIELD,T.FLOWER,T.DOCK,T.SAND,T.PASTURE]);
const clamp = (v,a,b) => v<a?a:v>b?b:v;
const pad2 = n => String(n).padStart(2,'0');

// ---------- seeded RNG (state lives in the save) ----------
const RNG = { s: 20260926,
  next(){ let t = (this.s = (this.s + 0x6D2B79F5) | 0); t = Math.imul(t ^ (t>>>15), t|1); t ^= t + Math.imul(t ^ (t>>>7), t|61); return ((t ^ (t>>>14))>>>0) / 4294967296; } };
const rnd = () => RNG.next();
const pick = arr => arr[Math.floor(rnd()*arr.length)];
function hash(str){ let h = 2166136261; for (let i=0;i<str.length;i++){ h ^= str.charCodeAt(i); h = Math.imul(h,16777619); } return h>>>0; }
function mapRand(seed){ let s = seed|0; return () => { let t = (s = (s + 0x6D2B79F5)|0); t = Math.imul(t^(t>>>15),t|1); t ^= t + Math.imul(t^(t>>>7),t|61); return ((t^(t>>>14))>>>0)/4294967296; }; }
function hashf(x,y,s){ let h = Math.imul(x|0,374761393) ^ Math.imul(y|0,668265263) ^ Math.imul((s|0)+1,2246822519); h = Math.imul(h^(h>>>13),1274126177); h ^= h>>>16; return (h>>>0)/4294967296; }

// ---------- color + pixel helpers ----------
const _rgb = {};
function rgb(hex){ if (_rgb[hex]) return _rgb[hex]; const n=parseInt(hex.slice(1),16); return _rgb[hex]=[n>>16,(n>>8)&255,n&255]; }
function toHex(r,g,b){ return '#'+((1<<24)+(clamp(Math.round(r),0,255)<<16)+(clamp(Math.round(g),0,255)<<8)+clamp(Math.round(b),0,255)).toString(16).slice(1); }
function shade(hex,f){ const [r,g,b]=rgb(hex); return toHex(r*f,g*f,b*f); }
function mix(a,b,t){ const A=rgb(a),B=rgb(b); return toHex(A[0]+(B[0]-A[0])*t,A[1]+(B[1]-A[1])*t,A[2]+(B[2]-A[2])*t); }
const _ramps = {};
// hue-shifted ramp: shadows drift toward violet, highlights toward warm yellow (hi-bit look)
function ramp(hex,n){ n=n||5; const k=hex+n; if (_ramps[k]) return _ramps[k]; const out=[];
  for (let i=0;i<n;i++){ const t=i/(n-1); let c=shade(hex,0.52+0.78*t); c = t<0.5 ? mix(c,'#2b1d4e',(0.5-t)*0.45) : mix(c,'#fff0c0',(t-0.5)*0.34); out.push(c); }
  return _ramps[k]=out; }
const BAY = [0,8,2,10,12,4,14,6,3,11,1,9,15,7,13,5];
function dith(l,x,y,n){ const t=clamp(l,0,0.9999)*(n-1); const b=Math.floor(t); return Math.min(n-1, b + ((t-b)*16 > BAY[((y&3)<<2)|(x&3)]+0.5 ? 1 : 0)); }
function mk(w,h){ const c=document.createElement('canvas'); c.width=w; c.height=h; return c; }
class Pix {
  constructor(w,h){ this.w=w; this.h=h; this.c=mk(w,h); this.g=this.c.getContext('2d'); this.img=this.g.createImageData(w,h); this.d=this.img.data; }
  set(x,y,hex,a){ x=Math.floor(x); y=Math.floor(y); if (x<0||y<0||x>=this.w||y>=this.h) return; a = a===undefined?255:a; const [r,g,b]=rgb(hex); const i=(y*this.w+x)*4, d=this.d;
    if (a<255 && d[i+3]>0){ const t=a/255; d[i]=d[i]*(1-t)+r*t; d[i+1]=d[i+1]*(1-t)+g*t; d[i+2]=d[i+2]*(1-t)+b*t; d[i+3]=Math.max(d[i+3],a); }
    else { d[i]=r; d[i+1]=g; d[i+2]=b; d[i+3]=a; } }
  alpha(x,y){ if (x<0||y<0||x>=this.w||y>=this.h) return 0; return this.d[(y*this.w+x)*4+3]; }
  rect(x,y,w,h,hex,a){ for (let j=0;j<h;j++) for (let i=0;i<w;i++) this.set(x+i,y+j,hex,a); }
  clear(x,y){ if (x<0||y<0||x>=this.w||y>=this.h) return; this.d[(y*this.w+x)*4+3]=0; }
  ellipse(cx,cy,rx,ry,hex,a){ for (let y=Math.floor(cy-ry);y<=cy+ry;y++) for (let x=Math.floor(cx-rx);x<=cx+rx;x++){ const dx=(x+.5-cx)/rx, dy=(y+.5-cy)/ry; if (dx*dx+dy*dy<=1) this.set(x,y,hex,a); } }
  line(x0,y0,x1,y1,hex){ const n=Math.max(Math.abs(x1-x0),Math.abs(y1-y0))||1; for (let i=0;i<=n;i++) this.set(Math.round(x0+(x1-x0)*i/n), Math.round(y0+(y1-y0)*i/n), hex); }
  // full dark outline around opaque pixels (like the reference sprite)
  outline(col){ col=col||'#1b1320'; const w=this.w,h=this.h,src=new Uint8ClampedArray(this.d); const A=(x,y)=> (x<0||y<0||x>=w||y>=h)?0:src[(y*w+x)*4+3];
    for (let y=0;y<h;y++) for (let x=0;x<w;x++){ if (A(x,y)>60) continue; if (A(x-1,y)>200||A(x+1,y)>200||A(x,y-1)>200||A(x,y+1)>200) this.set(x,y,col); } return this; }
  done(){ this.g.putImageData(this.img,0,0); return this.c; }
}
// sphere-lit blob with dithering; circles later in the list sit in front
function blob(p, circles, R, opt){
  opt=opt||{}; const lx=-0.55, ly=-0.8;
  let x0=1e9,y0=1e9,x1=-1e9,y1=-1e9; circles.forEach(c=>{ x0=Math.min(x0,c.x-c.r); y0=Math.min(y0,c.y-c.r); x1=Math.max(x1,c.x+c.r); y1=Math.max(y1,c.y+c.r); });
  for (let y=Math.floor(y0);y<=y1;y++) for (let x=Math.floor(x0);x<=x1;x++){
    let hit=null; for (const c of circles){ const dx=x+.5-c.x, dy=y+.5-c.y; if (dx*dx+dy*dy<=c.r*c.r) hit=[c,dx,dy]; }
    if (!hit) continue;
    const nx=hit[1]/hit[0].r, ny=hit[2]/hit[0].r, nz=Math.sqrt(Math.max(0,1-nx*nx-ny*ny));
    let l = 0.18 + 0.82*Math.max(0, -(nx*lx+ny*ly)*0.7 + nz*0.45);
    if (opt.noise) l += (hashf(x,y,opt.seed||0)-0.5)*opt.noise;
    p.set(x,y,R[dith(l+(opt.bias||0),x,y,R.length)]);
  }
}

// ---------- map ----------
const BUILDINGS = [
  {id:'bld_town_hall', name:'Town Hall',             x:23,y:9, w:7,h:5, style:'hall',   roof:'#3d5588'},
  {id:'loc_tavern',    name:'The Tipsy Lantern',     x:34,y:12,w:6,h:5, style:'tavern', roof:'#6a3020', sign:'mug'},
  {id:'loc_bakery',    name:'Marsh Bakery',          x:14,y:10,w:5,h:4, style:'house',  roof:'#c07a34', sign:'bread'},
  {id:'loc_clinic',    name:'Clinic',                x:7, y:10,w:5,h:4, style:'stone',  roof:'#a8403c', sign:'cross'},
  {id:'loc_carpentry', name:'Holt & Finch Carpentry',x:13,y:17,w:5,h:4, style:'house',  roof:'#7a5a32', sign:'saw'},
  {id:'loc_smithy',    name:'Brandt Smithy',         x:35,y:20,w:5,h:4, style:'stone',  roof:'#4a4e5c', sign:'anvil'},
  {id:'loc_butcher',   name:'Hock & Cleaver Butchery',x:35,y:26,w:5,h:4, style:'house', roof:'#8a2a2a', sign:'meat'},
  {id:'loc_fisher_hut',name:'Lakeside Fish Hut',     x:37,y:33,w:4,h:3, style:'hut',    roof:'#c8a458', sign:'fish'},
  {id:'loc_barn',      name:'Red Barn',              x:4, y:30,w:6,h:4, style:'barn',   roof:'#6a3a2a'},
  {id:'loc_mine',      name:'Deepvein Mine',         x:67,y:4, w:4,h:3, style:'mine'}
];
const HOUSE_SLOTS = [[2,2],[7,2],[12,2],[17,2],[22,2],[27,2],[32,2],[37,2],[42,2],[2,16],[8,17],[2,22],[8,23],[14,23],[11,28],[42,11],[42,17],[42,23],[42,29]];
const HOUSE_NAMES = ['Holt House','Finch House','Reed Farmhouse','Vale House','Stone House','Brandt House','Cole House','Ashby House'];
const HOUSE_ROOFS = ['#9b5d3a','#5d7b4a','#b0782e','#6a4a8a','#6b6b72','#8a3a3a','#3a6a7a','#4a6a3a','#b8683a','#7a5a9a','#5a6a8a','#9a4a5a','#4a7a6a'];
HOUSE_SLOTS.forEach(([x,y],i)=>BUILDINGS.push({id:'loc_house_'+pad2(i+1), name:HOUSE_NAMES[i]||'Cottage', x,y,w:4,h:4, style:'house', roof:HOUSE_ROOFS[i%HOUSE_ROOFS.length], house:true}));
BUILDINGS.forEach(b => b.door = [b.x + Math.floor(b.w/2), b.y + b.h]);
const STALLS = [[21,27],[25,27],[29,27]];
const WELL = [21,23], FOUNTAIN = [25,19];
const LOC = {};
BUILDINGS.forEach(b => { if (!b.id.startsWith('bld_')) LOC[b.id] = {id:b.id, name:b.name, indoor:true, door:b.door, b}; });
Object.assign(LOC, {
  loc_town_square: {id:'loc_town_square', name:'Town Square', rects:[[20,15,32,25]]},
  loc_town_hall:   {id:'loc_town_hall',   name:'Town Hall Steps', rects:[[20,15,32,18]]},
  loc_market:      {id:'loc_market',      name:'Market',      rects:[[20,26,32,26],[20,29,32,29]]},
  loc_farm:        {id:'loc_farm',        name:'Wheatfields', rects:[[18,34,34,46]]},
  loc_pasture:     {id:'loc_pasture',     name:'West Pasture', rects:[[3,36,15,47]]},
  loc_docks:       {id:'loc_docks',       name:'Lake Docks',  rects:[]},
  loc_east_grove:  {id:'loc_east_grove',  name:'East Grove',  rects:[[61,17,67,23]]},
  loc_well:        {id:'loc_well',        name:'Town Well',   rects:[[20,22,24,25]]}
});
Object.values(LOC).forEach(L=>{ if (!L.indoor) L.indoor=false; });
let LAMPS = [];
const MAP = [], TVAR = [];
let BRIDGE_TILES = [], DOCK_TILES = [], WATER_TILES = [], PUDDLES = [], RAIL_TILES = [];
function riverX(y){ return 50 + Math.round(1.6*Math.sin(y/6)); }
function buildMap(){
  const mr = mapRand(77);
  for (let y=0;y<MH;y++){ MAP[y]=[]; TVAR[y]=[]; for (let x=0;x<MW;x++){ MAP[y][x]=T.GRASS; TVAR[y][x]=mr(); } }
  const set = (x,y,t) => { if (x>=0&&y>=0&&x<MW&&y<MH) MAP[y][x]=t; };
  const get = (x,y) => (x>=0&&y>=0&&x<MW&&y<MH) ? MAP[y][x] : -1;
  // river + lake

  }

  for (let y=15;y<=25;y++) for (let x=20;x<=32;x++) set(x,y,T.PLAZA);
  for (let j=0;j<2;j++) for (let i=0;i<2;i++){ set(FOUNTAIN[0]+i,FOUNTAIN[1]+j,T.OBJ); set(WELL[0]+i,WELL[1]+j,T.OBJ); }

  // fields + pasture
  for (let y=34;y<=46;y++) for (let x=18;x<=34;x++) if (get(x,y)===T.GRASS||get(x,y)===T.SAND) set(x,y,T.FIELD);
  for (let y=35;y<=48;y++) for (let x=2;x<=16;x++){ const edge = y===35||y===48||x===2||x===16; set(x,y, edge?T.FENCE:T.PASTURE); }
  set(9,35,T.PATH);

  RAIL_TILES=[]; for (let y=8;y<=11;y++){ RAIL_TILES.push([71,y]); if (get(71,y)!==T.PATH) set(71,y,T.PATH); }
  // auto-roads from every door to the square

  for (let y=1;y<MH-1;y++) for (let x=1;x<46;x++){
    if (MAP[y][x]!==T.GRASS) continue;

  }
  // lamps along roads
  LAMPS = [[20,15],[32,15],[20,25],[32,25],[bWest-1,19],[bEast+1,22],[33,17],[19,21],[13,15],[27,31],[40,31],[45,31],[9,33],[6,7],[16,7],[26,7],[36,7],[41,9],[41,21],[62,9]];
  LAMPS = LAMPS.filter(([x,y])=>WALK.has(get(x,y)));
  WATER_TILES=[]; for (let y=0;y<MH;y++) for (let x=0;x<MW;x++) if (MAP[y][x]===T.WATER) WATER_TILES.push([x,y]);
  PUDDLES=[]; for (let y=0;y<MH;y++) for (let x=0;x<MW;x++) if ((MAP[y][x]===T.PATH||MAP[y][x]===T.PLAZA) && hashf(x,y,99)<0.1) PUDDLES.push([x,y]);
}
function roadCost(x,y){
  const t = MAP[y][x];

// A* with a binary heap; the goal tile may be a building door or otherwise blocked tile
function astar(sx,sy,tx,ty,cost){

    if (cur===goal){ const path=[]; let k=cur; while (k!==-1){ path.push([k%MW,Math.floor(k/MW)]); k=came[k]; } return path.reverse(); }

const pathCache = new Map();
function findPath(sx,sy,tx,ty){

const SPOTS = {};
function spotsFor(locId){
  if (SPOTS[locId]) return SPOTS[locId];
  const L = LOC[locId]; let out=[];
  if (L.tiles) out = L.tiles.slice();
  (L.rects||[]).forEach(([x0,y0,x1,y1])=>{ for (let y=y0;y<=y1;y++) for (let x=x0;x<=x1;x++) if (walkable(x,y)) out.push([x,y]); });

  return SPOTS[locId]=out;
}

// ---------- law query (pull-based modifiers) ----------
function activeLaws(){ return S.gov.proposals.filter(p=>p.status==='Enacted'); }
function effects(){ const out=[]; activeLaws().forEach(p=>p.effects.forEach(e=>out.push(e))); return out; }
function effTargets(e,g){ return e.targetGoodId===g || (e.targetCategory && GD[g].cat===e.targetCategory); }
const lawQuery = {
  priceMultiplier(g){ let m=1; effects().forEach(e=>{ if (e.effectType==='PriceMultiplier' && effTargets(e,g)) m*=e.magnitude; }); return m; },
  salesTax(g){ let r=0; effects().forEach(e=>{ if (e.effectType==='SalesTax' && effTargets(e,g)) r+=e.magnitude; }); return Math.min(.3,r); },
  subsidy(prof){ let s=0; effects().forEach(e=>{ if (e.effectType==='Subsidy' && e.targetProfession===prof) s+=e.magnitude; }); return s; },
  curfew(loc){ const e = effects().find(e=>e.effectType==='Curfew' && e.targetZoneId===loc); return e ? [e.startMinuteOfDay, e.endMinuteOfDay] : null; }
};

// ---------- economy ----------
function hourIdx(){ return Math.floor(modOf(S.minute)/60); }
function recordDemand(g,q){ S.goods[g].dem[hourIdx()] += q; }

function recordSupply(g,q){ S.goods[g].sup[hourIdx()] += q; }
const sum = a => a.reduce((x,y)=>x+y,0);

function pay(buyer, seller, g, price){
  const tax = Math.round(price * lawQuery.salesTax(g));
  const m = GD[g].kind==='Resource' ? merchantFor(buyer,seller) : null; const fee = m ? Math.round(price*0.08) : 0;
  buyer.wallet -= price + tax;
  seller.wallet += price - fee; if (fee){ m.wallet += fee; today(m).inc += fee; S.week.income[m.id]=(S.week.income[m.id]||0)+fee; }
  S.treasury += tax;
  const bb = today(buyer), sb = today(seller);
  bb.exp += price+tax; bb.tax += tax; bb.bought[g] = (bb.bought[g]||0)+1;
  sb.inc += price-fee; sb.sold[g] = (sb.sold[g]||0)+1;
  S.week.trades++; S.week.volume += price; S.week.taxes += tax;
  S.week.income[seller.id] = (S.week.income[seller.id]||0) + price - fee;
  S.week.spent[buyer.id] = (S.week.spent[buyer.id]||0) + price + tax;
}
function listed(g, sellerId){ let n=0; for (const l of S.listings) if (l.g===g && (!sellerId || l.seller===sellerId)) n+=l.qty; return n; }
function buy(c, g, qty){
  recordDemand(g, qty);
  let got = 0;
  while (got < qty){
    const L = S.listings.find(l => l.g===g && l.qty>0 && l.seller!==c.id);
    if (!L) break;
    const price = S.goods[g].price, tax = Math.round(price*lawQuery.salesTax(g));
    if (c.wallet < price + tax){ S.goods[g].dem[hourIdx()] -= (qty-got); return got; } // only affordable demand moves prices
    pay(c, cById(L.seller), g, price);
    L.qty--; got++;
    c.inventory[g] = (c.inventory[g]||0) + 1;
    if (g==='good_livestock') takeAnimal();
  }
  if (got < qty) recordUnmet(g, qty-got);
  return got;
}
function takeAnimal(){ const h=S.herd; const k = ['pig','sheep','cow'].sort((a,b)=>h[b]-h[a])[0]; if (h[k]>0) h[k]--; }
function list(c, g, qty){
  if (qty<=0) return;
  c.inventory[g] -= qty; if (c.inventory[g]<=0) delete c.inventory[g];
  const d = dayOf(S.minute);
  const last = S.listings.find(l=>l.g===g && l.seller===c.id && l.at===d);
  if (last) last.qty += qty; else S.listings.push({g, seller:c.id, qty, at:d});
  recordSupply(g, qty);
}
function hasIngredient(p){ return MEAL_INGREDIENTS.some(g=>p.inventory[g]>0); }
function providerAvailable(p, svc){
  const spec = GD[svc].svc;
  if (p.profession!==spec.prof || p.rt.state!=='Working' || p.rt.path) return false;
  if (spec.loc && p.rt.loc!==spec.loc) return false;
  if (svc==='svc_hot_meal' && !hasIngredient(p)) return false;
  return p.svcUsed < spec.cap;
}
function buyService(c, svc){
  recordDemand(svc, 1);
  const prov = S.citizens.find(p => p!==c && providerAvailable(p, svc));
  const price = S.goods[svc].price, tax = Math.round(price*lawQuery.salesTax(svc));
  if (!prov || c.wallet < price+tax){ recordUnmet(svc,1); return false; }
  pay(c, prov, svc, price); prov.svcUsed++;
  if (svc==='svc_hot_meal'){ const g = MEAL_INGREDIENTS.find(g=>prov.inventory[g]>0); prov.inventory[g]--; if (!prov.inventory[g]) delete prov.inventory[g]; }

function applyNeeds(c, need){ if (!need) return; for (const k in need) c.needs[k] = clamp(c.needs[k]+need[k],0,100); }
function consume(c, g){ c.inventory[g]--; if (c.inventory[g]<=0) delete c.inventory[g]; applyNeeds(c, GD[g].need); }
function reprice(){
  const k = 5;
  GOOD_DEFS.forEach(def => {
    const st = S.goods[def.id];
    const D = sum(st.dem), Sp = sum(st.sup) + (def.kind==='Resource' ? listed(def.id)*0.25 : 0);
    const target = def.base * Math.pow((D+k)/(Sp+k), def.e) * lawQuery.priceMultiplier(def.id);
    st.price = clamp(Math.round(st.price + def.a*(target - st.price)), def.floor, def.ceil);
    st.hist.push(st.price); if (st.hist.length>168) st.hist.shift();
  });
  const h = (hourIdx()+1)%24;
  GOOD_DEFS.forEach(def => { const st=S.goods[def.id]; st.dem[h]=0; st.sup[h]=0; st.unmet[h]=0; });
  S.listings = S.listings.filter(l=>l.qty>0);

// ---------- planning (deterministic fallback planner) ----------
function isTownHallDay(d){ return d%7===6; }
function buildPlan(c, day){
  const B=[]; let t=0; const home=c.home, work=c.work||'loc_town_square';
  const add=(end,act,loc,note,target)=>{ end=Math.min(DAY,Math.round(end)); if (end<=t) return; B.push({s:t,d:end-t,act,loc,note,target}); t=end; };
  const has = tr => c.traits.includes(tr);
  const jit = hash(c.id+day)%25;
  const hall = isTownHallDay(day);
  const outdoor = OUTDOOR_WORK.includes(c.profession);
  const storm = S.weather==='Storm';
  const bridgeOut = S.bridge.closed && ['Woodcutter','Miner','Unemployed'].includes(c.profession);
  let wake = {Baker:270, Farmer:330, Fisher:300, Rancher:330, TavernKeeper:480}[c.profession] || 360;
  if (has('Lazy')) wake += 60; if (has('Hardworking')) wake -= 20; wake += jit;
  add(wake,'Sleep',home,'Sleeping');
  add(t+30,'Eat',home,'Breakfast at home');
  const hh = HOUSEHOLDS[home]||[c.id];
  if (hh[day % hh.length]===c.id && c.profession!=='Baker') add(t+40,'Chore','loc_well','Fetching water from the well');
  if (c.sick && c.profession!=='Doctor') add(t+60,'Trade','loc_clinic','Seeing the doctor','svc_medical_checkup');
  const workLoc = c.profession==='Unemployed' ? (bridgeOut ? 'loc_town_square' : 'loc_east_grove') : work;
  const cantWork = (storm && outdoor) || bridgeOut;
  const workNote = cantWork ? (storm ? 'Sheltering from the storm' : 'The bridge is out; stuck on this side') : ({Farmer:'Tending the wheatfields',Rancher:'Tending the herd in the pasture',Butcher:'Butchering at the Hock & Cleaver',Fisher:'Fishing off the lake docks',Woodcutter:'Felling timber in the east grove',Miner:'Digging ore in Deepvein Mine',Blacksmith:'Working the forge',Carpenter:'At the workbench',Baker:'Baking bread',TavernKeeper:'Running the tavern',Doctor:'Seeing patients',Merchant:'Minding the market stalls',Unemployed:'Odd jobs chopping wood'}[c.profession]);
  const workAct = cantWork ? 'Leisure' : (c.profession==='Unemployed' && has('Lazy') && hash(c.id+day+'l')%3===0 ? 'Leisure' : 'Work');
  const wLoc = cantWork ? home : workLoc;
  const curfew = lawQuery.curfew('loc_tavern');
  const tavernClose = curfew ? curfew[0] : 23*60;
  if (c.profession==='TavernKeeper'){
    add(15*60, 'Work','loc_tavern','Opening up the Tipsy Lantern');
    add(15*60+30,'Eat','loc_tavern','Quick bite in the kitchen');
    if (hall){ add(17*60+45,'Work','loc_tavern','Serving the afternoon crowd'); add(19*60+30,'AttendTownHall','loc_town_hall','Town hall meeting'); }
    add(tavernClose,'Work','loc_tavern', curfew ? 'Serving until the curfew bell' : 'Serving the evening crowd');
    add(tavernClose+30,'Leisure',home,'Counting the till');
    add(DAY,'Sleep',home,'Sleeping');
    return {day, by:'Fallback', blocks:B};
  }
  const endMorning = c.profession==='Baker' ? 11*60 : 12*60;
  add(endMorning, workAct, wLoc, workNote);
  if (has('Frugal') || c.wallet<25) add(t+60,'Eat',home,'Cheap lunch at home');
  else add(t+60,'Eat','loc_tavern','Lunch at the Tipsy Lantern','svc_hot_meal');
  let endWork = c.profession==='Baker' ? 15*60 : has('Hardworking') ? 18*60 : has('Lazy') ? 16*60+30 : 17*60+30;
  if (hall) endWork = Math.min(endWork, 17*60+30);
  add(endWork, workAct, wLoc, workNote);
  const civicSkip = c.politics.civicEngagement < .25 && hash(c.id+day+'h')%2===0;
  if (hall && !civicSkip){ add(17*60+45,'Leisure','loc_town_square','Heading to the town hall'); add(19*60+30,'AttendTownHall','loc_town_hall','Town hall meeting'); }
  const social = c.personality.extraversion>.5 || has('Gossip') || has('Charismatic');
  if (S.festival){ add(16*60,'Leisure',home,'Getting ready for the festival'); add(21*60+30,'Socialize','loc_town_square','Season festival on the square'); }
  else if (social && !storm){
    const end = Math.min(tavernClose, 21*60 + (has('Reckless')?120:30));
    if (end > t+30) add(end,'Socialize','loc_tavern','Evening at the tavern','svc_hot_meal');
  } else {
    if (!storm) add(Math.max(t,19*60),'Leisure','loc_town_square','Evening stroll by the fountain');
    add(t+45,'Eat',home,'Supper at home');
  }
  add(c.profession==='Baker'?20*60+30:22*60+(has('Reckless')?60:0),'Leisure',home,'Winding down at home');
  add(DAY,'Sleep',home,'Sleeping');
  return {day, by:'Fallback', blocks:B};
}
function currentBlockIdx(c, mod){ const b=c.plan.blocks; for (let i=0;i<b.length;i++) if (mod>=b[i].s && mod<b[i].s+b[i].d) return i; return b.length-1; }

// ---------- agents ----------
const STATE_FOR = {Sleep:'Sleeping',Eat:'Consuming',Work:'Working',Socialize:'Socializing',Leisure:'Idle',Trade:'Trading',AttendTownHall:'AttendingTownHall',Chore:'Idle',Idle:'Idle'};
function agentTick(c){
  const mod = modOf(S.minute);
  const n = c.needs, awake = c.rt.state!=='Sleeping';
  n.hunger = clamp(n.hunger - 0.062, 0, 100);
  n.energy = clamp(n.energy + (awake ? -(c.sick?0.1:0.058) : 0.21), 0, 100);
  n.social = clamp(n.social - 0.035*(0.6+c.personality.extraversion), 0, 100);
  n.fun    = clamp(n.fun - 0.03, 0, 100);
  n.comfort= clamp(n.comfort + (awake ? -0.024 : 0.028), 0, 100);
  c.rt.seg = null;
  const idx = currentBlockIdx(c, mod);
  if (idx !== c.rt.blockIdx){ c.rt.blockIdx = idx; startBlock(c, c.plan.blocks[idx]); }
  const b = c.plan.blocks[idx];
  if (c.rt.path){ step(c); if (!c.rt.path) arrive(c, b); return; }
  activity(c, b, mod);
  if (n.hunger < 12 && awake && (S.minute - (c.lastTry.hunger||-999)) > 120){
    c.lastTry.hunger = S.minute;
    if (!eatSomething(c)){
      const broke = c.wallet < Math.min(...FOODS.map(g=>S.goods[g].price));
      if (!S.week.hungry.includes(c.name)) { S.week.hungry.push(c.name); chronicle(broke ? `${c.name} is going hungry and can't afford food.` : `${c.name} is going hungry: the market has run out of food.`, 5, '🍞', 'need'); remember(c, broke ? 'I went hungry today. I could not afford a meal.' : 'I went hungry today. There was no food left at the market.', 7); setEmotion(c,'Anxious',240); }
      if (broke) charity(c);
    }
  }
}
function startBlock(c, b){
  c.rt.did = false;
  const [tx,ty] = spotFor(c, b.loc);
  c.rt.dest = b.loc;
  if (c.rt.x===tx && c.rt.y===ty){ c.rt.path=null; arrive(c,b); return; }
  const p = findPath(c.rt.x, c.rt.y, tx, ty);
  if (!p){ c.rt.path=null; c.rt.state='Idle'; return; }
  p.shift(); c.rt.path = p.length ? p : null; c.rt.state='Traveling'; c.rt.loc=null;
  if (!c.rt.path) arrive(c,b);
}
function step(c){
  c.rt.ox = c.rt.x; c.rt.oy = c.rt.y; const seg=[[c.rt.x,c.rt.y]];
  for (let i=0;i<2 && c.rt.path && c.rt.path.length;i++){
    const [nx,ny] = c.rt.path.shift();
    if (MAP[ny][nx]===T.BRIDGE && S.bridge.closed){ c.rt.path=null; break; }
    c.rt.x=nx; c.rt.y=ny; seg.push([nx,ny]);
  }
  c.rt.seg = seg;
  if (c.rt.path && !c.rt.path.length) c.rt.path = null;
}
function arrive(c, b){
  c.rt.ox=c.rt.x; c.rt.oy=c.rt.y;
  c.rt.loc = b.loc; c.rt.state = STATE_FOR[b.act]||'Idle'; c.rt.since = S.minute;
  if (b.act==='Eat' && !c.rt.did){ c.rt.did=true; doMeal(c,b); }
  if (b.act==='Trade' && b.target==='svc_medical_checkup' && !c.rt.did){ c.rt.did=true; clinicVisit(c); }
  if (b.act==='Chore' && !c.rt.did){ c.rt.did=true; c.needs.comfort=clamp(c.needs.comfort+6,0,100); }
  if (b.act==='Socialize' && b.loc==='loc_tavern' && !c.rt.did){
    c.rt.did=true;
    if (c.needs.hunger<70){ const p=buyService(c,'svc_hot_meal'); if (!p) eatSomething(c); }
    if (c.needs.fun<85 && buy(c,'good_ale',1)) consume(c,'good_ale');
  }
}
function doMeal(c,b){
  if (c.needs.hunger>85) return;
  if (b.target==='svc_hot_meal'){ const p=buyService(c,'svc_hot_meal'); if (p){ if (hash(c.id+S.minute)%9===0) remember(c, `Had a hot meal at the Tipsy Lantern. ${p.name} served it.`, 2, [p.id]); return; } }
  if (!eatSomething(c)) remember(c, 'Skipped a meal; there was nothing I could afford.', 4);
}
function foodValue(g){ return S.goods[g].price / GD[g].need.hunger; }
function eatSomething(c){
  let ate=false;
  for (const g of FOODS) while (c.inventory[g] && c.needs.hunger<72){ consume(c,g); ate=true; }
  if (c.needs.hunger>=72) return ate;
  const order = FOODS.filter(g=>listed(g)>0).sort((a,b)=>foodValue(a)-foodValue(b));
  for (let k=0;k<3 && c.needs.hunger<72;k++){ let got=false; for (const g of order){ if (buy(c,g,1)){ consume(c,g); got=ate=true; break; } } if (!got) break; }
  if (!order.length) recordDemand('good_bread',1);
  return ate;
}
function clinicVisit(c){
  const p = buyService(c,'svc_medical_checkup');
  if (p){ c.sick=0; chronicle(`Dr. ${p.name.split(' ')[1]} treated ${c.name}, who is on the mend.`, 4, '🩺', 'health'); remember(c, `${p.name} treated me at the clinic. I feel better already.`, 5, [p.id]); adjustRel(c,p,6); }
  else remember(c, 'I went to the clinic but could not get seen.', 4);
}
function charity(c){
  const donor = S.citizens.filter(d => d!==c && (d.traits.includes('Generous') || d.rel[c.id].affinity>60) && d.wallet>150 && d.rel[c.id].affinity>10).sort((a,b)=>b.rel[c.id].affinity-a.rel[c.id].affinity)[0];
  if (!donor) return;
  const amt = 20; donor.wallet -= amt; c.wallet += amt;
  chronicle(`${donor.name} gave ${c.name} ${amt} coins for food.`, 4, '🤝', 'social');
  remember(c, `${donor.name} gave me coins when I was hungry. I won't forget it.`, 7, [donor.id]);
  remember(donor, `I helped ${c.name} buy food.`, 4, [c.id]);
  adjustRel(c, donor, 14); adjustRel(donor, c, 5);
}
function activity(c, b, mod){
  const n=c.needs;
  switch (b.act){
    case 'Sleep': if (c.rt.state!=='Sleeping') c.rt.state='Sleeping'; break;
    case 'Work': work(c); break;
    case 'Socialize': n.social=clamp(n.social+0.32,0,100); n.fun=clamp(n.fun+0.14,0,100);
      if ((mod+hash(c.id))%20===0) socialize(c);
      if (c.traits.includes('Reckless') && b.loc==='loc_tavern' && (mod%90===0) && n.fun<95 && buy(c,'good_ale',1)) consume(c,'good_ale');
      break;
    case 'Leisure': n.fun=clamp(n.fun+0.16,0,100); if (!LOC[b.loc].indoor && (mod+hash(c.id))%30===0) socialize(c); break;
    case 'Chore': if ((mod+hash(c.id))%15===0) socialize(c); break;
    case 'AttendTownHall': n.social=clamp(n.social+0.1,0,100); break;
  }
  if (c.rt.state==='Working' && b.act==='Work' && mod%60===17){
    if ((n.comfort<40 && c.wallet > S.goods.good_furniture.price*1.6) || (n.comfort<68 && c.wallet>450)){ if (buy(c,'good_furniture',1)){ consume(c,'good_furniture'); remember(c,'Bought a new piece of furniture for the house.',3,['good_furniture'],'Transaction'); } }
    else if (n.comfort<30 && !c.rt.did2){ c.rt.did2=true; if (buyService(c,'svc_home_repair')) remember(c,'Paid a carpenter to fix up the house.',3); }
  }
}
const PROD = {
  Farmer:{every:40, tool:true}, Rancher:{every:30, tool:true}, Fisher:{every:70, make:'good_fish', tool:true},
  Woodcutter:{every:55, make:'good_timber', tool:true}, Miner:{every:75, make:'good_ore', tool:true},
  Baker:{every:45, make:'good_bread'}, TavernKeeper:{every:60, make:'good_ale'}, Butcher:{every:90, make:'good_meat'},
  Blacksmith:{every:220, make:'good_tools', cap:3}, Carpenter:{every:150, make:'good_furniture', cap:3},
  Unemployed:{every:95, make:'good_timber'}
};
function useTool(c, every){
  c.tool = Math.max(0, c.tool - 0.012);
  if (c.tool>=10) return every;
  if (S.minute-(c.lastTry.tools||-999)>180){ c.lastTry.tools=S.minute;
    if (buy(c,'good_tools',1)){ c.inventory.good_tools--; if (!c.inventory.good_tools) delete c.inventory.good_tools; c.tool=100; remember(c,'Bought a new set of iron tools.',3,['good_tools'],'Transaction'); }
    else if (!c.lastTry.toolLog){ c.lastTry.toolLog=1; remember(c,'My tools are worn out and I can\'t replace them.',5); } }
  return every*2;
}
function work(c){
  const P = PROD[c.profession]; if (!P) return;
  const season = seasonOf(dayOf(S.minute));
  let every = P.every;
  if (c.profession==='Farmer'){ if (S.weather==='Snow') every*=2; if (S.weather==='Rain') every*=0.85; if (season===3) every*=1.4; }
  if (c.profession==='Fisher'){ if (S.weather==='Rain') every*=0.8; if (S.weather==='Snow') every*=1.4; if (season===3) every*=1.2; }
  if (P.tool) every = useTool(c, every);
  if (c.profession==='TavernKeeper' && MEAL_INGREDIENTS.reduce((a,g)=>a+(c.inventory[g]||0),0) < 4 && S.minute-(c.lastTry.ingr||-999)>=30){
    c.lastTry.ingr=S.minute; const g = MEAL_INGREDIENTS.filter(g=>listed(g)>0).sort((a,b)=>foodValue(a)-foodValue(b))[0]; if (g) buy(c,g,3);
  }
  if (c.profession==='Rancher') return ranch(c, every);
  const make = c.profession==='Farmer' ? (hash(c.id+S.minute)%100<60?'good_wheat':'good_vegetables') : P.make;
  const def = GD[make];
  if (P.cap && listed(make) >= P.cap*S.citizens.filter(o=>o.profession===c.profession).length) return;
  if (listed(make, c.id) >= 24) return;
  if (def.recipe){
    for (const g in def.recipe){
      if ((c.inventory[g]||0) < def.recipe[g]){
        if (S.minute-(c.lastTry[g]||-999) >= 30){ c.lastTry[g]=S.minute; buy(c, g, def.recipe[g]*(g==='good_livestock'?1:2)); }
        if ((c.inventory[g]||0) < def.recipe[g]) return;
      }
    }
  }
  c.workAcc++;
  c.needs.energy = clamp(c.needs.energy-0.015,0,100);
  if (c.workAcc < every) return;
  c.workAcc = 0;
  if (def.recipe) for (const g in def.recipe){ c.inventory[g]-=def.recipe[g]; if (c.inventory[g]<=0) delete c.inventory[g]; }
  c.inventory[make] = (c.inventory[make]||0)+(def.yield||1);
  const keep = make==='good_bread' ? 2 : 0;
  if (c.inventory[make] > keep) list(c, make, c.inventory[make]-keep);
}
function ranch(c, every){
  c.workAcc++; c.herdAcc = (c.herdAcc||0)+1;
  const h = S.herd;
  if (c.workAcc >= every){ c.workAcc=0;
    const make = (hash(c.id+S.minute)%2 && h.cow>0) ? 'good_milk' : (h.chicken>0 ? 'good_eggs' : null);
    if (make && listed(make,c.id)<24){ c.inventory[make]=(c.inventory[make]||0)+1; list(c,make,1); }
  }
  if (c.herdAcc >= 200){ c.herdAcc=0;
    const r = hash(c.id+S.minute)%100; const k = r<30?'chicken':r<58?'sheep':r<82?'pig':'cow';
    if (k==='chicken' ? h.chicken<30 : h.cow+h.sheep+h.pig<46){ h[k]++;
      if (k==='cow' && hash(c.id+S.minute+'c')%2===0) chronicle(`A calf was born in the west pasture. ${c.name} named it ${pick(['Buttercup','Clover','Dot','Bramble','Pudding','Maple','Biscuit'])}.`, 3, '🐄', 'farm'); }
  }
  const big = h.cow+h.sheep+h.pig;
  if (big - listed('good_livestock') > 10 && S.minute-(c.lastTry.ls||-999)>60){ c.lastTry.ls=S.minute; c.inventory.good_livestock=(c.inventory.good_livestock||0)+1; list(c,'good_livestock',1); }
}
function adjustRel(a, b, delta){
  const r = a.rel[b.id]; const before = r.affinity;
  r.affinity = clamp(Math.round(r.affinity+delta), -100, 100);
  r.trust = clamp(r.trust + (delta>0?0.01:-0.02), 0, 1);
  r.familiarity = clamp(r.familiarity+0.02,0,1); r.last = S.minute;
  if (before<50 && r.affinity>=50 && !r.tags.includes('Friend') && !r.tags.includes('Family')){
    r.tags.push('Friend'); r.tags = r.tags.filter(t=>t!=='Rival');
    const rb = b.rel[a.id]; if (rb.affinity>=35 && !rb.tags.includes('Friend')){ rb.tags.push('Friend'); rb.tags=rb.tags.filter(t=>t!=='Rival'); chronicle(`${a.name} and ${b.name} have become friends.`, 4, '🤝', 'social'); S.week.rels.push(`${a.name} & ${b.name} became friends`); remember(a,`${b.name} has become a real friend.`,6,[b.id]); remember(b,`${a.name} has become a real friend.`,6,[a.id]); }
  }
  if (before>-50 && r.affinity<=-50 && !r.tags.includes('Rival')){
    r.tags.push('Rival'); r.tags = r.tags.filter(t=>t!=='Friend');
    chronicle(`${a.name} now considers ${b.name} a rival.`, 5, '⚔️', 'social'); S.week.rels.push(`${a.name} turned against ${b.name}`);
    remember(a,`I can't stand ${b.name} anymore.`,6,[b.id]);
  }
}
function placeName(loc){ const n = LOC[loc] ? LOC[loc].name : 'town'; return n.startsWith('The ') ? n : 'the '+n; }
function socialize(c){
  const here = S.citizens.filter(o => o!==c && !o.rt.path && o.rt.loc===c.rt.loc && ['Socializing','Idle','Working','AttendingTownHall'].includes(o.rt.state));
  if (!here.length) return;
  const o = here[Math.floor(rnd()*here.length)];
  const ra = c.rel[o.id];
  const shared = c.values.filter(v=>o.values.includes(v)).length;
  let delta = 0.5 + (c.personality.agreeableness + o.personality.agreeableness - 1)*1.2 + shared*0.6 + rnd()*2 - 1;
  if (delta>0) delta *= Math.max(0.15, 1 - ra.affinity/110);
  const rival = ra.tags.includes('Rival');
  if (rival) delta -= 4;
  const quarrelChance = (rival?0.1:0.012) + (c.traits.includes('Stubborn')?0.03:0) + (o.traits.includes('Stubborn')?0.03:0) + (c.traits.includes('Reckless')&&c.rt.loc==='loc_tavern'?0.04:0);
  const place = placeName(c.rt.loc);
  if (rnd() < quarrelChance){
    delta = -9 - rnd()*8;
    S.week.quarrels++;
    const topic = pick(['the price of timber','an unpaid debt','the east grove','who gets the corner table','last week\'s vote','a borrowed cart','whose turn it is at the well','a runaway pig','the best fishing spot']);
    chronicle(`${c.name} and ${o.name} argued about ${topic} at ${place}.`, rival?5:4, '💢', 'social');
    remember(c,`Argued with ${o.name} about ${topic}.`,5,[o.id]); remember(o,`${c.name} picked a fight with me about ${topic}.`,5,[c.id]);
    setEmotion(c,'Angry',180); setEmotion(o,'Angry',120);
    S.bubbles.push({id:c.id, text:'!!', until:performance.now()+2500, gm:S.minute});
  } else {
    if (hash(c.id+S.minute)%6===0) remember(c,`Chatted with ${o.name} at ${place}.`,2,[o.id],'Dialogue');
    if (hash(c.id+S.minute)%4===0) S.bubbles.push({id:c.id, text:pick(['…','♪','ha!','♥','?']), until:performance.now()+1800, gm:S.minute});
  }
  adjustRel(c,o,delta); adjustRel(o,c,delta*0.8);
  if (c.traits.includes('Gossip') && rnd()<0.3){
    const juicy = c.memory.records.filter(m=>m.imp>=5 && m.kind!=='Reflection' && !m.subj.includes(o.id) && S.minute-m.t<3*DAY).sort((a,b)=>b.imp-a.imp)[0];
    if (juicy) remember(o, `${c.name.split(' ')[0]} told me: "${juicy.text}"`, 3, [c.id], 'Dialogue');
  }
  romance(c,o);
}
function romance(a,b){
  const ra=a.rel[b.id], rb=b.rel[a.id];
  if (a.partner || b.partner) return;
  if (ra.tags.includes('Family') || a.age<18 || b.age<18) return;
  const romantic = a.traits.includes('Romantic') || b.traits.includes('Romantic');
  if (romantic && ra.affinity>72 && !ra.tags.includes('Crush') && Math.abs(a.age-b.age)<=12){ ra.tags.push('Crush'); chronicle(`${a.name} has a crush on ${b.name}.`, 4, '💘', 'romance'); remember(a,`I think I'm falling for ${b.name}.`,7,[b.id]); }
  if (ra.tags.includes('Crush') && rb.tags.includes('Crush') && ra.affinity>85 && rb.affinity>80 && !a.courting && !b.courting){
    a.courting=b.id; b.courting=a.id; a.courtingSince=b.courtingSince=S.minute;
    chronicle(`${a.name} and ${b.name} are courting! The whole tavern is talking about it.`, 7, '💞', 'romance'); S.week.rels.push(`${a.name} & ${b.name} started courting`);
    remember(a,`${b.name} and I are together now.`,9,[b.id]); remember(b,`${a.name} and I are together now.`,9,[a.id]);
  }
}

function bestBy(f){ return S.citizens.slice().sort((a,b)=>f(b)-f(a))[0]; }
function validateProposal(p){
  if (!p.effects.length || p.effects.length>3) return 'An act may carry one to three effects.';
  if (activeLaws().length>=5) return 'Five laws are already in force.';
  for (const e of p.effects){
    if (e.effectType==='PriceMultiplier' && (e.magnitude<0.5||e.magnitude>2)) return 'Price multiplier out of range.';
    if (e.effectType==='SalesTax' && (e.magnitude<0||e.magnitude>0.3)) return 'Sales tax out of range.';
    if (e.effectType==='Subsidy' && (e.magnitude<1||e.magnitude>50)) return 'Subsidy out of range.';

function draftProposal(){

    proposerId:proposer.id, proposerRationale:C.rationale, proposedAtMinute:S.minute,
    triggeringIndicators:[{indicator:'price.good_timber', value:S.goods.good_timber.price, atMinute:S.minute},{indicator:'treasury.balance', value:S.treasury, atMinute:S.minute}],
    effects:JSON.parse(JSON.stringify(C.effects)), durationDays:C.durationDays,

  S.citizens.forEach(c => remember(c, `${proposer.name} proposed the ${p.title}. We vote at the town hall on ${WEEKDAYS[6]}.`, c===proposer?6:3, [proposer.id,p.proposalId]));
}
function weekSum(c, field, g){ let s=0; c.days.forEach(d=>{ s += g ? ((d[field]||{})[g]||0) : (d[field]||0); }); return s; }
function projectedImpact(c, p){
  let coins = 0;
  for (const e of p.effects){
    const goods = GOOD_DEFS.filter(g=>effTargets(e,g.id)).map(g=>g.id);
    if (e.effectType==='SalesTax') goods.forEach(g=>{ coins -= e.magnitude*S.goods[g].price*weekSum(c,'bought',g); coins -= 0.5*e.magnitude*S.goods[g].price*weekSum(c,'sold',g); });
    if (e.effectType==='PriceMultiplier') goods.forEach(g=>{ const d=(1-e.magnitude)*S.goods[g].price; coins += d*weekSum(c,'bought',g) - d*weekSum(c,'sold',g); });
    if (e.effectType==='Subsidy' && c.profession===e.targetProfession) coins += e.magnitude*7;
    if (e.effectType==='Curfew' && c.profession==='TavernKeeper') coins -= 0.3*S.goods.good_ale.price*weekSum(c,'sold','good_ale') + 0.2*S.goods.svc_hot_meal.price*weekSum(c,'sold','svc_hot_meal');

const VALUE_TABLE = {
  Taxation:{plus:['Community','Order'], minus:['Prosperity','Freedom']},
  Subsidy:{plus:['Community','Family'], minus:['Freedom']},
  PriceControl:{plus:['Community','Family'], minus:['Prosperity','Freedom']},
  PublicOrder:{plus:['Order','Tradition','Family'], minus:['Freedom']},
  Zoning:{plus:['Order','Nature'], minus:['Freedom']},
  Labor:{plus:['Community','Family'], minus:['Prosperity']}

function castVote(c, p){
  const income = weekSum(c,'inc');
  const wallet = projectedImpact(c,p);
  const F = clamp(wallet / Math.max(income, 50), -1, 1);
  const wF = (c.traits.includes('Frugal')||c.traits.includes('Greedy')) ? 1.5 : 1;
  let rNum=0, rDen=0; const influencedBy=[];
  p.votes.forEach(v => { const r=c.rel[v.citizenId]; if (!r || r.affinity<=20 || v.choice==='Abstain') return; const w=(r.affinity/100)*r.trust; rNum += w*(v.choice==='Yes'?1:-1); rDen += w; influencedBy.push(v.citizenId); });
  const R = rDen ? rNum/rDen : 0;
  const tbl = VALUE_TABLE[p.category] || {plus:[],minus:[]};
  let V = 0; c.values.forEach(v=>{ if (tbl.plus.includes(v)) V+=.5; if (tbl.minus.includes(v)) V-=.5; });
  if ((p.key==='lumber_tax'||p.key==='fish_limit'||p.key==='meat_tax') && c.values.includes('Nature')) V += .5;
  V = clamp(V,-1,1);
  const tF = 0.5*F*wF, tR = 0.3*R, tV = 0.2*V;
  let score = tF + tR + tV;

  const choice = score>0.1?'Yes':score<-0.1?'No':'Abstain';
  const terms = [['Financial',Math.abs(tF)],['Relationships',Math.abs(tR)],['Values',Math.abs(tV)]].sort((a,b)=>b[1]-a[1]);
  let motivation = choice==='Abstain' ? 'Indifference' : terms[0][0];
  const prop = cById(p.proposerId); const isRival = prop && c.rel[prop.id] && c.rel[prop.id].tags.includes('Rival');
  if (isRival && choice==='No' && motivation==='Relationships') motivation='Spite';
  const ally = influencedBy.map(cById).sort((a,b)=>c.rel[b.id].affinity-c.rel[a.id].affinity)[0];
  const statement = voteStatement(c, p, choice, motivation, wallet, ally, isRival?prop:null);
  p.votes.push({citizenId:c.id, choice, confidence:+Math.min(1,Math.abs(score)).toFixed(2), primaryMotivation:motivation, publicStatement:statement, castAtMinute:S.minute, decidedBy:'Fallback', influencedBy:influencedBy.slice(0,5), walletImpact:wallet});
  remember(c, `I voted ${choice} on the ${p.title}. ${choice==='Abstain'?'It barely touches me.':motivation==='Financial'?`It would ${wallet>=0?'help':'cost'} me about ${Math.abs(wallet)} coins a week.`:motivation==='Values'?'It is about what kind of town we are.':ally?`I stood with ${ally.name}.`:'I followed my gut.'}`, 5, [p.proposalId], 'Vote');
  S.bubbles.push({id:c.id, text:choice==='Yes'?'AYE':choice==='No'?'NAY':'…', until:performance.now()+4000, gm:S.minute});
}
function voteStatement(c,p,choice,mot,wallet,ally,rival){
  const v = c.values[0];
  if (c.id===p.proposerId) return p.proposerRationale;
  if (choice==='Abstain') return pick(['Doesn\'t touch me much either way.','I\'ll leave this one to the rest of you.','Wake me when it\'s over.']);
  if (mot==='Financial') return choice==='Yes' ? pick([`That's coin back in my pocket. Aye.`,`Good for business. Aye.`,`My purse says yes.`]) : pick([`I can't afford this. Nay.`,`That's ${Math.abs(wallet)} coins a week out of my pocket. No.`,`We can't afford it.`]);
  if (mot==='Relationships') return choice==='Yes' ? `I stand with ${ally?ally.name.split(' ')[0]:'my friends'} on this.` : `If ${ally?ally.name.split(' ')[0]:'my friends'} says no, so do I.`;
  if (mot==='Spite') return `Anything ${rival?rival.name.split(' ')[0]:'that lot'} wants, I don't.`;
  const lines = {
    Community:['Good for the whole town.','We look after each other here.'], Nature:['The grove won\'t last another season.','Leave the land be.'],
    Order:['Rules keep us safe.','A town needs order.'], Tradition:['My parents would have voted the same.','It\'s how things were done.'],
    Freedom:['Nobody tells me what to do with my own coin.','Stop meddling in our lives.'], Prosperity:['Taxes choke trade.','Let the market decide.'],
    Family:['I\'m thinking of my family.','For the young ones.'], Craftsmanship:['Good work deserves a fair price.','Craft needs materials.']

function governanceTick(){

      if (!S.week.works){ S.week.works=1; chronicle(`The treasury hired ${poor.map(c=>c.name.split(' ')[0]).join(', ')} for road and fence repairs (${each}¢ each).`, 4, '🛠️', 'economy'); } }

const clock = {
  realAnchor: Date.now(), gameAnchor: 0, speed:1, paused:false,
  now(){ return this.paused ? this.gameAnchor : this.gameAnchor + (Date.now()-this.realAnchor)/MS_PER_GAME_MIN*this.speed; },
  rebase(g){ this.gameAnchor = (g===undefined ? this.now() : g); this.realAnchor = Date.now(); },

};

function collectLights(vx, vy, vw, vh){

  LAMPS.forEach(([x,y])=>{ const X=x*TILE+8, Y=y*TILE-6; if (inV(X,Y,60)) L.push([X,Y,56,0.95]); });
  BUILDINGS.forEach(b=>{ if (!b.windows || !litBuilding(b)) return; b.windows.forEach(([x,y,w,h])=>{ if (inV(x,y,40)) L.push([x+w/2,y+h,34,0.85]); }); if (b.lights) b.lights.forEach(([x,y])=>{ if (inV(x,y,50)) L.push([x,y,44,0.9,'rgba(255,150,60,0.25)']); }); });
  const smithy = BUILDINGS.find(b=>b.id==='loc_smithy'); if (litBuilding(smithy)) L.push([(smithy.x+smithy.w/2)*TILE,(smithy.y+smithy.h)*TILE,50,0.9,'rgba(255,120,40,0.3)']);
  if (S.festival){ for (let i=0;i<7;i++) L.push([(20.5+i*2)*TILE,15*TILE,44,0.9,'rgba(255,120,160,0.25)']); }
  S.citizens.forEach(c=>{ if (c.rt.path){ const X=c.rt.x*TILE+10, Y=c.rt.y*TILE+4; if (inV(X,Y,30)) L.push([X,Y,26,0.55]); } });
  return L;
}
function spawnParticles(dt, mod, season, vx, vy, vw, vh){
  const r = Math.random;
  BUILDINGS.forEach(b=>{ if (!b.chimney) return; const [x,y]=b.chimney; if (x<vx-20||x>vx+vw+20||y<vy-40||y>vy+vh+20) return;
    if (r()>dt*2.5 || !S.citizens.some(c=>c.rt.loc===b.id && !c.rt.path)) return;
    particles.push({x:x+r()*2-1, y, vx:5+r()*5, vy:-9-r()*5, life:2.6, max:2.6, col:r()<0.5?'#c8c8d0':'#a8a8b4', w:2, grow:1.2, a:0.55}); });
  const smith = BUILDINGS.find(b=>b.id==='loc_smithy');
  if (litBuilding(smith) && r()<dt*8) particles.push({x:(smith.x+2.5)*TILE, y:(smith.y+smith.h)*TILE-10, vx:(r()-.5)*40, vy:-25-r()*25, life:0.5, max:0.5, col:'#ffb040'});
  const area = vw*vh/(400*250);
  if (S.weather==='Rain'||S.weather==='Storm'){ const n=(S.weather==='Storm'?520:300)*area; for (let i=0;i<n*dt;i++){ const x=vx+r()*(vw+60), y=vy-10+r()*vh*0.3; particles.push({kind:'rain', x, y, vx:-60, vy:300+r()*80, life:2, max:2, floor:y+20+r()*vh*0.9}); } }
  if (S.weather==='Snow'){ for (let i=0;i<70*area*dt;i++) particles.push({x:vx+r()*vw, y:vy-2, vx:(r()-.5)*12, vy:14+r()*12, life:14, max:14, col:r()<0.7?'#ffffff':'#dfe8f2', w:r()<0.3?2:1}); }
  const night = mod<300||mod>1230;
  if (night && season===1 && r()<dt*6) particles.push({x:vx+r()*vw, y:vy+r()*vh, vx:(r()-.5)*8, vy:(r()-.5)*8, life:3, max:3, col:'#e8ff80', a:0.9});
  if (season===2 && r()<dt*4) particles.push({x:vx+r()*vw, y:vy, vx:-10-r()*8, vy:12+r()*8, life:8, max:8, col:pick(['#e8a040','#c8702a','#d8b040','#b04a1e']), w:2, h:1});
  if (S.festival && mod>16*60 && mod<22*60 && r()<dt*8) particles.push({x:(20+r()*12)*TILE, y:24*TILE, vx:(r()-.5)*14, vy:-50-r()*40, life:1.6, max:1.6, col:pick(['#ff6a8a','#f2c14e','#7fd1ae','#8fb8ff']), w:2});
  S.citizens.forEach(c=>{ if (c.profession==='Fisher' && c.rt.state==='Working' && !c.rt.path && r()<dt*0.15){ const X=c.rt.x*TILE+26, Y=c.rt.y*TILE+30; for (let i=0;i<6;i++) particles.push({x:X, y:Y, vx:(r()-.5)*30, vy:-20-r()*20, life:0.5, max:0.5, col:'#cfe6f6'}); } });
  if (particles.length>2500) particles.splice(0, particles.length-2500);
}

function download(name, text, type){ const a=document.createElement('a'); a.href=URL.createObjectURL(new Blob([text],{type})); a.download=name; document.body.appendChild(a); a.click(); setTimeout(()=>{URL.revokeObjectURL(a.href); a.remove();},500); }
function copyText(t, btn){
  const done = () => { if (btn){ const o=btn.textContent; btn.textContent='Copied ✓'; setTimeout(()=>btn.textContent=o,1500); } };
  if (navigator.clipboard && navigator.clipboard.writeText) navigator.clipboard.writeText(t).then(done, ()=>fallbackCopy(t,done)); else fallbackCopy(t,done);
}
function fallbackCopy(t,done){ const ta=document.createElement('textarea'); ta.value=t; document.body.appendChild(ta); ta.select(); try{ document.execCommand('copy'); done(); }catch(e){ prompt('Copy this:', t); } ta.remove(); }

function sparkline(arr){
  const a = arr.slice(-72); if (a.length<2) return '';
  const mn=Math.min(...a), mx=Math.max(...a), w=70, h=20;
  const pts=a.map((v,i)=>`${(i/(a.length-1)*w).toFixed(1)},${(h-2-(mx===mn?h/2:(v-mn)/(mx-mn)*(h-4))).toFixed(1)}`).join(' ');
  return `<svg width="${w}" height="${h}" viewBox="0 0 ${w} ${h}"><polyline points="${pts}" fill="none" stroke="#7fd1ae" stroke-width="1.5"/></svg>`;
}

const ptrs = new Map(); let drag=null, pinch=null, moved=false;
function screenToWorld(clientX, clientY){ const r=cv.getBoundingClientRect(); const {vx,vy}=viewRect(); return [vx + (clientX-r.left)*DPR/cam.z, vy + (clientY-r.top)*DPR/cam.z]; }
function clampCam(){ const {vx,vy,vw,vh}=viewRect(); cam.x=vx+vw/2; cam.y=vy+vh/2; }
function zoomAt(clientX, clientY, factor){
  const [wx,wy] = screenToWorld(clientX,clientY);
  cam.z = clampZ(cam.z*factor);
  const r=cv.getBoundingClientRect(); const vw=cv.width/cam.z, vh=cv.height/cam.z;
  cam.x = wx - (clientX-r.left)*DPR/cam.z + vw/2; cam.y = wy - (clientY-r.top)*DPR/cam.z + vh/2;
  clampCam();
}
cv.addEventListener('pointerdown', e=>{ try{ cv.setPointerCapture(e.pointerId); }catch(err){} ptrs.set(e.pointerId,{x:e.clientX,y:e.clientY}); moved=false;
  if (ptrs.size===1) drag={x:e.clientX,y:e.clientY,cx:cam.x,cy:cam.y}; else if (ptrs.size===2){ const [a,b]=[...ptrs.values()]; pinch={d:Math.hypot(a.x-b.x,a.y-b.y), z:cam.z, mx:(a.x+b.x)/2, my:(a.y+b.y)/2}; drag=null; } });
cv.addEventListener('pointermove', e=>{
  if (ptrs.has(e.pointerId)) ptrs.set(e.pointerId,{x:e.clientX,y:e.clientY});
  if (pinch && ptrs.size===2){ const [a,b]=[...ptrs.values()]; const d=Math.hypot(a.x-b.x,a.y-b.y); zoomAt(pinch.mx,pinch.my, clampZ(pinch.z*d/pinch.d)/cam.z); moved=true; return; }
  if (drag){ const dx=(e.clientX-drag.x), dy=(e.clientY-drag.y); if (Math.hypot(dx,dy)>5){ moved=true; cam.follow=false; $('zFollow').classList.remove('on'); cv.classList.add('dragging'); } if (moved){ cam.x = drag.cx - dx*DPR/cam.z; cam.y = drag.cy - dy*DPR/cam.z; clampCam(); } return; }
  hover(e);
});
function endPtr(e){ ptrs.delete(e.pointerId); if (ptrs.size<2) pinch=null; if (!ptrs.size){ if (!moved && drag) clickAt(e); drag=null; cv.classList.remove('dragging'); } }
cv.addEventListener('pointerup', endPtr); cv.addEventListener('pointercancel', endPtr);
cv.addEventListener('wheel', e=>{ e.preventDefault(); zoomAt(e.clientX,e.clientY, e.deltaY<0?1.15:1/1.15); }, {passive:false});
cv.addEventListener('mouseleave', ()=>$('tip').style.display='none');
$('zIn').onclick = ()=>{ const r=cv.getBoundingClientRect(); zoomAt(r.left+r.width/2, r.top+r.height/2, 1.4); };
$('zOut').onclick = ()=>{ const r=cv.getBoundingClientRect(); zoomAt(r.left+r.width/2, r.top+r.height/2, 1/1.4); };
$('zFit').onclick = ()=>{ cam.z = fitZ(); cam.x=WW/2; cam.y=WH/2; cam.follow=false; $('zFollow').classList.remove('on'); };
$('zFollow').onclick = ()=>{ if (!ui.sel){ $('tabs').querySelector('[data-p=people]').click(); return; } cam.follow=!cam.follow; $('zFollow').classList.toggle('on',cam.follow); if (cam.follow && cam.z<2.5*DPR) cam.z=clampZ(3*DPR); };
mini.addEventListener('click', e=>{ const r=mini.getBoundingClientRect(); cam.x=(e.clientX-r.left)/r.width*WW; cam.y=(e.clientY-r.top)/r.height*WH; cam.follow=false; clampCam(); });
function hitCitizen(wx,wy){ let best=null, bd=14; S.citizens.forEach(c=>{ if (!visibleCitizen(c)) return; const cx=c.rt.x*TILE+10, cy=c.rt.y*TILE+2; const d=Math.hypot(cx-wx,cy-wy); if (d<bd){bd=d;best=c;} }); return best; }
function hitBuilding(wx,wy){ return BUILDINGS.find(b=>wx>=b.x*TILE-2&&wx<(b.x+b.w)*TILE+2&&wy>=b.y*TILE-16&&wy<(b.y+b.h)*TILE); }
function hover(e){
  const [x,y]=screenToWorld(e.clientX,e.clientY); const tip=$('tip'); const c=hitCitizen(x,y); let html='';
  if (c) html=`<b>${esc(c.name)}</b> · ${esc(profLabel(c.profession))}<br>${esc(doingText(c))}<br><span class="muted">${esc(c.mood.emotion)} · ${c.wallet}¢</span>`;

    else if (BRIDGE_TILES.some(([bx,by])=>Math.floor(x/TILE)===bx&&Math.floor(y/TILE)===by)) html=`<b>The old river bridge</b><br>${S.bridge.closed?'Collapsed':Math.round(S.bridge.health)+'% sound'}`;
    else if (Math.abs(x/TILE-WELL[0]-1)<1.3 && Math.abs(y/TILE-WELL[1]-0.5)<1.5) html='<b>Town Well</b><br><span class="muted">Households fetch water here each morning</span>';
    else { const tx=Math.floor(x/TILE), ty=Math.floor(y/TILE); for (const k of ['loc_pasture','loc_farm','loc_east_grove','loc_town_square','loc_market']){ if (LOC[k].rects.some(([a,b2,c2,d2])=>tx>=a&&tx<=c2&&ty>=b2&&ty<=d2)){ html=`<b>${LOC[k].name}</b>${k==='loc_pasture'?`<br>${esc(herdStr(S.herd))}`:''}`; break; } }
      const tt=(MAP[ty]||[])[tx]; if (!html && tt===T.DOCK) html='<b>Lake Docks</b>'; if (!html && tt===T.WATER) html= ty>36?'<b>Mirror Lake</b>':'<b>River Wend</b>'; if (!html && tt===T.ROCK && ty<10) html='<b>Deepvein Hills</b>'; }
  }

  const sr=$('stage').getBoundingClientRect(); tip.innerHTML=html; tip.style.display='block';
  tip.style.left = Math.min(e.clientX-sr.left+14, sr.width-250)+'px'; tip.style.top=(e.clientY-sr.top+14)+'px';

      <h2>Make the soundtrack on Suno</h2>
      <p class="muted" style="font-size:13px">Suno doesn't let other websites generate songs, so you make them on Suno. Copy a style prompt, then paste it into <a href="https://suno.com/create" target="_blank" rel="noopener">Suno Create</a> (Custom mode → Style, and turn on Instrumental).</p>
      ${MUSIC_PHASES.map(p=>`<div class="card"><div class="row" style="justify-content:space-between"><b>${p}</b><div class="row"><button class="btn" data-copy="${p}">Copy prompt</button><a class="btn" href="https://suno.com/create" target="_blank" rel="noopener" style="text-decoration:none">Open Suno ↗</a></div></div><pre>${esc(SUNO_PROMPTS[p])}</pre></div>`).join('')}
      <p class="muted" style="font-size:13px">Each week in the Weekly tab also has a ballad prompt with lyrics about that week's events.</p>`;
    $('mToggle').onclick = ()=>this.toggle();
    $('mVol').oninput = e => this.setVolume(+e.target.value);
    $('mAdd').onclick = ()=>{ const id=parseSunoId($('mUrl').value); if (!id){ alert('Paste a full suno.com/song/… link.'); return; } const title=$('mTitle').value.trim() || `${$('mPh').value} track`; this.cfg.tracks.push({id,title,phase:$('mPh').value}); this.save(); this.phase=null; this.update(); this.renderPanel(); };
    el.querySelectorAll('[data-ph]').forEach(s=>s.onchange=()=>{ t[+s.dataset.ph].phase=s.value; this.save(); this.phase=null; this.update(); });
    el.querySelectorAll('[data-del]').forEach(b=>b.onclick=()=>{ t.splice(+b.dataset.del,1); this.save(); this.phase=null; this.update(); this.renderPanel(); });
    el.querySelectorAll('[data-retry]').forEach(b=>b.onclick=(e)=>{ e.preventDefault(); t[+b.dataset.retry].failed=false; this.save(); this.phase=null; this.update(); this.renderPanel(); });
    el.querySelectorAll('[data-test]').forEach(b=>b.onclick=()=>{ this.playOneOff(t[+b.dataset.test].id); });
    el.querySelectorAll('[data-copy]').forEach(b=>b.onclick=()=>copyText(SUNO_PROMPTS[b.dataset.copy], b));
  }
};


// ---------- overlay ----------
function overlay(html){ $('overlayBox').innerHTML=html; $('overlay').style.display= html?'flex':'none'; }

// ---------- main loop ----------
let catchingUp = false;
function frame(ts){
  if (!catchingUp){
    const target = Math.floor(clock.now());
    const backlog = target - S.minute;
    if (backlog > 2000){ catchUp(backlog, 'Pixel Town kept running while this tab was in the background.'); }
    else {
      let n=0; const t0=performance.now();
      while (S.minute < target && n < 400 && performance.now()-t0 < 12){ simTick(); n++; if (modOf(S.minute)%60===0) saveGame(); }
      if (S.minute < target-60) clock.rebase(S.minute);
      if (n) syncAnimals();
    }
    const frac = clamp(clock.now() - S.minute, 0, 1);
    updateAnimals(Math.min(0.1,(ts-lastFrameTs)/1000));
    render(frac, ts);
    music.update();
    renderPanels(false);
  }
  requestAnimationFrame(frame);
}
function catchUp(minutes, reason, done){
  catchingUp = true;
  const cap = 7*DAY; const todo = Math.min(minutes, cap); const skipped = minutes - todo;
  const startLen = S.chronicle.length, startMin = S.minute; let doneN = 0;
  overlay(`<h3>While you were away…</h3><p>${esc(reason)}</p><p class="muted">Simulating ${Math.round(todo/60)} game hours (${(todo/DAY).toFixed(1)} days) for ${S.citizens.length} villagers…</p><div class="prog"><i id="progBar"></i></div>`);
  const chunk = () => {
    const t0 = performance.now();
    while (doneN < todo && performance.now()-t0 < 35){ simTick(); doneN++; }
    const pb=$('progBar'); if (pb) pb.style.width = (doneN/todo*100).toFixed(1)+'%';
    if (doneN < todo){ setTimeout(chunk, 0); return; }
    clock.rebase(S.minute); S.bubbles=[]; S.citizens.forEach(c=>c.rt.seg=null); syncAnimals(); saveGame(true);
    const news = S.chronicle.slice(startLen).filter(e=>e.imp>=6);
    overlay(`<h3>While you were away</h3><p>${(todo/DAY).toFixed(1)} game days passed in Pixel Town (${fmtStamp(startMin)} → ${fmtStamp(S.minute)}).${skipped>0?` The town slept through the rest: at most 7 game days are simulated while you're gone.`:''}</p>
      ${news.length?`<div>${news.slice(-25).map(e=>`<div class="ev ${e.imp>=7?'major':''}"><time>${esc(fmtStamp(e.t))}</time><span>${esc(e.icon)}</span><span>${esc(e.text)}</span></div>`).join('')}</div>`:'<p class="muted">Nothing major happened.</p>'}
      <div class="row" style="margin-top:12px"><button class="btn primary" id="ovClose">Back to town</button></div>`);
    $('ovClose').onclick = ()=>{ overlay(''); };
    catchingUp = false; ui.dirty=true; renderPanels(true); if (done) done();
  };
  setTimeout(chunk, 30);
}
function welcome(upgraded){
  overlay(`<h3>${upgraded?'Pixel Town has grown':'Welcome to Pixel Town'}</h3>
    ${upgraded?'<p>The town was rebuilt bigger: 50 villagers, ranchers and their animals, butchers, fishers on a new lake, a town well, and hi-bit art. A new chronicle starts today; your music settings were kept.</p>':''}
    <p>Fifty villagers live, work, trade, gossip and vote here on one shared clock: <b>1 real hour = 1 game day</b> (2.5 seconds per game minute).</p>
    <ul style="padding-left:18px;font-size:14px"><li>Drag to pan, scroll or pinch to zoom, and tap a villager to follow their life.</li>
    <li>Everything that happens goes into the <b>Log</b>, and each game week gets a report in <b>Weekly</b>.</li>
    <li>The town keeps running while the page is closed (up to 7 game days are simulated when you return).</li>
    <li>The first proposal, the Lumber Tax, comes up on Tideday and the town hall votes on it on Hallday evening.</li>
    <li>Turn on the soundtrack in <b>Music</b>, and add your own Suno songs there.</li></ul>
    <div class="row" style="margin-top:10px"><button class="btn primary" id="ovGo">Enter town</button><button class="btn" id="ovMusic">Enter with music ♪</button></div>`);
  $('ovGo').onclick = ()=>overlay('');
  $('ovMusic').onclick = ()=>{ overlay(''); if (!music.cfg.on) music.toggle(); };
}
function fmtAway(ms){ const m=Math.round(ms/60000); if (m<60) return `${m} minute${m===1?'':'s'}`; const h=Math.round(m/6)/10; if (h<48) return `${h} hours`; return `${Math.round(h/24)} days`; }
function boot(){
  buildMap();
  const sv = loadGame();
  let upgraded = false;
  if (sv){
    S = sv.state; RNG.s = S.rng || 1; S.bubbles = []; indexCitizens();
    clock.speed = sv.clock.speed||1; clock.paused = !!sv.clock.paused;
    clock.gameAnchor = S.minute; clock.realAnchor = Date.now();
    if (!clock.paused){
      const away = Math.floor((Date.now() - sv.savedAt)/MS_PER_GAME_MIN) + Math.max(0, Math.floor(sv.clock.gameAt) - S.minute);
      if (away > 30) catchUp(away, `You were away for ${fmtAway(Date.now()-sv.savedAt)}. Life went on without you.`);
    }
  } else {
    upgraded = !!store.get(OLD_SAVE_KEY); store.del(OLD_SAVE_KEY);
    S = newState(); S.bubbles = []; indexCitizens();
    openWeek(); S.weather='Clear';
    S.citizens.forEach(c=>{ c.plan = buildPlan(c, 0); });
    chronicle('Pixel Town is founded. Fifty villagers wake up to their first spring morning.', 7, '🏡', 'founding');
    chronicle('Word around the tavern: the old river bridge creaks badly under a full cart.', 5, '🌉', 'infrastructure');
    clock.gameAnchor = S.minute; clock.realAnchor = Date.now();
    saveGame(true);
    welcome(upgraded);
  }
  syncAnimals();
  music.renderPanel();
  resizeCanvas(); cam.x = 26*TILE; cam.y = 24*TILE; clampCam();
  renderPanels(true);
  requestAnimationFrame(frame);
}
let resetting = false;
document.addEventListener('visibilitychange', ()=>{ if (document.hidden && !resetting) saveGame(true); });
window.addEventListener('pagehide', ()=>{ if (!resetting) saveGame(true); });
(function(){
  const f=document.createElement('div'); f.className='row'; f.style.cssText='margin-top:4px;font-size:12px';
  f.innerHTML=`<span class="muted">Deterministic fallback AI · autosaves in this browser · drag to pan, scroll to zoom</span><button class="btn" id="resetBtn" style="margin-left:auto;font-size:12px">Reset town</button>`;
  $('stage').appendChild(f);
  $('resetBtn').onclick=()=>{ if (confirm('Start Pixel Town over from day 1? The log will be erased. Export it first if you want to keep it.')){ resetting=true; store.del(SAVE_KEY); location.reload(); } };
})();
window.PT = { get S(){return S;}, simulate(n){ for (let i=0;i<n;i++) simTick(); clock.rebase(S.minute); S.bubbles=[]; S.citizens.forEach(c=>c.rt.seg=null); syncAnimals(); renderPanels(true); }, clock, cam, music, weekToMarkdown, liveWeekEntry };
boot();
</script>
