<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Pixel Town</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&family=VT323&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#12131c; --panel:#1b1d2a; --panel-2:#23263a; --line:#33374f; --text:#e9e6da; --muted:#9a9cb3;
  --accent:#f2c14e; --accent-2:#7fd1ae; --bad:#e46a6a; --good:#7fd17f; --link:#8fb8ff;
}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--text);font:15px/1.45 system-ui,-apple-system,"Segoe UI",sans-serif}
button,select,input{font:inherit;color:inherit}
header{display:flex;flex-wrap:wrap;align-items:center;gap:10px 18px;padding:10px 16px;border-bottom:2px solid var(--line);background:var(--panel)}
h1{font:14px/1 "Press Start 2P",monospace;margin:0;color:var(--accent);letter-spacing:1px}
#clock{font:22px/1 VT323,monospace;display:flex;gap:14px;flex-wrap:wrap;align-items:baseline}
#clock b{color:var(--accent);font-weight:normal;font-size:26px}
.speed{display:flex;gap:4px;margin-left:auto}
.speed button,.btn{background:var(--panel-2);border:2px solid var(--line);border-radius:4px;padding:4px 9px;cursor:pointer}
.speed button.on,.btn.on{border-color:var(--accent);color:var(--accent)}
.btn:hover,.speed button:hover{border-color:var(--muted)}
.btn.primary{background:var(--accent);color:#1a1405;border-color:var(--accent)}
main{display:grid;grid-template-columns:minmax(0,1fr) 400px;gap:0;min-height:calc(100vh - 56px)}
#stage{position:relative;min-width:0;padding:12px 16px;display:flex;flex-direction:column;gap:8px}
#view{width:100%;aspect-ratio:384/216;image-rendering:pixelated;image-rendering:crisp-edges;border:2px solid var(--line);border-radius:4px;background:#000;cursor:crosshair;display:block}
#tip{position:absolute;pointer-events:none;background:rgba(15,16,26,.94);border:1px solid var(--line);padding:5px 8px;border-radius:4px;font-size:13px;display:none;max-width:240px;z-index:3}
#ticker{font:19px/1.2 VT323,monospace;color:var(--muted);min-height:24px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
#ticker span{color:var(--accent)}
.stats{display:flex;flex-wrap:wrap;gap:8px}
.stat{background:var(--panel);border:1px solid var(--line);border-radius:4px;padding:6px 10px;min-width:110px}
.stat small{display:block;color:var(--muted);font-size:11px;text-transform:uppercase;letter-spacing:.5px}
.stat strong{font:22px/1.1 VT323,monospace}
aside{border-left:2px solid var(--line);background:var(--panel);display:flex;flex-direction:column;min-height:0;max-height:calc(100vh - 56px);position:sticky;top:0}
.tabs{display:flex;flex-wrap:wrap;border-bottom:2px solid var(--line)}
.tabs button{flex:1;background:none;border:0;border-bottom:3px solid transparent;padding:9px 4px;cursor:pointer;color:var(--muted);font:10px/1 "Press Start 2P",monospace}
.tabs button.on{color:var(--accent);border-bottom-color:var(--accent)}
.panel{display:none;overflow:auto;padding:12px 14px;flex:1}
.panel.on{display:block}
h2{font:11px/1.4 "Press Start 2P",monospace;color:var(--accent-2);margin:14px 0 8px}
h2:first-child{margin-top:0}
.muted{color:var(--muted)}
.ev{display:grid;grid-template-columns:62px 22px 1fr;gap:4px;padding:5px 0;border-bottom:1px dashed var(--line);font-size:14px}
.ev time{font:17px/1.1 VT323,monospace;color:var(--muted)}
.ev.major{color:#fff}.ev.major time{color:var(--accent)}
.week{border:1px solid var(--line);border-radius:6px;margin-bottom:12px;background:var(--panel-2)}
.week summary{cursor:pointer;padding:10px 12px;list-style:none}
.week summary::-webkit-details-marker{display:none}
.week summary b{font:10px/1.5 "Press Start 2P",monospace;color:var(--accent)}
.week .body{padding:0 12px 12px;font-size:14px}
.week ul{margin:4px 0 8px;padding-left:18px}
table{border-collapse:collapse;width:100%;font-size:13px}
td,th{padding:4px 5px;border-bottom:1px solid var(--line);text-align:left;vertical-align:middle}
th{color:var(--muted);font-weight:normal;font-size:11px;text-transform:uppercase}
td.num{text-align:right;font-variant-numeric:tabular-nums}
.up{color:var(--bad)}.down{color:var(--good)}
.cit{display:flex;gap:8px;align-items:center;padding:6px;border-radius:4px;cursor:pointer;border:1px solid transparent}
.cit:hover{background:var(--panel-2)}
.cit.sel{border-color:var(--accent);background:var(--panel-2)}
.cit canvas{image-rendering:pixelated;width:24px;height:36px;flex:none}
.cit .who{flex:1;min-width:0}
.cit .who small{display:block;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.bar{height:7px;background:#0d0e16;border-radius:3px;overflow:hidden;margin:2px 0 6px}
.bar i{display:block;height:100%}
.needs{display:grid;grid-template-columns:70px 1fr 34px;gap:0 8px;font-size:12px;align-items:center}
.chip{display:inline-block;background:var(--panel-2);border:1px solid var(--line);border-radius:10px;padding:1px 8px;margin:2px 3px 2px 0;font-size:12px}
.law{border:1px solid var(--line);border-left:4px solid var(--accent-2);border-radius:4px;padding:8px 10px;margin-bottom:8px;background:var(--panel-2);font-size:14px}
.law.pending{border-left-color:var(--accent)}
.law.rej{border-left-color:var(--bad);opacity:.8}
.vote{font-size:13px;padding:3px 0;border-bottom:1px dashed var(--line)}
.Yes{color:var(--good)}.No{color:var(--bad)}.Abstain{color:var(--muted)}
.card{border:1px solid var(--line);border-radius:6px;padding:10px;margin-bottom:10px;background:var(--panel-2);font-size:14px}
.card pre{white-space:pre-wrap;font:13px/1.4 ui-monospace,monospace;background:#0f1018;padding:8px;border-radius:4px;margin:6px 0;max-height:160px;overflow:auto}
.row{display:flex;gap:6px;align-items:center;flex-wrap:wrap}
input[type=text],select{background:#0f1018;border:1px solid var(--line);border-radius:4px;padding:5px 7px}
input[type=text]{flex:1;min-width:140px}
a{color:var(--link)}
#overlay{position:fixed;inset:0;background:rgba(8,9,14,.82);display:none;align-items:center;justify-content:center;z-index:10;padding:16px}
#overlay .box{background:var(--panel);border:2px solid var(--accent);border-radius:8px;padding:18px 20px;max-width:560px;width:100%;max-height:85vh;overflow:auto}
#overlay h3{font:12px/1.5 "Press Start 2P",monospace;color:var(--accent);margin:0 0 10px}
.prog{height:10px;background:#0d0e16;border-radius:4px;overflow:hidden}.prog i{display:block;height:100%;background:var(--accent);width:0}
@media (max-width:980px){
  main{grid-template-columns:minmax(0,1fr)}
  aside{border-left:0;border-top:2px solid var(--line);max-height:none;position:static}
  .speed{margin-left:0}
  #stage{padding:10px 16px}
}
</style>
</head>
<body>
<header>
  <h1>PIXEL TOWN</h1>
  <div id="clock"></div>
  <div class="speed" id="speed"></div>
</header>
<main>
  <section id="stage">
    <canvas id="view" width="384" height="216"></canvas>
    <div id="tip"></div>
    <div id="ticker"></div>
    <div class="stats" id="stats"></div>
  </section>
  <aside>
    <div class="tabs" id="tabs">
      <button data-p="chron" class="on">Log</button>
      <button data-p="weeks">Weekly</button>
      <button data-p="people">People</button>
      <button data-p="market">Market</button>
      <button data-p="laws">Laws</button>
      <button data-p="music">Music</button>
    </div>
    <div class="panel on" id="p-chron"></div>
    <div class="panel" id="p-weeks"></div>
    <div class="panel" id="p-people"></div>
    <div class="panel" id="p-market"></div>
    <div class="panel" id="p-laws"></div>
    <div class="panel" id="p-music"></div>
  </aside>
</main>
<div id="overlay"><div class="box" id="overlayBox"></div></div>

<script>
'use strict';
/* =====================================================================
   Pixel Town — browser build of the Technical Design Document.
   One authoritative clock at 24x: 2.5 real s = 1 game minute.
   Deterministic per-minute pipeline: Time(100) → Governance(200) →
   Agents(300) → Economy(400). Laws are data pulled through lawQuery.
   Every decision uses the TDD's deterministic fallback path (no LLM).
   ===================================================================== */

// ---------- storage (may be unavailable) ----------
const store = {
  get(k){ try{ const v = localStorage.getItem(k); return v ? JSON.parse(v) : null; }catch(e){ return null; } },
  set(k,v){ try{ localStorage.setItem(k, JSON.stringify(v)); return true; }catch(e){ return false; } },
  del(k){ try{ localStorage.removeItem(k); }catch(e){} }
};
const SAVE_KEY = 'pixeltown.save.v1', MUSIC_KEY = 'pixeltown.music.v1';

// ---------- constants ----------
const TILE = 8, MW = 48, MH = 27, W = MW*TILE, H = MH*TILE;
const MS_PER_GAME_MIN = 2500;
const DAY = 1440, WEEK = 7*DAY;
const SEASONS = ['Spring','Summer','Fall','Winter'];
const WEEKDAYS = ['Moonday','Tideday','Windsday','Thornsday','Fireday','Starday','Hallday'];
const T = {GRASS:0,PATH:1,WATER:2,BRIDGE:3,TREE:4,BUILD:5,FIELD:6,PLAZA:7,ROCK:8,FOUNTAIN:9,FLOWER:10};
const WALK = new Set([T.GRASS,T.PATH,T.BRIDGE,T.PLAZA,T.FIELD,T.FLOWER]);
const clamp = (v,a,b) => v<a?a:v>b?b:v;
const pad2 = n => String(n).padStart(2,'0');

// ---------- seeded RNG (state lives in the save) ----------
const RNG = { s: 20260926,
  next(){ let t = (this.s = (this.s + 0x6D2B79F5) | 0); t = Math.imul(t ^ (t>>>15), t|1); t ^= t + Math.imul(t ^ (t>>>7), t|61); return ((t ^ (t>>>14))>>>0) / 4294967296; } };
const rnd = () => RNG.next();
const rint = (a,b) => a + Math.floor(rnd()*(b-a+1));
const pick = arr => arr[Math.floor(rnd()*arr.length)];
function hash(str){ let h = 2166136261; for (let i=0;i<str.length;i++){ h ^= str.charCodeAt(i); h = Math.imul(h,16777619); } return h>>>0; }
function mapRand(seed){ let s = seed; return () => { let t = (s = (s + 0x6D2B79F5)|0); t = Math.imul(t^(t>>>15),t|1); t ^= t + Math.imul(t^(t>>>7),t|61); return ((t^(t>>>14))>>>0)/4294967296; }; }

// ---------- map ----------
const BUILDINGS = [
  {id:'loc_clinic',    name:'Clinic',             x:4, y:3, w:4,h:3, roof:'#b5484a', wall:'#e7dcc2', kind:'shop'},
  {id:'loc_bakery',    name:'Marsh Bakery',       x:10,y:3, w:4,h:3, roof:'#c98b3a', wall:'#efe0bf', kind:'shop'},
  {id:'bld_town_hall', name:'Town Hall',          x:17,y:1, w:6,h:4, roof:'#465c8c', wall:'#d9d4c7', kind:'hall'},
  {id:'loc_tavern',    name:'The Tipsy Lantern',  x:26,y:3, w:5,h:4, roof:'#7a3f2a', wall:'#caa878', kind:'shop'},
  {id:'loc_carpentry', name:'Holt & Finch Carpentry', x:9,y:10,w:4,h:3, roof:'#8a6a3a', wall:'#d8c09a', kind:'shop'},
  {id:'loc_smithy',    name:'Brandt Smithy',      x:27,y:15,w:4,h:3, roof:'#555a66', wall:'#9a9690', kind:'shop'},
  {id:'loc_mine',      name:'Old Mine',           x:42,y:19,w:3,h:2, roof:'#6d6a70', wall:'#4a474e', kind:'mine'},
  {id:'loc_house_01',  name:'Holt House',         x:2, y:10,w:3,h:3, roof:'#9b5d3a', wall:'#e2d2b0', kind:'house'},
  {id:'loc_house_02',  name:'Finch House',        x:2, y:14,w:3,h:3, roof:'#5d7b4a', wall:'#e6d8b8', kind:'house'},
  {id:'loc_house_03',  name:'Reed Farmhouse',     x:14,y:22,w:3,h:3, roof:'#a8743a', wall:'#e9dcb9', kind:'house'},
  {id:'loc_house_04',  name:'Vale House',         x:18,y:22,w:3,h:3, roof:'#6a4a8a', wall:'#e0d6c8', kind:'house'},
  {id:'loc_house_05',  name:'Stone House',        x:22,y:22,w:3,h:3, roof:'#6b6b6b', wall:'#d6ccb8', kind:'house'},
  {id:'loc_house_06',  name:'Brandt House',       x:26,y:22,w:3,h:3, roof:'#8a3a3a', wall:'#d9c9ad', kind:'house'},
  {id:'loc_house_07',  name:'Cole House',         x:30,y:9, w:3,h:3, roof:'#3a6a7a', wall:'#e3d5b5', kind:'house'},
  {id:'loc_house_08',  name:'Ashby House',        x:30,y:22,w:3,h:3, roof:'#4a6a3a', wall:'#dccfb0', kind:'house'}
];
BUILDINGS.forEach(b => b.door = [b.x + Math.floor(b.w/2), b.y + b.h]);
const LOC = {};
BUILDINGS.forEach(b => { if (!b.id.startsWith('bld_')) LOC[b.id] = {id:b.id, name:b.name, indoor:true, door:b.door, b}; });
Object.assign(LOC, {
  loc_town_square: {id:'loc_town_square', name:'Town Square', indoor:false, c:[20,12], r:4},
  loc_market:      {id:'loc_market',      name:'Market',      indoor:false, c:[20,16], r:3},
  loc_farm:        {id:'loc_farm',        name:'Reed Farm',   indoor:false, c:[7,22],  r:4},
  loc_east_grove:  {id:'loc_east_grove',  name:'East Grove',  indoor:false, c:[41,12], r:2},
  loc_town_hall:   {id:'loc_town_hall',   name:'Town Hall Steps', indoor:false, c:[20,7], r:3}
});
const LAMPS = [[15,6],[25,6],[15,15],[25,15],[33,11],[36,14],[23,16],[8,8],[13,14],[31,19]];

const MAP = [];      // tile types
const TVAR = [];     // per-tile variation
function buildMap(){
  const mr = mapRand(77);
  for (let y=0;y<MH;y++){ MAP[y]=[]; TVAR[y]=[]; for (let x=0;x<MW;x++){ MAP[y][x]=T.GRASS; TVAR[y][x]=mr(); } }
  const set = (x,y,t) => { if (x>=0&&y>=0&&x<MW&&y<MH) MAP[y][x]=t; };
  for (let y=0;y<MH;y++){ set(34,y,T.WATER); set(35,y,T.WATER); }
  set(34,12,T.BRIDGE); set(35,12,T.BRIDGE); set(34,13,T.BRIDGE); set(35,13,T.BRIDGE);
  for (let y=0;y<=18;y++) for (let x=37;x<MW;x++){ const d=Math.hypot(x-41,y-12); if (d>2.6 && mr()<0.72) set(x,y,T.TREE); }
  for (let y=22;y<MH;y++) for (let x=38;x<MW;x++) if (mr()<0.8) set(x,y,T.ROCK);
  for (let y=0;y<MH;y++) for (let x=0;x<3;x++) if (y<9 && mr()<0.5) set(x,y,T.TREE);
  for (let y=19;y<=25;y++) for (let x=2;x<=12;x++) set(x,y,T.FIELD);
  for (let y=6;y<=15;y++) for (let x=15;x<=25;x++) set(x,y,T.PLAZA);
  set(19,10,T.FOUNTAIN); set(20,10,T.FOUNTAIN); set(19,11,T.FOUNTAIN); set(20,11,T.FOUNTAIN);
  BUILDINGS.forEach(b => { for (let y=b.y;y<b.y+b.h;y++) for (let x=b.x;x<b.x+b.w;x++) set(x,y,T.BUILD); });
  for (let y=17;y<=18;y++) for (let x=17;x<=22;x++) set(x,y,T.BUILD); // market stalls
  // carved routes east of the river
  for (let x=36;x<=41;x++) set(x,12,T.PATH);
  for (let y=12;y<=21;y++) set(36,y,T.PATH);
  for (let x=36;x<=43;x++) set(x,21,T.PATH);
  for (let x=36;x<=41;x++) set(x,13,MAP[13][x]===T.TREE?T.GRASS:MAP[13][x]);
  // auto-roads: route every door to the square and lay a path
  const targets = BUILDINGS.map(b => b.door).concat([[7,18],[20,16],[33,12]]);
  targets.forEach(d => { const p = astarRaw(d[0],d[1],20,15,true); if (p) p.forEach(([x,y]) => { if (MAP[y][x]===T.GRASS||MAP[y][x]===T.FLOWER) MAP[y][x]=T.PATH; }); });
  for (let x=33;x>=26;x--) if (MAP[12][x]===T.GRASS) MAP[12][x]=T.PATH;
  BUILDINGS.forEach(b => { const [x,y]=b.door; if (MAP[y][x]!==T.PLAZA) MAP[y][x]=T.PATH; });
  for (let y=0;y<MH;y++) for (let x=0;x<MW;x++) if (MAP[y][x]===T.GRASS && TVAR[y][x]<0.07) MAP[y][x]=T.FLOWER;
}
function walkable(x,y,opts){
  if (x<0||y<0||x>=MW||y>=MH) return false;
  const t = MAP[y][x];
  if (t===T.BRIDGE && opts && opts.bridgeClosed) return false;
  return WALK.has(t);
}
function tileCost(x,y){ const t=MAP[y][x]; return (t===T.PATH||t===T.PLAZA||t===T.BRIDGE)?1:t===T.FIELD?2.2:1.8; }
function astarRaw(sx,sy,tx,ty,building,opts){
  const key = (x,y)=>y*MW+x;
  const open = [[sx,sy]], g = new Map([[key(sx,sy),0]]), came = new Map(), f = new Map([[key(sx,sy),Math.abs(sx-tx)+Math.abs(sy-ty)]]);
  const closed = new Set();
  while (open.length){
    let bi=0; for (let i=1;i<open.length;i++) if (f.get(key(...open[i]))<f.get(key(...open[bi]))) bi=i;
    const [cx,cy] = open.splice(bi,1)[0]; const ck=key(cx,cy);
    if (cx===tx&&cy===ty){ const path=[[cx,cy]]; let k=ck; while (came.has(k)){ k=came.get(k); path.push([k%MW,Math.floor(k/MW)]); } return path.reverse(); }
    closed.add(ck);
    for (const [dx,dy] of [[1,0],[-1,0],[0,1],[0,-1]]){
      const nx=cx+dx, ny=cy+dy, nk=key(nx,ny);
      if (closed.has(nk)) continue;
      const isGoal = nx===tx&&ny===ty;
      if (!isGoal && !(building ? (nx>=0&&ny>=0&&nx<MW&&ny<MH&&WALK.has(MAP[ny][nx])) : walkable(nx,ny,opts))) continue;
      const ng = g.get(ck) + (building ? (MAP[ny]&&MAP[ny][nx]===T.PATH?0.6:1) : tileCost(nx,ny) + ((opts&&opts.blocked&&opts.blocked.has(nk))?999:0));
      if (!g.has(nk) || ng < g.get(nk)){ g.set(nk,ng); came.set(nk,ck); f.set(nk, ng + Math.abs(nx-tx)+Math.abs(ny-ty)); if (!open.some(o=>o[0]===nx&&o[1]===ny)) open.push([nx,ny]); }
    }
  }
  return null;
}
const pathCache = new Map();
function findPath(sx,sy,tx,ty){
  const k = `${sx},${sy}>${tx},${ty}|${S.bridge.closed?1:0}`;
  if (pathCache.has(k)) return pathCache.get(k).slice();
  const p = astarRaw(sx,sy,tx,ty,false,{bridgeClosed:S.bridge.closed});
  if (pathCache.size>3000) pathCache.clear();
  pathCache.set(k, p||null);
  return p ? p.slice() : null;
}
const SPOTS = {};
function spotsFor(locId){
  if (SPOTS[locId]) return SPOTS[locId];
  const L = LOC[locId]; const out=[];
  for (let y=L.c[1]-L.r;y<=L.c[1]+L.r;y++) for (let x=L.c[0]-L.r;x<=L.c[0]+L.r;x++){
    if (Math.hypot(x-L.c[0],y-L.c[1])<=L.r+0.3 && walkable(x,y)) out.push([x,y]);
  }
  return SPOTS[locId]=out;
}
function spotFor(c,locId){ const L=LOC[locId]; if (L.indoor) return L.door; const sp=spotsFor(locId); return sp[hash(c.id+locId)%sp.length]; }

// ---------- goods (8 resources + 3 services) ----------
const GOOD_DEFS = [
  {id:'good_wheat',     name:'Wheat',     kind:'Resource', cat:'Crop',    unit:'sheaf', base:3,  floor:1,  ceil:9,   e:0.6, a:0.25, perish:14, by:['Farmer']},
  {id:'good_vegetables',name:'Vegetables',kind:'Resource', cat:'Crop',    unit:'basket',base:4,  floor:1,  ceil:12,  e:0.6, a:0.25, perish:5,  by:['Farmer'], need:{hunger:35}},
  {id:'good_timber',    name:'Timber',    kind:'Resource', cat:'Timber',  unit:'log',   base:12, floor:4,  ceil:40,  e:0.7, a:0.25, by:['Woodcutter']},
  {id:'good_ore',       name:'Iron Ore',  kind:'Resource', cat:'Ore',     unit:'chunk', base:10, floor:3,  ceil:35,  e:0.6, a:0.25, by:['Miner']},
  {id:'good_bread',     name:'Bread',     kind:'Resource', cat:'Food',    unit:'loaf',  base:6,  floor:2,  ceil:20,  e:0.8, a:0.3,  perish:3,  by:['Baker'], recipe:{good_wheat:1}, need:{hunger:45}},
  {id:'good_ale',       name:'Ale',       kind:'Resource', cat:'Drink',   unit:'mug',   base:5,  floor:2,  ceil:16,  e:0.6, a:0.25, by:['TavernKeeper'], recipe:{good_wheat:1}, need:{fun:20,social:8}},
  {id:'good_tools',     name:'Iron Tools',kind:'Resource', cat:'Crafted', unit:'set',   base:40, floor:15, ceil:120, e:0.5, a:0.2,  by:['Blacksmith'], recipe:{good_ore:2,good_timber:1}},

// ---------- calendar ----------
const dayOf = m => Math.floor(m/DAY);
const modOf = m => ((m%DAY)+DAY)%DAY;
const seasonOf = d => Math.floor(d/28)%4;
const yearOf = d => Math.floor(d/112)+1;
function phaseOf(mod){ return mod<300?'Night':mod<420?'Dawn':mod<1080?'Day':mod<1260?'Dusk':'Night'; }
function fmtClock(m){ const mod=modOf(m); return pad2(Math.floor(mod/60))+':'+pad2(mod%60); }
function fmtDate(d){ return `${WEEKDAYS[d%7]}, ${SEASONS[seasonOf(d)]} ${d%28+1}, Year ${yearOf(d)}`; }
function fmtStamp(m){ const d=dayOf(m); return `Day ${d+1} ${fmtClock(m)}`; }

// ---------- chronicle + memory ----------
function chronicle(text, imp, icon, kind){

  if (S.chronicle.length>800) S.chronicle.splice(0, S.chronicle.length-800);

}
function remember(c, text, imp, subj, kind){
  const rec = {id:'mem_'+String(++S.memCounter).padStart(6,'0'), kind:kind||'Observation', t:S.minute, imp, text, subj:subj||[]};
  const recs = c.memory.records; recs.push(rec);
  if (recs.length>60){ let wi=0; for (let i=1;i<recs.length-5;i++) if (recs[i].imp<recs[wi].imp) wi=i; recs.splice(wi,1); }
  c.memory.since += imp;
}
function setEmotion(c, emo, minutes){ c.mood.emoForced = emo; c.mood.emoUntil = S.minute + minutes; }

// ---------- law query (pull-based modifiers) ----------
function activeLaws(){ return S.gov.proposals.filter(p=>p.status==='Enacted'); }
function effects(){ const out=[]; activeLaws().forEach(p=>p.effects.forEach(e=>out.push(e))); return out; }
function effTargets(e,g){ return e.targetGoodId===g || (e.targetCategory && GD[g].cat===e.targetCategory); }
const lawQuery = {
  priceMultiplier(g){ let m=1; effects().forEach(e=>{ if (e.effectType==='PriceMultiplier' && effTargets(e,g)) m*=e.magnitude; }); return m; },
  salesTax(g){ let r=0; effects().forEach(e=>{ if (e.effectType==='SalesTax' && effTargets(e,g)) r+=e.magnitude; }); return Math.min(.3,r); },
  subsidy(prof){ let s=0; effects().forEach(e=>{ if (e.effectType==='Subsidy' && e.targetProfession===prof) s+=e.magnitude; }); return s; },
  curfew(loc){ const e = effects().find(e=>e.effectType==='Curfew' && e.targetZoneId===loc); return e ? [e.startMinuteOfDay, e.endMinuteOfDay] : null; },
  isRestricted(loc, mod){ const w=this.curfew(loc); if (!w) return false; const [s,e]=w; return s<e ? (mod>=s&&mod<e) : (mod>=s||mod<e); }
};

// ---------- economy ----------
function hourIdx(){ return Math.floor(modOf(S.minute)/60); }
function recordDemand(g,q){ S.goods[g].dem[hourIdx()] += q; }
function recordUnmet(g,q){ S.goods[g].unmet[hourIdx()] += q; }
function recordSupply(g,q){ S.goods[g].sup[hourIdx()] += q; }
const sum = a => a.reduce((x,y)=>x+y,0);
const today = c => c.days[c.days.length-1];
function merchant(){ return S.citizens.find(c=>c.profession==='Merchant'); }
function pay(buyer, seller, g, price){
  const tax = Math.round(price * lawQuery.salesTax(g));
  const m = merchant(); const fee = (GD[g].kind==='Resource' && m && seller!==m && buyer!==m) ? Math.max(0, Math.round(price*0.08)) : 0;
  buyer.wallet -= price + tax;
  seller.wallet += price - fee; if (fee) { m.wallet += fee; today(m).inc += fee; S.week.income[m.id]=(S.week.income[m.id]||0)+fee; }
  S.treasury += tax;
  const bb = today(buyer), sb = today(seller);
  bb.exp += price+tax; bb.tax += tax; bb.bought[g] = (bb.bought[g]||0)+1;
  sb.inc += price-fee; sb.sold[g] = (sb.sold[g]||0)+1;
  S.week.trades++; S.week.volume += price; S.week.taxes += tax;
  S.week.income[seller.id] = (S.week.income[seller.id]||0) + price - fee;
  S.week.spent[buyer.id] = (S.week.spent[buyer.id]||0) + price + tax;
}
function buy(c, g, qty){
  recordDemand(g, qty);
  let got = 0;
  while (got < qty){
    const L = S.listings.find(l => l.g===g && l.qty>0 && l.seller!==c.id);
    if (!L) break;
    const price = S.goods[g].price, tax = Math.round(price*lawQuery.salesTax(g));
    if (c.wallet < price + tax) break;
    const seller = cById(L.seller);
    pay(c, seller, g, price);
    L.qty--; got++;
    c.inventory[g] = (c.inventory[g]||0) + 1;
  }
  if (got < qty) recordUnmet(g, qty-got);
  return got;
}
function list(c, g, qty){
  if (qty<=0) return;
  c.inventory[g] -= qty; if (c.inventory[g]<=0) delete c.inventory[g];
  const last = S.listings.find(l=>l.g===g && l.seller===c.id && l.at===dayOf(S.minute));
  if (last) last.qty += qty;
  else S.listings.push({g, seller:c.id, qty, at:dayOf(S.minute)});
  recordSupply(g, qty);
}
function providerAvailable(p, svc){
  const spec = GD[svc].svc;
  if (p.profession!==spec.prof || p.rt.state!=='Working' || p.rt.path) return false;
  if (spec.loc && p.rt.loc!==spec.loc) return false;
  return p.svcUsed < spec.cap;
}
function buyService(c, svc){
  recordDemand(svc, 1);
  const prov = S.citizens.find(p => p!==c && providerAvailable(p, svc));
  const price = S.goods[svc].price, tax = Math.round(price*lawQuery.salesTax(svc));
  if (!prov || c.wallet < price+tax){ recordUnmet(svc,1); return false; }
  pay(c, prov, svc, price); prov.svcUsed++;
  applyNeeds(c, GD[svc].need);
  return prov;
}
function applyNeeds(c, need){ if (!need) return; for (const k in need) c.needs[k] = clamp(c.needs[k]+need[k],0,100); }
function consume(c, g){ c.inventory[g]--; if (c.inventory[g]<=0) delete c.inventory[g]; applyNeeds(c, GD[g].need); }
function reprice(){
  const k = 5;
  GOOD_DEFS.forEach(def => {
    const st = S.goods[def.id];
    const D = sum(st.dem), Sp = sum(st.sup) + (def.kind==='Resource' ? S.listings.filter(l=>l.g===def.id).reduce((a,l)=>a+l.qty,0)*0.25 : 0);
    const target = def.base * Math.pow((D+k)/(Sp+k), def.e) * lawQuery.priceMultiplier(def.id);
    st.price = clamp(Math.round(st.price + def.a*(target - st.price)), def.floor, def.ceil);
    st.hist.push(st.price); if (st.hist.length>168) st.hist.shift();
  });
  const h = (hourIdx()+1)%24;
  GOOD_DEFS.forEach(def => { const st=S.goods[def.id]; st.dem[h]=0; st.sup[h]=0; st.unmet[h]=0; });
  S.listings = S.listings.filter(l=>l.qty>0);
}

// ---------- planning (deterministic fallback planner) ----------
function isTownHallDay(d){ return d%7===6; }
function buildPlan(c, day){
  const B=[]; let t=0; const home=c.home, work=c.work||'loc_town_square';
  const add=(end,act,loc,note,target)=>{ end=Math.min(DAY,Math.round(end)); if (end<=t) return; B.push({s:t,d:end-t,act,loc,note,target}); t=end; };
  const has = tr => c.traits.includes(tr);
  const jit = hash(c.id+day)%25;
  const hall = isTownHallDay(day) && hasHallBusiness(day);
  const outdoor = ['Farmer','Woodcutter','Unemployed'].includes(c.profession);
  const storm = S.weather==='Storm';
  const bridgeOut = S.bridge.closed && ['Woodcutter','Miner','Unemployed'].includes(c.profession);
  let wake = {Baker:270, Farmer:330, TavernKeeper:480}[c.profession] || 360;
  if (has('Lazy')) wake += 60; if (has('Hardworking')) wake -= 20; wake += jit;
  add(wake,'Sleep',home,'Sleeping');
  add(t+30,'Eat',home,'Breakfast at home');
  if (c.sick && c.profession!=='Doctor') add(t+60,'Trade','loc_clinic','Seeing Dr. Vance','svc_medical_checkup');
  const workLoc = c.profession==='Unemployed' ? (bridgeOut ? 'loc_town_square' : 'loc_east_grove') : work;
  const cantWork = (storm && outdoor) || bridgeOut;
  const workNote = cantWork ? (storm ? 'Sheltering from the storm' : 'The bridge is out; stuck on this side') : ({Farmer:'Tending the fields',Woodcutter:'Felling timber in the east grove',Miner:'Digging ore',Blacksmith:'Working the forge',Carpenter:'At the workbench',Baker:'Baking bread',TavernKeeper:'Running the tavern',Doctor:'Seeing patients',Merchant:'Minding the market stalls',Unemployed:'Odd jobs chopping wood'}[c.profession]);
  const workAct = cantWork ? 'Leisure' : (c.profession==='Unemployed' && has('Lazy') && hash(c.id+day+'l')%3===0 ? 'Leisure' : 'Work');
  const wLoc = cantWork ? home : workLoc;
  const curfew = lawQuery.curfew('loc_tavern');
  const tavernClose = curfew ? curfew[0] : 23*60;
  if (c.profession==='TavernKeeper'){
    add(15*60, 'Work','loc_tavern','Opening up the Tipsy Lantern');
    add(15*60+30,'Eat','loc_tavern','Quick bite in the kitchen');
    if (hall){ add(17*60+45,'Work','loc_tavern','Serving the afternoon crowd'); add(19*60+30,'AttendTownHall','loc_town_hall','Town hall meeting'); }
    add(tavernClose,'Work','loc_tavern', curfew ? 'Serving until the curfew bell' : 'Serving the evening crowd');
    add(tavernClose+30,'Leisure',home,'Counting the till');
    add(DAY,'Sleep',home,'Sleeping');
    return {day, by:'Fallback', blocks:B};
  }
  const endMorning = c.profession==='Baker' ? 11*60 : 12*60;
  add(endMorning, workAct, wLoc, workNote);
  if (has('Frugal') || c.wallet<25) add(t+60,'Eat',home,'Cheap lunch at home');
  else add(t+60,'Eat','loc_tavern','Lunch at the Tipsy Lantern','svc_hot_meal');
  let endWork = c.profession==='Baker' ? 15*60 : has('Hardworking') ? 18*60 : has('Lazy') ? 16*60+30 : 17*60+30;
  if (hall) endWork = Math.min(endWork, 17*60+30);
  add(endWork, workAct, wLoc, workNote);
  const civicSkip = c.politics.civicEngagement < .25 && hash(c.id+day+'h')%2===0;
  if (hall && !civicSkip){ add(17*60+45,'Leisure','loc_town_square','Heading to the town hall'); add(19*60+30,'AttendTownHall','loc_town_hall','Town hall meeting'); }
  const social = c.personality.extraversion>.45 || has('Gossip') || has('Charismatic');
  if (S.festival){ add(16*60,'Leisure',home,'Getting ready for the festival'); add(21*60+30,'Socialize','loc_town_square','Season festival on the square'); }
  else if (social && !storm){
    const end = Math.min(tavernClose, 21*60 + (has('Reckless')?120:30));
    if (end > t+30) add(end,'Socialize','loc_tavern','Evening at the tavern','svc_hot_meal');
  } else {
    if (!storm) add(Math.max(t,19*60),'Leisure','loc_town_square','Evening stroll by the fountain');
    add(t+45,'Eat',home,'Supper at home');
  }
  add(c.profession==='Baker'?20*60+30:22*60+ (has('Reckless')?60:0),'Leisure',home,'Winding down at home');
  add(DAY,'Sleep',home,'Sleeping');
  return {day, by:'Fallback', blocks:B};
}
function currentBlockIdx(c, mod){ const b=c.plan.blocks; for (let i=0;i<b.length;i++) if (mod>=b[i].s && mod<b[i].s+b[i].d) return i; return b.length-1; }

// ---------- agents ----------
const STATE_FOR = {Sleep:'Sleeping',Eat:'Consuming',Work:'Working',Socialize:'Socializing',Leisure:'Idle',Trade:'Trading',AttendTownHall:'AttendingTownHall',Travel:'Traveling',Idle:'Idle'};
function agentTick(c){
  const mod = modOf(S.minute);
  const n = c.needs, awake = c.rt.state!=='Sleeping';
  n.hunger = clamp(n.hunger - 0.062, 0, 100);
  n.energy = clamp(n.energy + (awake ? -(c.sick?0.1:0.058) : 0.21), 0, 100);
  n.social = clamp(n.social - 0.035*(0.6+c.personality.extraversion), 0, 100);
  n.fun    = clamp(n.fun - 0.03, 0, 100);
  n.comfort= clamp(n.comfort + (awake ? -0.024 : 0.028), 0, 100);
  const idx = currentBlockIdx(c, mod);

function work(c){

  const def = GD[make];
  if (P.cap && S.listings.filter(l=>l.g===make).reduce((a,l)=>a+l.qty,0) >= P.cap) return; // crafted goods made to demand
  if (S.listings.filter(l=>l.g===make && l.seller===c.id).reduce((a,l)=>a+l.qty,0) >= 24) return; // unsold stock piles up: stop producing

        if (S.minute-(c.lastTry[g]||-999) >= 30){ c.lastTry[g]=S.minute; buy(c, g, def.recipe[g]*2); }

function socialize(c){

  V = clamp(V,-1,1);
  const tF = 0.5*F*wF, tR = 0.3*R, tV = 0.2*V;
  let score = tF + tR + tV;
  if (c.id===p.proposerId) score = Math.max(score, 0.6);
  const choice = score>0.1?'Yes':score<-0.1?'No':'Abstain';
  const terms = [['Financial',Math.abs(tF)],['Relationships',Math.abs(tR)],['Values',Math.abs(tV)]].sort((a,b)=>b[1]-a[1]);
  let motivation = choice==='Abstain' ? 'Indifference' : terms[0][0];
  const rival = S.citizens.find(o=>o.id===p.proposerId && c.rel[o.id] && c.rel[o.id].tags.includes('Rival'));
  if (rival && choice==='No' && motivation==='Relationships') motivation='Spite';
  const ally = influencedBy.map(cById).sort((a,b)=>c.rel[b.id].affinity-c.rel[a.id].affinity)[0];
  const statement = voteStatement(c, p, choice, motivation, wallet, ally, rival);
  const v = {citizenId:c.id, choice, confidence:+Math.min(1,Math.abs(score)).toFixed(2), primaryMotivation:motivation, publicStatement:statement, castAtMinute:S.minute, decidedBy:'Fallback', influencedBy:influencedBy.slice(0,5), walletImpact:wallet};
  p.votes.push(v);
  remember(c, `I voted ${choice} on the ${p.title}. ${choice==='Abstain'?'It barely touches me.':motivation==='Financial'?`It would ${wallet>=0?'help':'cost'} me about ${Math.abs(wallet)} coins a week.`:motivation==='Values'?'It is about what kind of town we are.':ally?`I stood with ${ally.name}.`:'I followed my gut.'}`, 5, [p.proposalId], 'Vote');
  S.bubbles.push({id:c.id, text:choice==='Yes'?'AYE':choice==='No'?'NAY':'...', until:performance.now()+4000, gm:S.minute, long:statement});
}
function voteStatement(c,p,choice,mot,wallet,ally,rival){
  const v = c.values[0];
  if (c.id===p.proposerId) return p.proposerRationale;
  if (choice==='Abstain') return pick(['Doesn\'t touch me much either way.','I\'ll leave this one to the rest of you.','Wake me when it\'s over.']);
  if (mot==='Financial') return choice==='Yes' ? pick([`That's coin back in my pocket. Aye.`,`Good for business. Aye.`,`My purse says yes.`]) : pick([`I can't afford this. Nay.`,`That's ${Math.abs(wallet)} coins a week out of my pocket. No.`,`We can't afford it.`]);
  if (mot==='Relationships') return choice==='Yes' ? `I stand with ${ally?ally.name.split(' ')[0]:'my friends'} on this.` : `If ${ally?ally.name.split(' ')[0]:'my friends'} says no, so do I.`;
  if (mot==='Spite') return `Anything ${rival?rival.name.split(' ')[0]:'that lot'} wants, I don't.`;
  const lines = {
    Community:['Good for the whole town.','We look after each other here.'], Nature:['The grove won\'t last another season.','Leave the trees be.'],
    Order:['Rules keep us safe.','A town needs order.'], Tradition:['My father would have voted the same.','It\'s how things were done.'],
    Freedom:['Nobody tells me what to do with my own coin.','Stop meddling in our lives.'], Prosperity:['Taxes choke trade.','Let the market decide.'],
    Family:['I\'m thinking of my family.','For the children.'], Craftsmanship:['Good work deserves a fair price.','Craft needs materials.']
  };
  return pick(lines[v] || ['So be it.']);
}
function governanceTick(){
  const d = dayOf(S.minute), mod = modOf(S.minute);
  const p = S.gov.proposals.find(p=>p.status==='Debating'||p.status==='Voting');
  if (!p) return;
  if (p.status==='Debating' && S.minute>=p.voting.townHallAtMinute){
    p.status='Voting'; S.gov.voteOrder = [p.proposerId].concat(S.citizens.map(c=>c.id).filter(id=>id!==p.proposerId));
    S.gov.voteTimes = S.gov.voteOrder.map((id,i)=>p.voting.townHallAtMinute + 5 + i*4 + (hash(id+d)%3));
    chronicle(`The town hall meeting on the ${p.title} has begun.`, 5, '🏛️', 'law');
  }
  if (p.status==='Voting'){
    S.gov.voteOrder.forEach((id,i)=>{
      if (S.gov.voteTimes[i]!==S.minute) return;
      const c = cById(id);
      if (c.rt.loc==='loc_town_hall' && !c.rt.path) castVote(c,p);

    if (S.minute >= p.voting.townHallAtMinute + 60) tally(p);
  }
}
function tally(p){
  const yes=p.votes.filter(v=>v.choice==='Yes').length, no=p.votes.filter(v=>v.choice==='No').length, ab=p.votes.filter(v=>v.choice==='Abstain').length;
  const eligible = p.voting.eligibleVoterIds.length;
  const quorum = (yes+no) >= p.voting.quorumFraction*eligible;
  const passed = quorum && yes/(yes+no||1) > p.voting.passThreshold;
  p.status = passed ? 'Passed' : 'Rejected';
  p.tally = {yes,no,abstain:ab,absent:eligible-p.votes.length,quorum};
  if (!passed) S.gov.cooldown[p.key] = dayOf(S.minute);
  const msg = passed ? `The ${p.title} PASSED ${yes}–${no}${ab?` (${ab} abstained)`:''}. It takes effect at dawn.` : `The ${p.title} was REJECTED ${yes}–${no}${ab?` (${ab} abstained)`:''}${quorum?'':' (no quorum)'}.`;
  chronicle(msg, 8, passed?'✅':'❌', 'law');
  S.week.townHall = {title:p.title, id:p.proposalId, result:p.status, yes, no, abstain:ab, absent:p.tally.absent, proposer:cById(p.proposerId).name,
    statements:p.votes.slice(0,12).map(v=>({name:cById(v.citizenId).name, choice:v.choice, text:v.publicStatement, why:v.primaryMotivation}))};
  p.votes.forEach(v=>{ const c=cById(v.citizenId); const won=(v.choice==='Yes')===passed; if (v.choice==='Abstain') return;
    c.mood.valence = clamp(c.mood.valence + (won?0.1:-0.1),-1,1);
    if (!won && v.confidence>0.5) setEmotion(c,'Resentful',DAY/2); else if (won && v.confidence>0.5) setEmotion(c,'Proud',DAY/3); });
}
function dailyGovernance(){
  const d = dayOf(S.minute);
  S.gov.proposals.forEach(p=>{
    if (p.status==='Enacted' && p.expiresAtMinute && S.minute>=p.expiresAtMinute){ p.status='Expired'; chronicle(`The ${p.title} has expired.`, 6, '📜', 'law'); }
  });
  S.gov.proposals.forEach(p=>{
    if (p.status==='Passed'){ p.status='Enacted'; p.enactedAtMinute=S.minute; p.expiresAtMinute = p.durationDays ? S.minute + p.durationDays*DAY : null;
      chronicle(`The ${p.title} is now law${p.durationDays?` for ${p.durationDays} days`:''}.`, 7, '⚖️', 'law');
      S.citizens.forEach(c=>remember(c, `The ${p.title} became law today.`, 4, [p.proposalId]));
    }
  });
  if (d%7===1 || (d%7<=4 && d%7>=1 && !S.gov.proposals.some(p=>p.status==='Debating'))) draftProposal();
  // subsidies
  S.citizens.forEach(c=>{ const s=lawQuery.subsidy(c.profession); if (!s) return; if (S.treasury>=s){ S.treasury-=s; c.wallet+=s; today(c).inc+=s; } else if (!S.week.subsidyFail){ S.week.subsidyFail=1; chronicle(`The treasury is too empty to pay the ${c.profession.toLowerCase()} subsidy.`, 5, '💸', 'economy'); } });
}

// ---------- day / hour / minute pipeline ----------
function rollWeather(season){
  const r = rnd();
  const t = [[['Clear',.5],['Cloudy',.2],['Rain',.25],['Storm',.05]],[['Clear',.65],['Cloudy',.15],['Rain',.1],['Storm',.1]],[['Cloudy',.3],['Rain',.25],['Fog',.25],['Clear',.15],['Storm',.05]],[['Snow',.4],['Cloudy',.3],['Clear',.2],['Fog',.1]]][season];
  let a=0; for (const [w,p] of t){ a+=p; if (r<a) return w; } return 'Clear';
}
function dayStarted(){
  const d = dayOf(S.minute), season = seasonOf(d);
  if (d%7===0 && d>0) closeWeek();
  if (!S.week) openWeek();
  S.weather = rollWeather(season);
  S.week.weather[S.weather] = (S.week.weather[S.weather]||0)+1;
  if (S.weather==='Storm') chronicle('A storm rolls in over Pixel Town. Outdoor work is off for the day.', 4, '⛈️', 'weather');
  S.festival = d>0 && d%28===0;
  if (S.festival) chronicle(`The ${SEASONS[season]} Festival begins on the town square tonight!`, 7, '🎉', 'festival');
  if (d>0 && d%112===0) S.citizens.forEach(c=>c.age++);
  // bridge
  if (!S.bridge.closed){
    S.bridge.health = Math.max(0, S.bridge.health - (S.weather==='Storm'?8:1.6));
    if (S.bridge.health<=0){ S.bridge.closed=true; pathCache.clear(); chronicle('The old river bridge has collapsed! The east grove and the mine are cut off.', 9, '🌉', 'infrastructure'); S.citizens.forEach(c=>remember(c,'The bridge collapsed. Nobody can reach the grove or the mine.',8)); }
    else if (S.bridge.health<25 && !S.bridge.warned){ S.bridge.warned=true; chronicle('The river bridge is groaning under every cart. It will not last much longer.', 6, '🌉', 'infrastructure'); }
  }
  if ((S.bridge.health<60 || S.bridge.closed) && S.treasury>=220) repairBridge();
  // coin faucet and sinks
  // town charter: 2¢ hearth tax plus 4% of savings above 250¢; 2¢ founding stipend back to everyone
  S.citizens.forEach(c=>{ c.wallet += 2; const rent = Math.min(c.wallet, 2 + Math.floor(Math.max(0, c.wallet-250)*0.04)); c.wallet -= rent; S.treasury += rent; S.week.hearth=(S.week.hearth||0)+rent; });
  S.treasury = Math.max(0, S.treasury - 10);
  const doc = S.citizens.find(c=>c.profession==='Doctor'); if (doc && S.treasury>=12){ S.treasury-=12; doc.wallet+=12; today(doc).inc+=12; } // physician's retainer
  if (S.treasury > 300){ // public works: surplus goes back out as wages to the poorest
    const pot = Math.round((S.treasury-300)*0.25); const poor = S.citizens.slice().sort((a,b)=>a.wallet-b.wallet).slice(0,3);
    const each = Math.floor(pot/poor.length);
    if (each>0){ poor.forEach(c=>{ c.wallet+=each; today(c).inc+=each; }); S.treasury -= each*poor.length;
      if (!S.week.works){ S.week.works=1; chronicle(`The treasury hired ${poor.map(c=>c.name.split(' ')[0]).join(', ')} for road and fence repairs (${each}¢ each).`, 4, '🛠️', 'economy'); } }
  }
  // spoilage
  let spoiled=0; S.listings.forEach(l=>{ const p=GD[l.g].perish; if (p && d-l.at>=p){ spoiled+=l.qty; l.qty=0; } });
  if (spoiled>=10) chronicle(`${spoiled} units of food spoiled unsold at the market.`, 3, '🥀', 'economy');
  // citizen daily
  S.citizens.forEach(c=>{
    c.days.push(newDayBucket()); if (c.days.length>7) c.days.shift();
    c.svcUsed = 0; c.rt.did2=false; c.lastTry.toolLog=0;
    if (c.sick) c.sick++;
    if (c.sick>4){ c.sick=0; remember(c,'I finally shook off that illness on my own.',4); }
    if (!c.sick && rnd() < (season===3?0.04:0.02)){ c.sick=1; chronicle(`${c.name} woke up sick.`, 4, '🤒', 'health'); remember(c,'I woke up feeling awful.',5); }
    if (c.courting && c.rel[c.courting].affinity>=92 && S.minute-c.courtingSince > 14*DAY && c.id<c.courting && cById(c.courting).courting===c.id){ wedding(c, cById(c.courting)); }
  });
  dailyGovernance();
  S.citizens.forEach(c=>{ c.plan = buildPlan(c, d); c.rt.blockIdx = -1; });
}
function repairBridge(){
  const carps = S.citizens.filter(c=>c.profession==='Carpenter');
  const got = []; const woodBuyer = {id:'treasury'};
  let logs=0; while (logs<6){ const L=S.listings.find(l=>l.g==='good_timber'&&l.qty>0); if (!L) break; const price=S.goods.good_timber.price; if (S.treasury<price+120) break; const seller=cById(L.seller); S.treasury-=price; seller.wallet+=price; today(seller).inc+=price; today(seller).sold.good_timber=(today(seller).sold.good_timber||0)+1; L.qty--; logs++; }
  const wage = 60; carps.forEach(c=>{ S.treasury-=wage; c.wallet+=wage; today(c).inc+=wage; });
  const wasClosed = S.bridge.closed;
  S.bridge = {health:100, closed:false, warned:false}; pathCache.clear();
  chronicle(`${wasClosed?'The bridge is rebuilt!':'The river bridge has been repaired.'} The treasury paid ${carps.map(c=>c.name.split(' ')[0]).join(' and ')} for the work and bought ${logs} logs of timber.`, 8, '🔨', 'infrastructure');
  S.citizens.forEach(c=>remember(c, 'The bridge was repaired with treasury money.', carps.includes(c)?6:3));
}
function wedding(a,b){
  a.partner=b.id; b.partner=a.id; a.courting=b.courting=null;
  [a,b].forEach(x=>{ const o=x===a?b:a; const r=x.rel[o.id]; r.tags=r.tags.filter(t=>t!=='Crush'); r.tags.push('Spouse','Family'); });
  chronicle(`Wedding bells! ${a.name} and ${b.name} were married on the town square.`, 10, '💍', 'romance');
  S.week.rels.push(`${a.name} & ${b.name} got married`);
  S.citizens.forEach(c=>remember(c, `${a.name} and ${b.name} got married today.`, c===a||c===b?10:4, [a.id,b.id]));

}
function hourTick(){
  reprice();
  S.citizens.forEach(c=>{
    updateMood(c);
    if (c.memory.since >= 50) reflect(c);
  });
  const hist = S.goods.good_timber.hist;
  if (hist.length>=25){ const p=hist[hist.length-1], q=hist[hist.length-25]; if (p>=q*1.3 && !S.week.scarce){ S.week.scarce=1; chronicle(`Timber is scarce: prices jumped from ${q} to ${p} coins in a day.`, 5, '🪵', 'economy'); } }
}
function updateMood(c){
  const n=c.needs; const avg=(n.hunger+n.energy+n.social+n.comfort+n.fun)/5; const mn=Math.min(n.hunger,n.energy,n.social,n.comfort,n.fun);
  const target = clamp((avg-55)/45 + (c.wallet<20?-0.2:c.wallet>400?0.1:0) + (c.sick?-0.2:0), -1, 1);
  c.mood.valence = clamp(c.mood.valence + (target-c.mood.valence)*0.3, -1, 1);
  c.mood.stress = clamp(1 - mn/60 + (c.sick?0.2:0) + (c.wallet<20?0.2:0), 0, 1);
  c.mood.arousal = c.rt.state==='Sleeping'?0.1:c.rt.state==='Socializing'?0.7:0.4;
  let e;
  if (c.mood.emoForced && S.minute < c.mood.emoUntil) e = c.mood.emoForced;
  else if (c.mood.stress>0.65) e='Anxious';
  else if (c.mood.valence<-0.3) e='Sad';
  else if (n.fun<25) e='Bored';
  else if (c.mood.valence>0.5) e='Joyful';
  else e='Content';
  c.mood.emotion = e;
}
function reflect(c){
  const opts = [];
  const rels = Object.entries(c.rel).sort((a,b)=>b[1].affinity-a[1].affinity);
  const best = cById(rels[0][0]), worst = cById(rels[rels.length-1][0]);
  opts.push(`I've come to rely on ${best.name}. Whatever happens, they have my back.`);
  if (c.rel[worst.id].affinity < -20) opts.push(`I don't trust ${worst.name}, and I doubt I ever will.`);
  const inc = weekSum(c,'inc'), exp = weekSum(c,'exp');
  if (inc > exp*1.3 && inc>40) opts.push('Business has been good lately. I could afford to be more generous.');
  if (exp > inc*1.3 && exp>30) opts.push('I spend more than I earn. Something has to change.');
  const law = activeLaws()[0]; if (law) opts.push(`The ${law.title} is changing how I live, whether I like it or not.`);
  if (c.needs.social<35) opts.push('I have been lonely. I should spend more evenings with people.');
  if (c.sick) opts.push('Being ill makes me realise how fragile all of this is.');
  const text = opts[Math.floor(rnd()*opts.length)];
  remember(c, text, 6, [], 'Reflection');
  c.memory.since = 0; c.memory.lastReflection = S.minute;
}
function simTick(){
  S.minute++;
  const mod = modOf(S.minute);
  // Order 100: time
  if (mod===0) dayStarted();
  // Order 200: governance
  governanceTick();
  // Order 300: agents (stable id order)
  for (const c of S.citizens) agentTick(c);
  // Order 400: economy
  if (mod%60===0) hourTick();
}

function openWeek(){
  const d = dayOf(S.minute);
  S.week = {n:weekNo(d), startDay:d - d%7, trades:0, volume:0, taxes:0, quarrels:0, events:[], hungry:[], rels:[], income:{}, spent:{}, weather:{},
    prices:Object.fromEntries(GOOD_DEFS.map(g=>[g.id,S.goods[g.id].price])), treasuryStart:S.treasury, townHall:null, song:null};

const clock = {

    else { for (const k of ['loc_east_grove','loc_farm','loc_town_square','loc_market']){ const L=LOC[k]; if (Math.hypot(x/TILE-L.c[0],y/TILE-L.c[1])<L.r){ html=`<b>${L.name}</b>`; break; } } }
  }
  if (!html){ tip.style.display='none'; return; }
  const sr=$('stage').getBoundingClientRect(); tip.innerHTML=html; tip.style.display='block';
  tip.style.left = Math.min(e.clientX-sr.left+14, sr.width-250)+'px'; tip.style.top=(e.clientY-sr.top+14)+'px';
});
cv.addEventListener('mouseleave', ()=>$('tip').style.display='none');
cv.addEventListener('click', e=>{ const [x,y]=canvasPos(e); const c=hitCitizen(x,y); if (c){ ui.sel=c.id; $('tabs').querySelector('[data-p=people]').click(); } });

// ---------- music: built-in chiptune + Suno tracks ----------
const MUSIC_PHASES = ['Dawn','Day','Dusk','Night','Town Hall','Festival'];
const SUNO_PROMPTS = {
  'Dawn':'gentle 16-bit village morning theme, soft flute and marimba, birdsong, warm and hopeful, 80 bpm, instrumental, seamless loop',
  'Day':'cheerful chiptune town theme, bouncy square-wave lead, plucky bass, bustling market, 110 bpm, SNES RPG style, instrumental, seamless loop',
  'Dusk':'wistful pixel RPG sunset theme, nylon guitar, soft synth pads, lo-fi warmth, 90 bpm, instrumental, seamless loop',
  'Night':'calm nocturne for a sleeping fantasy village, music box and warm pads, distant crickets, 60 bpm, instrumental, seamless loop',
  'Town Hall':'stately 16-bit council march, snare rolls, brass fanfare, a hint of debate tension, 100 bpm, instrumental',
  'Festival':'festive folk jig, fiddle, accordion, hand claps, chiptune sparkles, 132 bpm, celebratory village dance, instrumental'
};
function parseSunoId(s){ const m = String(s).match(/([0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12})/i); return m ? m[1].toLowerCase() : null; }
const music = {
  cfg: Object.assign({tracks:[], volume:0.5, on:false}, store.get(MUSIC_KEY)||{}),
  ac:null, master:null, chipGain:null, timer:null, nextT:0, step:0, phase:null, source:null, audio:null, oneOff:null, status:'',
  save(){ store.set(MUSIC_KEY, {tracks:this.cfg.tracks, volume:this.cfg.volume, on:this.cfg.on}); },
  currentPhase(){
    const p = S.gov.proposals.find(p=>p.status==='Voting'); if (p) return 'Town Hall';
    const mod=modOf(S.minute); if (S.festival && mod>=16*60 && mod<22*60) return 'Festival';
    return phaseOf(mod);
  },
  ensureAudio(){
    if (this.ac) return;
    const AC = window.AudioContext || window.webkitAudioContext; if (!AC) return;
    this.ac = new AC(); this.master = this.ac.createGain(); this.master.gain.value = this.cfg.volume; this.master.connect(this.ac.destination);
    this.chipGain = this.ac.createGain(); this.chipGain.gain.value = 0.0; this.chipGain.connect(this.master);
  },
  toggle(){
    this.cfg.on = !this.cfg.on; this.save();
    if (this.cfg.on){ this.ensureAudio(); if (this.ac && this.ac.state==='suspended') this.ac.resume(); this.phase=null; this.update(); }
    else this.stopAll();
    this.renderPanel();
  },
  stopAll(){ if (this.audio){ this.audio.pause(); } this.stopChip(); this.source=null; this.phase=null; this.status='Music is off.'; },
  setVolume(v){ this.cfg.volume=v; this.save(); if (this.master) this.master.gain.value=v; if (this.audio) this.audio.volume=v; },
  trackFor(phase){ const t=this.cfg.tracks; const m=t.filter(x=>x.phase===phase); const any=t.filter(x=>x.phase==='Any'); const pool=m.length?m:any; if (!pool.length) return null; return pool[dayOf(S.minute)%pool.length]; },
  update(){
    if (!this.cfg.on || this.oneOff) return;
    const ph = this.currentPhase();
    if (ph===this.phase) return;
    this.phase = ph;
    const tr = this.trackFor(ph);
    if (tr && !tr.failed) this.playSuno(tr, ph); else this.playChip(ph);
    if (ui.tab==='music') this.renderPanel();
  },
  playSuno(tr, ph){
    this.stopChip();
    if (!this.audio){ this.audio = new Audio(); this.audio.loop = true; this.audio.preload='auto'; }
    const a = this.audio; const src = `https://cdn1.suno.ai/${tr.id}.mp3`;
    a.volume = this.cfg.volume;
    a.onerror = () => { tr.failed = true; this.save(); this.status = `Couldn't stream "${tr.title}" from Suno. Playing the built-in theme instead. Make sure the song is public.`; this.playChip(ph); if (ui.tab==='music') this.renderPanel(); };
    if (a.src!==src){ a.src = src; }
    a.play().then(()=>{ this.source={kind:'suno', tr}; this.status=`♪ Suno: "${tr.title}" (${ph})`; if (ui.tab==='music') this.renderPanel(); }).catch(()=>{ this.status='Tap "Music on" to allow playback.'; });
    this.source={kind:'suno',tr}; this.status=`♪ Loading "${tr.title}"…`;
  },
  playOneOff(id){
    this.ensureAudio(); this.stopChip(); this.oneOff=id; this.cfg.on=true; this.save();
    if (!this.audio){ this.audio=new Audio(); }
    this.audio.loop=false; this.audio.src=`https://cdn1.suno.ai/${id}.mp3`; this.audio.volume=this.cfg.volume;
    this.audio.onended = () => { this.oneOff=null; this.audio.loop=true; this.phase=null; this.update(); };
    this.audio.onerror = () => { this.oneOff=null; window.open(`https://suno.com/song/${id}`,'_blank','noopener'); this.phase=null; this.update(); };
    this.audio.play().catch(()=>{});
    this.status = '♪ Playing this week\'s song'; if (ui.tab==='music') this.renderPanel();
  },
  // --- tiny procedural chiptune engine ---
  THEMES: {
    'Dawn':{bpm:84,root:62,scale:[0,2,4,7,9],lead:'triangle',dens:.55,bass:true,hat:false},
    'Day':{bpm:112,root:64,scale:[0,2,4,7,9],lead:'square',dens:.75,bass:true,hat:true},
    'Dusk':{bpm:90,root:57,scale:[0,3,5,7,10],lead:'triangle',dens:.55,bass:true,hat:false},
    'Night':{bpm:62,root:57,scale:[0,3,5,7,10],lead:'sine',dens:.35,bass:false,hat:false},
    'Town Hall':{bpm:100,root:60,scale:[0,2,4,5,7,9,11],lead:'square',dens:.8,bass:true,hat:true,march:true},
    'Festival':{bpm:132,root:67,scale:[0,2,4,5,7,9],lead:'square',dens:.9,bass:true,hat:true}
  },
  playChip(ph){
    if (this.audio) this.audio.pause();
    this.ensureAudio(); if (!this.ac) return;
    this.theme = this.THEMES[ph]; this.phaseName=ph;
    const r = mapRand(hash(ph)); this.motif = Array.from({length:16},()=> r()<this.theme.dens ? Math.floor(r()*this.theme.scale.length*1.6) : -1);
    this.motifB = this.motif.map(n=> n<0?-1:(n+ (r()<.4?2:0)));
    this.chipGain.gain.cancelScheduledValues(this.ac.currentTime);
    this.chipGain.gain.setTargetAtTime(0.9, this.ac.currentTime, 0.4);
    if (!this.timer){ this.nextT = this.ac.currentTime+0.1; this.step=0; this.timer = setInterval(()=>this.schedule(), 30); }
    this.source={kind:'chip'}; this.status=`♪ Built-in chiptune: ${ph} theme`;
  },
  stopChip(){ if (this.timer){ clearInterval(this.timer); this.timer=null; } if (this.chipGain && this.ac) this.chipGain.gain.setTargetAtTime(0, this.ac.currentTime, 0.2); },
  note(freq, t, dur, type, vol){
    const o=this.ac.createOscillator(), g=this.ac.createGain(); o.type=type; o.frequency.value=freq;
    g.gain.setValueAtTime(0.0001,t); g.gain.exponentialRampToValueAtTime(vol,t+0.01); g.gain.exponentialRampToValueAtTime(0.0001,t+dur);
    o.connect(g); g.connect(this.chipGain); o.start(t); o.stop(t+dur+0.02);
  },
  noise(t, vol){
    const b=this.ac.createBuffer(1, this.ac.sampleRate*0.04, this.ac.sampleRate); const d=b.getChannelData(0); for (let i=0;i<d.length;i++) d[i]=(Math.random()*2-1)*(1-i/d.length);
    const s=this.ac.createBufferSource(), g=this.ac.createGain(); s.buffer=b; g.gain.value=vol; s.connect(g); g.connect(this.chipGain); s.start(t);
  },
  schedule(){
    const th=this.theme; if (!th) return;
    const spb = 60/th.bpm/2;
    const mtof = m => 440*Math.pow(2,(m-69)/12);
    while (this.nextT < this.ac.currentTime + 0.15){
      const i=this.step%16, bar=Math.floor(this.step/16)%4, t=this.nextT;
      const prog=[0,5,3,4][bar]; const sc=th.scale;
      const deg = (bar%2 ? this.motifB : this.motif)[i];
      if (deg>=0){ const oct=Math.floor(deg/sc.length); const m=th.root + sc[deg%sc.length] + 12*oct + (bar===3&&i>11?2:0); this.note(mtof(m), t, spb*1.6, th.lead, th.lead==='square'?0.06:0.11); }
      if (th.bass && i%4===0){ const bm = th.root-24 + [0,5,-3,-5][bar]; this.note(mtof(bm), t, spb*(th.march?1.2:3), 'triangle', 0.16); }
      if (th.bass && th.march && i%4===2) this.note(mtof(th.root-17+[0,5,-3,-5][bar]), t, spb, 'triangle', 0.1);
      if (th.hat && i%2===1) this.noise(t, 0.035);
      if (th.march && i%8===4) this.noise(t, 0.09);
      if (!th.hat && i===0 && bar===0) this.note(mtof(th.root+sc[0]+12), t, spb*6, 'sine', 0.04);
      this.nextT += spb; this.step++;
    }
  },
  renderPanel(){
    const el=$('p-music'); const t=this.cfg.tracks;
    el.innerHTML = `<h2>Music</h2>
      <div class="row"><button class="btn ${this.cfg.on?'on':'primary'}" id="mToggle">${this.cfg.on?'■ Music off':'▶ Music on'}</button>
      <label class="row muted" style="font-size:13px">Volume <input type="range" id="mVol" min="0" max="1" step="0.05" value="${this.cfg.volume}"></label></div>
      <p style="font-size:14px">${esc(this.cfg.on ? (this.status||'') : 'Music is off.')} <span class="muted">Now: ${esc(this.currentPhase())}</span></p>
      <p class="muted" style="font-size:13px">The soundtrack follows the town's clock: dawn, day, dusk and night, plus the town hall and the festivals. Every phase has a built-in chiptune. Add your own Suno songs below and they take over for their phase.</p>
      <h2>Your Suno tracks</h2>
      ${t.length?t.map((x,i)=>`<div class="card" style="padding:8px"><div class="row"><b style="flex:1">${esc(x.title)}</b>
        <select data-ph="${i}">${['Any'].concat(MUSIC_PHASES).map(p=>`<option ${p===x.phase?'selected':''}>${p}</option>`).join('')}</select>
        <button class="btn" data-test="${i}" title="Preview">▶</button><button class="btn" data-del="${i}" title="Remove">✕</button></div>
        <div class="muted" style="font-size:12px">${x.failed?'<span class="No">Could not stream. Is the song public?</span> ':''}<a href="https://suno.com/song/${esc(x.id)}" target="_blank" rel="noopener">suno.com/song/${esc(x.id.slice(0,8))}…</a>${x.failed?` · <a href="#" data-retry="${i}">retry</a>`:''}</div>
        ${x.failed?`<iframe src="https://suno.com/embed/${esc(x.id)}" width="100%" height="152" style="border:0;border-radius:6px;margin-top:6px" loading="lazy" allow="autoplay; encrypted-media" title="${esc(x.title)}"></iframe>`:''}</div>`).join(''):'<p class="muted">No Suno songs yet.</p>'}
      <div class="card"><b>Add a Suno song</b>
        <div class="row" style="margin-top:6px"><input type="text" id="mUrl" placeholder="https://suno.com/song/…"><select id="mPh">${MUSIC_PHASES.concat(['Any']).map(p=>`<option>${p}</option>`).join('')}</select></div>
        <div class="row" style="margin-top:6px"><input type="text" id="mTitle" placeholder="Title (optional)"><button class="btn primary" id="mAdd">Add</button></div>
        <p class="muted" style="font-size:12px;margin:6px 0 0">On Suno, open your song, choose Share → Copy link, and paste it here. Use the full <code>suno.com/song/…</code> address; if you copied a short <code>suno.com/s/…</code> link, open it and copy the address it lands on. The song must be public to stream.</p></div>
      <h2>Make the soundtrack on Suno</h2>
      <p class="muted" style="font-size:13px">Suno doesn't let other websites generate songs, so you make them on Suno. Copy a style prompt, then paste it into <a href="https://suno.com/create" target="_blank" rel="noopener">Suno Create</a> (Custom mode → Style, and turn on Instrumental).</p>
      ${MUSIC_PHASES.map(p=>`<div class="card"><div class="row" style="justify-content:space-between"><b>${p}</b><div class="row"><button class="btn" data-copy="${p}">Copy prompt</button><a class="btn" href="https://suno.com/create" target="_blank" rel="noopener" style="text-decoration:none">Open Suno ↗</a></div></div><pre>${esc(SUNO_PROMPTS[p])}</pre></div>`).join('')}
      <p class="muted" style="font-size:13px">Each week in the Weekly tab also has a ballad prompt with lyrics about that week's events.</p>`;
    $('mToggle').onclick = ()=>this.toggle();
    $('mVol').oninput = e => this.setVolume(+e.target.value);
    $('mAdd').onclick = ()=>{ const id=parseSunoId($('mUrl').value); if (!id){ alert('Paste a full suno.com/song/… link.'); return; } const title=$('mTitle').value.trim() || `${$('mPh').value} track`; this.cfg.tracks.push({id,title,phase:$('mPh').value}); this.save(); this.phase=null; this.update(); this.renderPanel(); };
    el.querySelectorAll('[data-ph]').forEach(s=>s.onchange=()=>{ t[+s.dataset.ph].phase=s.value; this.save(); this.phase=null; this.update(); });
    el.querySelectorAll('[data-del]').forEach(b=>b.onclick=()=>{ t.splice(+b.dataset.del,1); this.save(); this.phase=null; this.update(); this.renderPanel(); });
    el.querySelectorAll('[data-retry]').forEach(b=>b.onclick=(e)=>{ e.preventDefault(); t[+b.dataset.retry].failed=false; this.save(); this.phase=null; this.update(); this.renderPanel(); });
    el.querySelectorAll('[data-test]').forEach(b=>b.onclick=()=>{ this.playOneOff(t[+b.dataset.test].id); });
    el.querySelectorAll('[data-copy]').forEach(b=>b.onclick=()=>copyText(SUNO_PROMPTS[b.dataset.copy], b));
  }
};

// ---------- overlay ----------
function overlay(html){ $('overlayBox').innerHTML=html; $('overlay').style.display= html?'flex':'none'; }

// ---------- main loop ----------
let catchingUp = false;
function frame(ts){
  if (!catchingUp){
    const g = clock.now();
    const target = Math.floor(g);
    const backlog = target - S.minute;
    if (backlog > 3000){ catchUp(backlog, 'Pixel Town kept running while this tab was in the background.'); }
    else {
      let n=0; while (S.minute < target && n < 400){ const h=modOf(S.minute+1)===0||modOf(S.minute+1)%60===0; simTick(); n++; if (h) saveGame(); }
      if (S.minute < target) clock.rebase(S.minute);
    }
    const frac = clamp(clock.now() - S.minute, 0, 1);
    render(frac, ts);
    music.update();
    renderPanels(false);
  }
  requestAnimationFrame(frame);
}
function catchUp(minutes, reason, done){
  catchingUp = true;
  const cap = 7*DAY; const todo = Math.min(minutes, cap); const skipped = minutes - todo;
  const startLen = S.chronicle.length, startMin = S.minute; let doneN = 0;
  overlay(`<h3>While you were away…</h3><p>${esc(reason)}</p><p class="muted">Simulating ${Math.round(todo/60)} game hours (${(todo/DAY).toFixed(1)} days)…</p><div class="prog"><i id="progBar"></i></div>`);
  const chunk = () => {
    const t0 = performance.now();
    while (doneN < todo && performance.now()-t0 < 30){ simTick(); doneN++; }
    const pb=$('progBar'); if (pb) pb.style.width = (doneN/todo*100).toFixed(1)+'%';
    if (doneN < todo){ setTimeout(chunk, 0); return; }
    clock.rebase(S.minute); saveGame();
    const news = S.chronicle.slice(startLen).filter(e=>e.imp>=6);
    overlay(`<h3>While you were away</h3><p>${(todo/DAY).toFixed(1)} game days passed in Pixel Town (${fmtStamp(startMin)} → ${fmtStamp(S.minute)}).${skipped>0?` The town slept through the rest: at most 7 game days are simulated while you're gone.`:''}</p>
      ${news.length?`<div>${news.slice(-25).map(e=>`<div class="ev ${e.imp>=7?'major':''}"><time>${esc(fmtStamp(e.t))}</time><span>${esc(e.icon)}</span><span>${esc(e.text)}</span></div>`).join('')}</div>`:'<p class="muted">Nothing major happened.</p>'}
      <div class="row" style="margin-top:12px"><button class="btn primary" id="ovClose">Back to town</button></div>`);
    $('ovClose').onclick = ()=>{ overlay(''); };
    catchingUp = false; ui.dirty=true; renderPanels(true); if (done) done();
  };
  setTimeout(chunk, 30);
}
function welcome(){
  overlay(`<h3>Welcome to Pixel Town</h3>
    <p>Twelve villagers live, work, trade, gossip and vote here on one shared clock: <b>1 real hour = 1 game day</b> (2.5 seconds per game minute).</p>
    <ul style="padding-left:18px;font-size:14px"><li>Everything that happens goes into the <b>Log</b>, and each game week gets a report in <b>Weekly</b>.</li>
    <li>The town keeps running while the page is closed (up to 7 game days are simulated when you return).</li>
    <li>The first proposal, the Lumber Tax, comes up on Tideday and the town hall votes on it on Hallday evening.</li>
    <li>Turn on the soundtrack in <b>Music</b>, and add your own Suno songs there.</li></ul>
    <div class="row" style="margin-top:10px"><button class="btn primary" id="ovGo">Enter town</button><button class="btn" id="ovMusic">Enter with music ♪</button></div>`);
  $('ovGo').onclick = ()=>overlay('');
  $('ovMusic').onclick = ()=>{ overlay(''); if (!music.cfg.on) music.toggle(); };
}
function boot(){
  buildMap();
  const sv = loadGame();
  if (sv){
    S = sv.state; RNG.s = S.rng || 1; S.bubbles = [];
    clock.speed = sv.clock.speed||1; clock.paused = !!sv.clock.paused;
    clock.gameAnchor = S.minute; clock.realAnchor = Date.now();
    if (!clock.paused){
      // Offline time always runs at live speed (1x): the absolute clock kept ticking.
      const away = Math.floor((Date.now() - sv.savedAt)/MS_PER_GAME_MIN) + Math.max(0, Math.floor(sv.clock.gameAt) - S.minute);
      if (away > 30) catchUp(away, `You were away for ${fmtAway(Date.now()-sv.savedAt)}. Life went on without you.`);
    }
  } else {
    S = newState(); S.bubbles = [];
    openWeek(); S.weather='Clear';
    S.citizens.forEach(c=>{ c.plan = buildPlan(c, 0); });
    chronicle('Pixel Town is founded. Twelve villagers wake up to their first spring morning.', 7, '🏡', 'founding');
    chronicle('Word around the tavern: the old river bridge creaks badly under a full cart.', 5, '🌉', 'infrastructure');
    clock.gameAnchor = S.minute; clock.realAnchor = Date.now();
    saveGame();
    welcome();
  }
  music.renderPanel();
  renderPanels(true);
  requestAnimationFrame(frame);
}
function fmtAway(ms){ const m=Math.round(ms/60000); if (m<60) return `${m} minute${m===1?'':'s'}`; const h=Math.round(m/6)/10; if (h<48) return `${h} hours`; return `${Math.round(h/24)} days`; }
document.addEventListener('visibilitychange', ()=>{ if (document.hidden) saveGame(); });
window.addEventListener('pagehide', saveGame);

// ---------- footer controls (reset) ----------
(function(){
  const f=document.createElement('div'); f.className='row'; f.style.cssText='margin-top:4px;font-size:12px';
  f.innerHTML=`<span class="muted">Deterministic fallback AI · autosaves in this browser</span><button class="btn" id="resetBtn" style="margin-left:auto;font-size:12px">Reset town</button>`;
  $('stage').appendChild(f);
  $('resetBtn').onclick=()=>{ if (confirm('Start Pixel Town over from day 1? The log will be erased. Export it first if you want to keep it.')){ store.del(SAVE_KEY); location.reload(); } };
})();

// debug hooks
window.PT = { get S(){return S;}, simulate(n){ for (let i=0;i<n;i++) simTick(); clock.rebase(S.minute); renderPanels(true); }, clock, music, weekToMarkdown, liveWeekEntry };
boot();
