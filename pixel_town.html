function domEmotion(c){ const E=mindOf(c).emo; let best=null, bv=0.45; EMOS.forEach(k=>{ if (E[k]>bv){ bv=E[k]; best=k; } }); return best; }
function emotionsHour(c){
  const m=mindOf(c), E=m.emo, n=c.needs, N=c.personality.neuroticism;
  for (const k in E) E[k] *= (k==='love'?0.996:k==='sadness'?0.985:k==='shame'?0.99:0.975);
  if (n.hunger<25) E.fear=Math.min(1,E.fear+0.02);
  if (c.wallet<15 && isAdult(c)){ E.fear=Math.min(1,E.fear+0.008*(0.5+N)); E.shame=Math.min(1,E.shame+0.003); }
  if (n.social<25) E.sadness=Math.min(1,E.sadness+0.006*(0.5+N));
  if (n.fun>70 && n.social>55) E.joy=Math.min(1,E.joy+0.012);
  if (c.partner && peekRel(c,c.partner).affinity>60) E.love=Math.max(E.love,0.3);
  else if (loversOf(c).length) E.love=Math.max(E.love,0.35);
}
// what a villager cares about: the people closest to them and the causes their values point to
function updateCares(c){
  const m=mindOf(c);
  const ppl = Object.entries(c.rel).filter(([id])=>alive(id)).map(([id,r])=>({id, w:r.affinity/100 + (r.tags.includes('Family')?0.5:0) + (r.tags.includes('Spouse')||r.tags.includes('Lover')?0.6:0)})).filter(x=>x.w>0.55).sort((a,b)=>b.w-a.w).slice(0,3);
  m.cares = ppl.map(x=>({kind:'person', id:x.id, w:+Math.min(1.6,x.w).toFixed(2)})).concat(c.values.slice(0,2).map((v,i)=>({kind:'cause', key:v, w:i?0.6:0.9})));
  if (c.traits.includes('Greedy') || c.agenda==='fortune') m.cares.push({kind:'cause', key:'self', w:0.8});
}
function caresAbout(c, key){ return mindOf(c).cares.some(x=>x.kind==='cause' && x.key===key); }
// grievances: what a villager thinks is wrong with the town, scored by how much it hurts them
function grievancesOf(c){
  const m=mindOf(c), g=[], inc=Math.max(50, weekSum(c,'inc'));
  activeLaws().forEach(p=>{ if (p.key==='annex') return; let s = projectedImpact(c,p)/inc; const tbl=VALUE_TABLE[p.category]||{plus:[],minus:[]};
    c.values.forEach(v=>{ if (tbl.minus.includes(v)) s-=.3; if (tbl.plus.includes(v)) s+=.3; }); s += classStance(c,p.key)*0.6;
    if (s<-0.25) g.push({kind:'law', id:p.proposalId, key:p.key, text:`the ${p.title}`, s:+Math.min(1,-s).toFixed(2)}); });
  if (c.cls==='Poor') g.push({kind:'inequality', text:'how the rich keep getting richer', s:0.35 + (c.values.includes('Community')?0.2:0)});
  else if (c.values.includes('Community') && classCounts().Poor>=12) g.push({kind:'inequality', text:'how many neighbours are poor', s:0.35});
  const hp = propOf(c.home); const ho = hp && hp.owner!==c.id && alive(hp.owner);
  if (ho && !isLodging(c.home) && ho.cls==='Wealthy' && hp.owner!==c.partner) g.push({kind:'rent', target:ho.id, text:`paying rent to ${ho.name}`, s:0.3+(c.cls==='Poor'?0.25:0)});
  if (isLodging(c.home) && c.cls==='Poor' && !homeBuildings().some(b=>residentsOf(b.id).length===0)) g.push({kind:'rent', text:'having no home of their own', s:0.4});
  if (S.week.hungry.includes(c.name) || c.needs.hunger<25) g.push({kind:'hunger', text:'going hungry', s:0.6});
  if (c.profession==='Unemployed') g.push({kind:'jobs', text:'having no proper work', s:0.4});
  const L = S.gov.leader && alive(S.gov.leader);
  if (L && L!==c){ const a = peekRel(c,L.id).affinity; const plat = PLATFORMS[(S.gov.platforms||{})[L.id]||platformFor(L)];
    const clash = !c.values.some(v=>plat.plus.includes(v)) && (plat.econ||0)*c.politics.economicLeaning < -0.2;
    if (a<-25 || (clash && a<20)) g.push({kind:'leader', target:L.id, text:`${L.name} running the town`, s:0.3 + (a<-25?0.3:0) + (L.mind && L.mind.record ? 0.2 : 0)}); }
  BUILDINGS.forEach(b=>{ if (!['tavern','bathhouse','theater','hotel','bakery','butchery'].includes(b.biz)) return; const pr=propOf(b.id); if (!pr || pr.owner===c.id) return; const o=alive(pr.owner); if (!o) return;
    const r=peekRel(c,o.id); if ((bizMod(b.id)>=1.15 && r.affinity<0) || (r.tags.includes('Rival') && r.affinity<-40)) g.push({kind:'business', target:o.id, bid:b.id, text:`${o.name}'s ${b.name}`, s:+(0.25 + (r.tags.includes('Rival')?0.3:0) + Math.max(0,bizMod(b.id)-1)).toFixed(2)}); });
  if (c.agenda==='trouble') g.push({kind:'order', text:'all the rules in this town', s:0.35});
  if (m.swayed && m.swayed.until>dayOf(S.minute) && !g.some(x=>x.kind===m.swayed.kind)) g.push(Object.assign({}, m.swayed));
  m.griev = g.sort((a,b)=>b.s-a.s).slice(0,4);
  return m.griev;
}
// how a class feels about the laws citizens can force onto the agenda
function classStance(c, key){
  if (key==='wealth_tax') return c.cls==='Poor'?0.7:c.cls==='Middle'?0.2:c.cls==='Upper'?-0.4:-0.9;
  if (key==='rent_cap'){ const landlord = propsOf(c).some(p=>p.kind==='home' && residentsOf(p.bid).some(r=>r.id!==c.id && r.partner!==c.id)); const tenant = !propsOf(c).some(p=>p.bid===c.home); return (tenant?0.5:0) - (landlord?0.8:0); }
  if (key==='bread_subsidy') return c.cls==='Poor'?0.4:0;
  return 0;
}
// pick today's goal: whichever option the villager's feelings and cares weigh most
function chooseGoal(c){
  const m=mindOf(c), E=m.emo, G=grievancesOf(c), opts=[];
  const marriageAff = c.partner ? peekRel(c,c.partner).affinity : 0;
  if (c.age>=18 && c.age<=62) opts.push({key:'love', s:(!c.partner?0.2:0) + E.love*0.35 + (c.needs.social<35?0.15:0) + (c.traits.includes('Romantic')?0.2:0) + (c.agenda==='love'?0.3:0) + (c.partner && marriageAff<30 ? 0.25:0),
    text: !c.partner ? (loversOf(c).length?'build a life with '+cById(loversOf(c)[0]).name:'find someone to love') : marriageAff<30 ? 'find the love missing from their marriage' : 'keep their marriage happy', why: E.love>0.3?'love':'loneliness'});
  for (const cr of m.cares.filter(x=>x.kind==='person')){ const o=alive(cr.id); if (!o) continue;
    const distress = (o.sick?0.4:0) + (o.wallet<15 && isAdult(o)?0.4:0) + (o.needs.hunger<30?0.4:0) + (mindOf(o).emo.sadness>0.5?0.3:0);
    if (distress>0.3){ opts.push({key:'help', target:o.id, s:cr.w*distress*(c.traits.includes('Generous')?1.3:1)*(0.6+c.personality.agreeableness*0.6), text:`look after ${o.name}`, why:'care'}); break; } }
  const g = G[0];
  if (g && c.age>=18){ const causeBoost = (g.kind==='inequality'||g.kind==='hunger') && caresAbout(c,'Community') ? 0.2 : g.kind==='law' ? 0.05 : 0;
    opts.push({key:'change', g, s:g.s*(0.35+E.anger*0.9+E.fear*0.3)*(0.5+m.wit) + causeBoost + (c.agenda==='trouble'?0.2:0) + c.politics.civicEngagement*0.15, text:`change ${g.text}`, why: E.anger>0.3?'anger':causeBoost?'care':'conviction'}); }
  opts.push({key:'wealth', s:E.fear*0.4 + E.shame*0.4 + (c.agenda==='fortune'||c.traits.includes('Greedy')?0.25:0) + (c.cls==='Poor'?0.2:0), text: c.cls==='Poor'?'climb out of poverty':'build a fortune', why: E.fear>0.3?'fear':E.shame>0.3?'shame':'ambition'});
  opts.push({key:'belong', s:(c.needs.social<40?0.3:0) + c.personality.extraversion*0.2 + E.sadness*0.25, text:'find people to belong with', why: E.sadness>0.3?'sadness':'loneliness'});
  let enemy=null, ea=-55; for (const id in c.rel){ const r=c.rel[id]; if (r.affinity<ea && alive(id)){ ea=r.affinity; enemy=id; } }
  if (enemy && E.anger>0.3) opts.push({key:'revenge', target:enemy, s:E.anger*0.6 + (c.traits.includes('Reckless')?0.2:0) + (c.traits.includes('Cunning')?0.1:0) - c.personality.agreeableness*0.3, text:`get even with ${cById(enemy).name}`, why:'anger'});
  const best = opts.sort((a,b)=>b.s-a.s)[0];
  const prev = m.goal;
  m.goal = {key:best.key, text:best.text, why:best.why, s:+best.s.toFixed(2), target:best.target||null, g:best.g||null, since: prev && prev.key===best.key && prev.text===best.text ? prev.since : S.minute};
  const why = best.why==='care' ? (best.key==='help' ? 'They need me.' : `I care too much about ${CAUSE_OF[c.values[0]]||'this town'} to stay quiet.`) : {love:'My heart is set on it.', loneliness:'I am tired of being alone.', anger:'I am too angry to sit still.', fear:'I am frightened of what happens if I do not.', shame:'I will not be looked down on.', ambition:'I can do better than this.', sadness:'I need something to hold on to.', conviction:'Someone has to.'}[best.why]||'';
  if (!prev || prev.text!==best.text) think(c, `I want to ${best.text}. ${why}`);
  return m.goal;
}

// ---------- teams: co-ops, bands, clubs, movements, gangs, aid circles ----------
function newTeam(kind, name, leader, members, extra){
  S.teamSeq = (S.teamSeq||0)+1;
  const t = Object.assign({id:'team_'+S.teamSeq, kind, name, leader:leader.id, members:[leader.id], founded:S.minute, funds:0, active:true}, extra||{});
  S.teams.push(t); (members||[]).forEach(m=>joinTeam(t,m));
  return t;
}
function joinTeam(t, c){ if (!t.members.includes(c.id)) t.members.push(c.id); t.members.forEach(id=>{ const o=alive(id); if (o && o!==c){ adjustRel(c,o,3); adjustRel(o,c,3); } }); }
function leaveTeam(t, id){ t.members = t.members.filter(x=>x!==id); if (t.leader===id) t.leader = t.members[0] || null; if (!t.members.length) t.active=false; }
function teamsOf(c, kind){ return S.teams.filter(t=>t.active && t.members.includes(c.id) && (!kind || t.kind===kind)); }
function teamById(ownerId){ return S.teams.find(t=>'team:'+t.id===ownerId); }
function disband(t, why){ t.active=false; if (why) chronicle(`The ${t.name} ${why}.`, 4, '🫂', 'society'); }

// ---------- romance: lovers, affairs, divorce and children ----------
function loversOf(c){ const out=[]; for (const id in c.rel) if (c.rel[id].tags.includes('Lover') && alive(id)) out.push(id); return out; }
function attraction(a, b){ return ((hash([a.id,b.id].sort().join('~'))%100)/100)*0.6 + (a.values.some(v=>b.values.includes(v))?0.15:0) + Math.max(0, 0.25 - Math.abs(a.age-b.age)/60); }
function canRomance(a, b){ return a.age>=18 && b.age>=18 && isAdult(a) && isAdult(b) && Math.abs(a.age-b.age)<=15 && !peekRel(a,b.id).tags.includes('Family') && !a.parents.includes(b.id) && !b.parents.includes(a.id); }
function becomeLovers(a, b, secret){
  [[a,b],[b,a]].forEach(([x,y])=>{ const r=getRel(x,y.id); if (!r.tags.includes('Lover')) r.tags.push('Lover'); if (secret && !r.tags.includes('Secret')) r.tags.push('Secret'); r.tags=r.tags.filter(t=>t!=='Rival'); feel(x,'love',0.4); });
  if (secret){
    S.secrets.push({id:'sec_'+(++S.secretSeq), kind:'affair', who:[a.id,b.id], day:dayOf(S.minute), heat:0, exposed:false, text:`${a.name} and ${b.name} are having an affair`});
    [a,b].forEach(x=>{ const o=x===a?b:a; remember(x, `${o.name} and I have been seeing each other in secret.`, 8, [o.id]); think(x, x.partner ? `Nobody can find out about ${lead(o)}.` : `I hope ${lead(o)} leaves them for me.`); });
  } else {
    chronicle(`${a.name} and ${b.name} have become lovers.`, 5, '💗', 'romance'); S.week.rels.push(`${a.name} & ${b.name} became lovers`);
    [a,b].forEach(x=>remember(x, `${(x===a?b:a).name} and I are lovers now.`, 8, [(x===a?b:a).id]));
  }
}
function endLovers(a, b, why){
  [[a,b],[b,a]].forEach(([x,y])=>{ const r=getRel(x,y.id); r.tags=r.tags.filter(t=>t!=='Lover' && t!=='Secret'); });
  if (why) { chronicle(`${a.name} and ${b.name} split up (${why}).`, 4, '💔', 'romance'); [a,b].forEach(x=>feel(x,'sadness',0.3,`It is over with ${lead(x===a?b:a)}.`)); }
}
function divorce(a, b, why){
  a.partner=null; b.partner=null;
  [[a,b],[b,a]].forEach(([x,y])=>{ const r=getRel(x,y.id); r.tags=r.tags.filter(t=>t!=='Spouse'); });
  chronicle(`${a.name} and ${b.name} have divorced${why?` (${why})`:''}.`, 8, '💔', 'romance'); S.week.rels.push(`${a.name} & ${b.name} divorced`);
  const owns = x => propOf(x.home) && propOf(x.home).owner===x.id;
  const go = owns(a) && !owns(b) ? b : owns(b) && !owns(a) ? a : (a.id<b.id ? b : a);
  const own = propsOf(go).find(p=>p.kind==='home' && p.bid!==go.home && residentsOf(p.bid).length < capOf(LOC[p.bid].b));
  go.home = own ? own.bid : lodgingFor(1); indexCitizens();
  [a,b].forEach(x=>{ feel(x,'sadness',0.5); remember(x, `My marriage to ${(x===a?b:a).name} is over.`, 9, [(x===a?b:a).id]); });
}
// families think twice when the town is crowded or going hungry
function birthDamp(){ const n=S.citizens.length, kids=S.citizens.filter(c=>c.profession==='Child').length; return (n>75?0.5:1) * (n>90?0.5:1) * (S.week.hungry.length>5?0.3:1) * (kids>n*0.25?0.4:1); }
function makeBaby(a, b, home, how){
  const d = dayOf(S.minute), r = mapRand(hash(a.id+b.id+d));
  const first = FIRST_NAMES[Math.floor(r()*FIRST_NAMES.length)];
  const hostSurname = LOC[home] && residentsOf(home).includes(b) && !residentsOf(home).includes(a) ? surnameOf(b) : surnameOf(a);
  const name = `${first} ${hostSurname}`;
  const id = uniqueId('cit_'+name.toLowerCase().replace(/[^a-z]+/g,'_'));
  const skin = r()<0.5?a.look.skin:b.look.skin, hair = r()<0.5?a.look.hair:b.look.hair;
  const vals = [...new Set([a.values[0], b.values[0]])];
  const baby = makeCitizen({id, name, age:0, prof:'Child', home, traits:randomTraits(r,2), values:vals.length>1?vals:[vals[0], VALUES[Math.floor(r()*VALUES.length)]].filter((v,i,x)=>x.indexOf(v)===i),
    p:[r(),r(),r(),r(),r()].map(v=>+(0.2+v*0.6).toFixed(2)), pol:[+((a.politics.economicLeaning+b.politics.economicLeaning)/2).toFixed(2), +((a.politics.orderLeaning+b.politics.orderLeaning)/2).toFixed(2), 0.3],
    wallet:0, parents:[a.id,b.id], bio:`Born in Pixel Town on ${fmtDate(d)} to ${a.name} and ${b.name}.`, look:lookForChild(r, skin, hair, STYLES[Math.floor(r()*STYLES.length)])});
  baby.rt.x=baby.rt.ox=LOC[home].door[0]; baby.rt.y=baby.rt.oy=LOC[home].door[1];
  mindOf(baby).wit = +clamp((mindOf(a).wit+mindOf(b).wit)/2 + (r()-0.5)*0.3, 0.05, 0.97).toFixed(2);
  [a,b].forEach(p=>{ const R=getRel(p,id); R.affinity=90; R.trust=.9; R.tags=['Family']; const R2=getRel(baby,p.id); R2.affinity=90; R2.trust=.9; R2.tags=['Family']; p.kids.push(id); remember(p, `Our child ${first} was born today.`, 10, [id]); setEmotion(p,'Joyful',DAY); feel(p,'love',0.3); });
  S.citizens.filter(k=>k.parents.some(x=>baby.parents.includes(x)) && k!==baby).forEach(sib=>{ getRel(sib,id).tags=['Family']; getRel(sib,id).affinity=60; getRel(baby,sib.id).tags=['Family']; getRel(baby,sib.id).affinity=60; });
  S.citizens.push(baby); indexCitizens(); baby.plan = buildPlan(baby, d);
  chronicle(how==='married' ? `A baby! ${a.name} and ${b.name} welcomed ${name} into the world.` : `${a.name} and ${b.name}, who are not married, had a baby: ${name}.`, 8, '👶', 'family');
  S.week.births.push(`${name} (to ${a.name} & ${b.name})`);
  return baby;
}
function romanceDaily(){
  const d = dayOf(S.minute), done = new Set();
  S.citizens.slice().forEach(a=>{
    loversOf(a).forEach(bid=>{
      const b = alive(bid); const key=[a.id,bid].sort().join('~'); if (!b || done.has(key)) return; done.add(key);
      const ra = peekRel(a,b.id), rb = peekRel(b,a.id);
      if (ra.affinity<35 || rb.affinity<35){ endLovers(a,b, ra.tags.includes('Secret') ? null : 'they fell out'); return; }
      if (a.partner===b.id) { endLovers(a,b); getRel(a,b.id); return; } // married now: the Spouse tag covers it
      const secret = ra.tags.includes('Secret');
      // unmarried lovers may have a child together
      const kids = S.citizens.filter(k=>k.profession==='Child' && (k.parents.includes(a.id)||k.parents.includes(b.id))).length;
      if (a.age<=45 && b.age<=45 && kids<4 && S.citizens.length<POP_CAP && rnd() < (secret?0.003:0.005)*birthDamp()){
        const home = residentsOf(a.home).length<=residentsOf(b.home).length ? a.home : b.home;
        makeBaby(a, b, home, 'lovers');
        if (secret){ const s = S.secrets.find(x=>x.kind==='affair' && !x.exposed && x.who.includes(a.id) && x.who.includes(b.id)); if (s) expose(s, null, 'the baby gave them away'); }
        else if (!a.partner && !b.partner && !a.courting && !b.courting){ a.courting=b.id; b.courting=a.id; a.courtingSince=b.courtingSince=S.minute-8*DAY; }
      }
    });
  });
  // secret affairs heat up as the town gossips; a suspicious spouse may find out
  S.secrets.filter(s=>s.kind==='affair' && !s.exposed).forEach(s=>{
    const [a,b] = s.who.map(alive); if (!a || !b){ s.exposed=true; return; }
    const spouses = [a,b].map(x=>x.partner && alive(x.partner)).filter(Boolean);
    s.heat += 0.15 + (a.traits.includes('Reckless')||b.traits.includes('Reckless') ? 0.1 : 0);
    const sharp = spouses.reduce((m,sp)=>Math.max(m, mindOf(sp).wit), 0);
    if (spouses.length && rnd() < 0.01 + s.heat*0.01 + sharp*0.02) expose(s, spouses[0], 'a spouse found out');
  });
  // unhappy marriages end
  S.citizens.forEach(a=>{ const b = a.partner && alive(a.partner); if (!b || a.id>b.id) return;
    if (peekRel(a,b.id).affinity<5 && peekRel(b,a.id).affinity<15 && rnd()<0.08) divorce(a,b,'they could not stand each other any longer'); });
}
function discoverAffair(s, why){
  const [a,b] = s.who.map(alive); if (!a || !b) return;
  const hurt = [a,b].map(x=>x.partner && alive(x.partner)).filter(Boolean);
  chronicle(`${why==='a spouse found out' ? `${hurt[0]?hurt[0].name:'A spouse'} found out that` : 'It came out that'} ${a.name} and ${b.name} have been having an affair.`, 8, '💔', 'romance');
  S.week.rels.push(`${a.name} & ${b.name}'s affair came out`);
  [a,b].forEach(x=>{ feel(x,'shame',0.5); const r=getRel(x,(x===a?b:a).id); r.tags=r.tags.filter(t=>t!=='Secret'); });
  hurt.forEach(sp=>{
    const cheat = [a,b].find(x=>x.partner===sp.id), other = cheat===a?b:a;
    feel(sp,'anger',0.6); feel(sp,'sadness',0.5, `${lead(cheat)} betrayed me with ${lead(other)}.`);
    const rc = getRel(sp,cheat.id); rc.affinity = clamp(rc.affinity-55,-100,100); rc.trust = 0.1;
    const ro = getRel(sp,other.id); ro.affinity = clamp(ro.affinity-65,-100,100); if (!ro.tags.includes('Rival')) ro.tags.push('Rival');
    remember(sp, `${cheat.name} has been having an affair with ${other.name}.`, 10, [cheat.id, other.id]);
    const leaves = peekRel(cheat,other.id).affinity > peekRel(cheat,sp.id).affinity + 20;
    if (rc.affinity<10 || sp.traits.includes('Stubborn') || leaves){ divorce(sp, cheat, leaves ? `${lead(cheat)} chose ${lead(other)}` : 'the affair'); if (leaves && !other.partner && !cheat.courting && !other.courting){ cheat.courting=other.id; other.courting=cheat.id; cheat.courtingSince=other.courtingSince=S.minute; } else if (!leaves) endLovers(cheat, other); }
    else { endLovers(cheat, other); chronicle(`${sp.name} has forgiven ${cheat.name}, for now.`, 5, '🕊️', 'romance'); }
  });
}

// ---------- careers: villagers see what the town is missing and step up ----------
function townNeeds(){
  const d = dayOf(S.minute); if (NEEDS_CACHE.day===d) return NEEDS_CACHE.list;
  const ad=S.citizens.filter(isAdult), n=Math.max(1,ad.length), count=p=>ad.filter(c=>c.profession===p).length;
  const kids=S.citizens.filter(c=>c.profession==='Child' && c.age>=5).length;
  const avgFun = S.citizens.reduce((a,c)=>a+c.needs.fun,0)/Math.max(1,S.citizens.length);
  const crimes = S.crimes.filter(x=>d-x.day<14).length, sick = S.citizens.filter(c=>c.sick>=2).length, hungry = S.week.hungry.length;
  const out=[]; const add=(prof, score, why, test)=>{ if (score>0) out.push({prof, score:+score.toFixed(2), why, test}); };
  add('Musician', count('Musician') < 1+Math.floor(n/30) ? 0.35+(avgFun<55?0.3:0) : 0, avgFun<55 ? 'people were bored and there was no music' : 'the taverns were quiet without music', c=>c.needs.fun<60);

    if (winners) feel(p, winners.members.includes(p.id)?'pride':'sadness', 0.25); });
  const LA = S.league[A.id] = S.league[A.id]||{p:0,w:0,d:0,l:0,gf:0,ga:0,pts:0}, LB = S.league[B.id] = S.league[B.id]||{p:0,w:0,d:0,l:0,gf:0,ga:0,pts:0};

  const txt = `${A.name} ${ga}–${gb} ${B.name}${star && winners ? `. ${star.name} was the star of the match` : ''}. ${fans.length} fans watched at ${placeName(m.loc)}.`;

function policeDaily(){

// how dangerous crime looks to a villager, from punishments they know about and their own history
function riskPerception(c){ const m = cogOf(c); const seen = m.mems.filter(x=>x.type==='punished' || x.type==='jailed' || x.type==='convicted').reduce((a,x)=>a+x.str*(x.who.includes(c.id)?2:1),0);

function recruit(s, c, o, face){

function schemesDaily(){

// protests happen on the square; the council caves when enough people turn up
function resolveProtests(){

    const present = s.members.map(alive).filter(m=>m && m.rt.loc==='loc_town_square').length;
    const c = alive(s.leader), share = present/N;
    const need = 0.2 - (c && c.traits.includes('Charismatic') ? 0.04 : 0);
    if (share>=need){
      if (s.gkind==='law'){ const p = S.gov.proposals.find(p=>p.proposalId===s.target && p.status==='Enacted'); if (p){ p.status='Repealed'; S.gov.cooldown[p.key]=d+14; endScheme(s,true,`${present} marched and the council repealed the ${p.title}`); return; } }

      if (s.gkind==='inequality' || s.gkind==='jobs' || s.gkind==='hunger'){ enactDirect('Relief for the Poor', 'Subsidy', [{effectType:'Subsidy', targetProfession:'Unemployed', magnitude:5}], 14, c, 'The council gave in to the crowd on the square.'); endScheme(s,true,`${present} marched and the council granted relief to the jobless`); return; }
      if (s.gkind==='rent' && !activeLaws().some(p=>p.key==='rent_cap')){ enactDirect(CANDIDATES.rent_cap.title, 'PriceControl', CANDIDATES.rent_cap.effects, 14, c, 'The council capped rents to calm the crowd.', 'rent_cap'); endScheme(s,true,`${present} marched and the council capped rents`); return; }
      endScheme(s,true,`${present} marched and the council promised to listen`);
    } else {
      const rowdy = c && c.traits.includes('Reckless') && mindOf(c).emo.anger>0.4;
      if (rowdy && S.citizens.some(x=>x.profession==='Constable' && x.rt.loc==='loc_town_square')){ const f=Math.min(c.wallet,20); c.wallet-=f; S.treasury+=f; mindOf(c).record++; endScheme(s,false,`only ${present} turned up, and the constables fined ${c.name} for disorder`); }

}

function tryCoop(c){
  if (teamsOf(c,'coop').length || !isAdult(c) || c.cls==='Wealthy') return;
  const type = TRADE_BIZ[c.profession] || (mindOf(c).wit>0.6 ? pick(['bathhouse','tavern','bakery']) : null); if (!type) return;
  const cost = BUILD_TYPES[type].cost;

  const put = o => Math.min(300, Math.floor(o.wallet*0.6));

  if (friends.length<2 || pool < cost+150) return;
  const site = (()=>{ const tmp = c.wallet; c.wallet = pool; const st = siteFor(c, cost); c.wallet = tmp; return st; })(); if (!site) return;
  friends.forEach(o=>{ const g=put(o); o.wallet-=g; c.wallet+=g; });
  const t = newTeam('coop', `${pick(['Commons','Neighbours\'','People\'s','Riverside','Hearth'])} ${BUILD_TYPES[type].label} Co-op`, c, friends, {btype:type});
  developOn(site, c, type);
  site.p.owner = 'team:'+t.id; t.prop = site.p.id;
  chronicle(`${[c].concat(friends).map(x=>lead(x)).join(', ')} pooled ${pool}¢ into a co-operative, the ${t.name}, and broke ground on a ${BUILD_TYPES[type].label.toLowerCase()} they will own together.`, 7, '🤝', 'society');
  S.week.society.push(`${t.name} founded`);
  [c].concat(friends).forEach(x=>{ feel(x,'pride',0.2); think(x, `Together we can own what none of us could alone.`); });
}

    if (isAdult(c) && isAdult(o) && (c.traits.includes('Reckless') || m.emo.anger>0.6) && !c.traits.includes('Honest') && rnd()<0.03*(1-cogOf(c).crimeAversion) && !cogOf(c).mems.some(x=>x.type==='arrested' && S.minute-x.t<14*DAY)){ adjustRel(c,o,delta); adjustRel(o,c,delta*0.8); assault(c, o, here.find(x=>x.profession==='Constable' && x!==c && x!==o)); return; }
    const cp = here.find(x=>x.profession==='Constable'); if (cp && rnd()<0.5){ const f=Math.min(c.wallet,5); c.wallet-=f; S.treasury+=f; S.week.justice = S.week.justice||{}; S.week.justice.brawlFines = (S.week.justice.brawlFines||0)+1; if (rnd()<0.2) chronicle(`Constable ${surnameOf(cp)} broke up a quarrel and fined ${lead(c)} ${f}¢.`, 2, '🚨', 'crime'); }
    adjustRel(c,o,delta); adjustRel(o,c,delta*0.8);
    return;
  }
  // choose what to talk about
  const opts = [['chat',1]];
  if (mo.emo.sadness>0.4 || mo.emo.fear>0.45) opts.push(['comfort', 1 + c.personality.agreeableness + (ra.affinity>40?1:0)]);
  if (c.traits.includes('Gossip') || m.wit>0.6) opts.push(['gossip', c.traits.includes('Gossip')?2:0.8]);
  if (cogOf(c).mems.some(x=>x.imp>=5 && S.minute-x.t<5*DAY)) opts.push(['news', 1.2 + (ra.affinity>40?0.6:0)]);
  if (m.griev.length && c.politics.civicEngagement>0.3) opts.push(['politics', 0.6 + c.politics.civicEngagement + m.emo.anger]);
  const sch = schemeOf(c); if (sch && !sch.members.includes(o.id) && !ILLEGAL.has(sch.kind)) opts.push(['recruit', 2.5]);
  if (canRomance(c,o) && (!c.partner || c.partner===o.id || loversOf(c).includes(o.id) || peekRel(c,c.partner).affinity<45 || c.traits.includes('Romantic')) && attraction(c,o)>0.45) opts.push(['flirt', 0.6 + attraction(c,o)*2 + (m.goal&&m.goal.key==='love'?1.5:0) + m.emo.love]);
  if (c.wallet<25 && ra.affinity>40 && o.wallet>150 && !m.debts[o.id] && isAdult(c)) opts.push(['borrow', 2]);
  if (m.debts[o.id] && c.wallet>m.debts[o.id]+60) opts.push(['repay', 4]);
  if (rival && c.personality.agreeableness>0.55 && m.emo.anger<0.25) opts.push(['apologize', 1.5]);
  if (m.wit-mo.wit>0.2 && (o.profession==='Child' || o.profession===c.profession)) opts.push(['teach', 1]);
  if (c.personality.extraversion>0.5) opts.push(['joke', 0.8]);
  if (c.traits.includes('Generous') && o.wallet<20 && c.wallet>80 && isAdult(o)) opts.push(['gift', 2]);
  const tot = opts.reduce((a,x)=>a+x[1],0); let r = rnd()*tot, kind='chat'; for (const [k,w] of opts){ r-=w; if (r<=0){ kind=k; break; } }
  switch (kind){
    case 'comfort': mo.emo.sadness=Math.max(0,mo.emo.sadness-0.15); mo.emo.fear=Math.max(0,mo.emo.fear-0.1); delta+=4; remember(o, `${c.name} sat with me when I was low. It helped.`, 5, [c.id], 'Dialogue'); bub('♥'); think(o, `${lead(c)} is a true friend.`); break;
    case 'gossip': { if (rnd()<0.6) shareNews(c,o); let tgt=null, tv=0; for (const id in c.rel){ const r=c.rel[id]; if (id!==o.id && Math.abs(r.affinity)>Math.abs(tv) && alive(id)){ tv=r.affinity; tgt=id; } }
      if (tgt){ const ro = getRel(o,tgt), trust = peekRel(o,c.id).trust; ro.affinity = clamp(Math.round(ro.affinity + (tv-ro.affinity)*0.12*trust), -100, 100);
        const sec = S.secrets.find(s=>!s.exposed && m.knows.includes(s.id) && !mindOf(o).knows.includes(s.id)); if (sec){ mindOf(o).knows.push(sec.id); sec.heat += 1; if (mindOf(o).knows.length>20) mindOf(o).knows.shift(); }
        if (hash(c.id+S.minute)%5===0) remember(o, `${lead(c)} told me ${tv>0?'good':'bad'} things about ${cById(tgt).name}.`, 3, [c.id,tgt], 'Dialogue'); bub('…'); } break; }
    case 'politics': { const g = m.griev[0]; const agree = mindOf(o).griev.some(x=>x.kind===g.kind) || o.values.some(v=>c.values.includes(v));
      if (agree){ delta+=2; if (!mindOf(o).griev.some(x=>x.kind===g.kind)) mindOf(o).swayed = {kind:g.kind, text:g.text, key:g.key||null, target:g.target||null, id:g.id||null, s:0.25, until:dayOf(S.minute)+4}; feel(o,'anger',0.05); remember(o, `${lead(c)} and I agree about ${g.text}.`, 3, [c.id], 'Dialogue'); }
      else { delta-=2; if (m.emo.anger>0.4 && rnd()<0.3){ chronicle(`${c.name} and ${o.name} had a heated argument about ${g.text}.`, 3, '🗣️', 'social'); delta-=5; } }
      const pull = 0.01*peekRel(o,c.id).trust*(0.5+m.wit); o.politics.economicLeaning = +clamp(o.politics.economicLeaning + (c.politics.economicLeaning-o.politics.economicLeaning)*pull, -1, 1).toFixed(3); bub('!'); break; }
    case 'recruit': if (recruit(sch, c, o, true)){ bub('✊'); if (sch.members.length%10===0) chronicle(`The ${SCHEME_LABEL[sch.kind].toLowerCase()} over ${sch.text} now has ${sch.members.length} supporters.`, 4, '📣', 'movement'); } else delta-=1; break;
    case 'flirt': { const att = attraction(c,o), back = attraction(o,c) + peekRel(o,c.id).affinity/150 + (mindOf(o).goal&&mindOf(o).goal.key==='love'?0.2:0);
      feel(c,'love',0.05); delta += back>0.5 ? 3 : -1; bub('♥');
      if (back>0.55){ feel(o,'love',0.04); const ro = getRel(c,o.id); if (!ro.tags.includes('Crush') && !ro.tags.includes('Lover') && !ro.tags.includes('Spouse') && ro.affinity>60){ ro.tags.push('Crush'); remember(c,`I can't stop thinking about ${o.name}.`,6,[o.id]); } }
      const both = peekRel(c,o.id).affinity>72 && peekRel(o,c.id).affinity>68 && back>0.6 && att>0.5;
      if (both && !loversOf(c).includes(o.id) && c.partner!==o.id){
        const married = (c.partner && c.partner!==o.id) || (o.partner && o.partner!==c.id);
        if (!married && !loversOf(c).length && !loversOf(o).length && (c.courting===o.id || rnd()<0.15)) becomeLovers(c,o,false);
        else if (married && !loversOf(c).length && !loversOf(o).length){ const weak = x => !x.partner || peekRel(x,x.partner).affinity<40 || x.traits.includes('Romantic') || x.traits.includes('Reckless');
          const restraint = (c.traits.includes('Honest')?0.5:0) + c.personality.conscientiousness*0.5 + (c.values.includes('Family')?0.3:0);
          if (weak(c) && weak(o) && rnd() < 0.05*(1.2-restraint)) becomeLovers(c,o,true); } }

    case 'borrow': { const amt = 20 + Math.floor(mindOf(o).wit*0) + (hash(c.id+o.id)%3)*10; if (o.traits.includes('Frugal') && rnd()<0.6 || o.traits.includes('Greedy')){ remember(c, `${o.name} refused to lend me money.`, 5, [o.id]); delta-=3; feel(c,'shame',0.1); break; }
      o.wallet-=amt; c.wallet+=amt; m.debts[o.id]=amt; remember(c, `${o.name} lent me ${amt}¢. I have to pay it back.`, 6, [o.id]); remember(o, `I lent ${c.name} ${amt}¢.`, 4, [c.id]); delta+=2; bub('¢'); break; }
    case 'repay': { const amt = m.debts[o.id]; c.wallet-=amt; o.wallet+=amt; delete m.debts[o.id]; getRel(o,c.id).trust = clamp(getRel(o,c.id).trust+0.1,0,1); delta+=4; remember(o, `${c.name} paid back the ${amt}¢ they owed me.`, 4, [c.id]); bub('¢'); break; }
    case 'apologize': { [[c,o],[o,c]].forEach(([x,y])=>{ const r=getRel(x,y.id); r.tags=r.tags.filter(t=>t!=='Rival'); r.affinity=Math.max(r.affinity,-5); });
      chronicle(`${c.name} apologized to ${o.name}, and the two made peace.`, 5, '🕊️', 'social'); remember(o, `${c.name} apologized to me. Maybe we can be civil now.`, 6, [c.id]); delta=4; break; }
    case 'news': if (shareNews(c,o)) { bub('!'); delta += 1; } break;
    case 'teach': mo.wit = +Math.min(0.97, mo.wit+0.002).toFixed(4); delta+=1; if (hash(c.id+S.minute)%6===0) remember(o, `${lead(c)} taught me something new.`, 3, [c.id], 'Dialogue'); break;
    case 'joke': feel(c,'joy',0.03); feel(o,'joy',0.04); delta+=1.5; bub('ha!'); break;
    case 'gift': { c.wallet-=10; o.wallet+=10; delta+=5; feel(o,'joy',0.1); remember(o, `${c.name} slipped me 10¢. What a kind soul.`, 5, [c.id]); bub('¢'); break; }
    default: if (hash(c.id+S.minute)%6===0) remember(c,`Chatted with ${o.name} at ${place}.`,2,[o.id],'Dialogue'); if (hash(c.id+S.minute)%4===0) bub(pick(['…','♪','ha!','?']));
  }
  adjustRel(c,o,delta); adjustRel(o,c,delta*0.8);
  romance(c,o);
}

// ---------- acting on goals, every morning ----------
function pursueGoals(){
  const d = dayOf(S.minute);
  S.citizens.filter(c=>isAdult(c)).forEach(c=>{
    const m = mindOf(c); updateCares(c); const g = chooseGoal(c);
    switch (g.key){
      case 'help': { const o = alive(g.target); if (!o) break;
        if (o.sick && c.wallet>40){ const doc = S.citizens.find(x=>x.profession==='Doctor' && x!==o); if (doc && rnd()<0.5){ const fee=S.goods.svc_medical_checkup.price; c.wallet-=fee; doc.wallet+=fee; o.sick=0; chronicle(`${c.name} paid Dr. ${surnameOf(doc)} to treat ${o.name}.`, 4, '🩺', 'social'); adjustRel(o,c,8); feel(c,'pride',0.1); } }
        else if (o.wallet<15 && c.wallet>70 && rnd()<0.5){ const g2 = Math.min(40, Math.floor(c.wallet*0.15)); c.wallet-=g2; o.wallet+=g2; remember(o, `${c.name} gave me ${g2}¢ to get by.`, 6, [c.id]); adjustRel(o,c,8); think(c, `I couldn't watch ${lead(o)} go without.`); }
        break; }
      case 'change': { if (schemeOf(c)) break; if (d - (m.lastScheme||-99) < 10) break;
        const s = activeSchemes().find(s=>s.gkind===g.g.kind && !ILLEGAL.has(s.kind) && sympathy(c,s)>0.2);
        if (s){ s.members.push(c.id); const t=S.teams.find(t=>t.id===s.team); if (t) joinTeam(t,c); think(c, `I joined ${cById(s.leader).name}'s ${SCHEME_LABEL[s.kind].toLowerCase()}.`); break; }
        if (rnd() < (0.12 + m.wit*0.12) * Math.min(1.5, g.s)){ if (planScheme(c, g.g)) m.lastScheme = d; }
        break; }
      case 'wealth': if (m.wit>0.45 && rnd()<0.04) tryCoop(c); break;
      case 'belong': { const aid = S.teams.find(t=>t.active && t.kind==='aid' && c.cls==='Poor'); if (aid && !aid.members.includes(c.id) && rnd()<0.3) joinTeam(aid,c);
        if (!mindOf(c).fan && clubs().length && rnd()<0.2){ mindOf(c).fan = clubs()[hash(c.id)%clubs().length].id; think(c, `I'm a ${teamName(mindOf(c).fan)} supporter now.`); } break; }
      case 'revenge': { const o = alive(g.target); if (!o || rnd()>0.25) break;
        const biz = BUILDINGS.find(b=>b.biz && propOf(b.id) && propOf(b.id).owner===o.id);
        if (biz && !c.traits.includes('Honest') && (c.traits.includes('Reckless')||c.traits.includes('Cunning')) && m.emo.anger>0.5 && !schemeOf(c) && d-(m.lastScheme||-99)>=10){ planScheme(c, {kind:'business', target:o.id, bid:biz.id, text:`${o.name}'s ${biz.name}`, s:1}); m.lastScheme=d; }
        else { S.citizens.filter(f=>peekRel(f,c.id).affinity>40 && f!==o).slice(0,4).forEach(f=>{ const r=getRel(f,o.id); r.affinity=clamp(r.affinity-4,-100,100); }); think(c, `I made sure everyone knows what ${lead(o)} is really like.`); feel(c,'anger',-0.1); }
        break; }
    }
  });
}

// in a food crisis a merchant sends for a caravan of grain and bread down the King's Road, at a price
function foodCaravan(){
  const n = S.citizens.length, d = dayOf(S.minute);
  const hungry = S.citizens.filter(c=>c.needs.hunger<30 && !c.away).length;
  const stock = ['good_bread','good_fish','good_meat','good_vegetables','good_eggs','good_milk'].reduce((a,g)=>a+(S.goods[g]?listed(g):0),0);
  if (hungry < n*0.08 || stock > n*0.25 || (S.lastCaravan!=null && d-S.lastCaravan<2)) return;
  const m = S.citizens.filter(c=>c.profession==='Merchant' && isAdult(c) && !c.jail && !c.away && c.wallet>=60).sort((a,b)=>b.wallet-a.wallet)[0]; if (!m) return;
  const unit = Math.max(3, Math.round(S.goods.good_bread.price*0.7)), qty = Math.min(Math.round(n*0.6), Math.floor(m.wallet*0.6/unit)); if (qty<5) return;
  m.wallet -= qty*unit; m.inventory.good_bread = (m.inventory.good_bread||0)+qty; list(m, 'good_bread', qty); S.lastCaravan = d;
  S.week.society.push(`${m.name} brought in ${qty} loaves by caravan during the shortage`);
  chronicle(`With ${hungry} villagers going hungry, ${m.name} sent for a caravan and brought ${qty} loaves of bread in along the King's Road.`, 6, '🐫', 'business');
  if (typeof publicEvent==='function') publicEvent({type:'caravan', text:`${m.name} brought bread in from outside during the shortage.`, who:[m.id], topics:{['p:'+m.id]:0.4}, imp:5, kind:'business'});
}
function societyDaily(){
  const d = dayOf(S.minute);
  cognitionDaily(); S.citizens.forEach(c=>{ if (hash(c.id)%7===d%7) weeklyExperience(c); });
  // shortages are remembered by the market for a month
  GOOD_DEFS.forEach(g=>{ const st = S.goods[g.id]; S.shortMem[g.id] = Math.max(0, (S.shortMem[g.id]||0) - 0.25) + (sum(st.unmet)>=6 ? 1 : 0); });
  if (d%7===0){ const ad = S.citizens.filter(isAdult); S.townRep = {safety: Math.round(ad.reduce((a,c)=>a+opinionOf(c,'safety'),0)/Math.max(1,ad.length))}; }
  if (!S.week.society) S.week.society = [];
  // public servants are paid by the treasury
  S.citizens.forEach(c=>{ const w = PUBLIC_WAGE[c.profession]; if (w && !c.jail && S.treasury>=w){ S.treasury-=w; c.wallet+=w; today(c).inc+=w; } });
  // wealth tax, if the town has one
  effects().filter(e=>e.effectType==='WealthTax').forEach(e=>S.citizens.forEach(c=>{ if (c.wallet>500){ const t=Math.floor((c.wallet-500)*e.magnitude); c.wallet-=t; S.treasury+=t; if (t>=5) feel(c,'anger',0.02); } }));
  // children learn; faster with a teacher
  const teachers = S.citizens.filter(c=>c.profession==='Teacher').length, kids = S.citizens.filter(c=>c.profession==='Child' && c.age>=5);
  kids.forEach(k=>{ const m=mindOf(k); m.wit = +Math.min(0.97, m.wit + (teachers ? 0.003*Math.min(1, teachers*12/Math.max(1,kids.length)) : 0.0008)).toFixed(4); });
  S.citizens.forEach(c=>{ if (c.strikeUntil && d>=c.strikeUntil) c.strikeUntil=0; });
  S.citizens.filter(c=>c.profession==='Athlete').forEach(c=>{ const m=mindOf(c); m.fit = +Math.min(1, m.fit + (c.workAcc>60?0.02:0.008)).toFixed(3); c.workAcc = 0; });
  papersDaily();
  romanceDaily();
  gentryDaily();
  careersDaily();
  sportsClubs(); bands();
  pursueGoals();
  schemesDaily();
  institutionsDaily();
  teamsDaily();
  policeDaily();
  justiceDaily(); theftDaily(); foodCaravan();
  // keep saves small: only the latest laws keep their full roll-call of votes
  if (d%7===1) S.gov.proposals.slice(0,-12).forEach(p=>{ if (p.votes && p.votes.length) p.votes=[]; });

// =====================================================================
// COGNITION: memory, knowledge, beliefs, opinions and trust
// Built on top of the existing mind (emotions, cares, grievances, goals).
// The world knows the truth; each villager only knows what they saw, were
// told, or read, with a source and a confidence. Important memories fade
// slowly, repeated ones consolidate into beliefs, and opinions about
// issues, institutions and newspapers drive votes, protests, careers,
// crime and migration. Everything is event-driven: only the people who
// witness or later hear about something ever learn it.
// =====================================================================
const MEM_CAP = 24, KN_CAP = 30, BEL_CAP = 8;
const SRC_W = {saw:1, self:1, court:0.9, hall:0.8, paper:0.75, told:0.65, rumor:0.4};
const SRC_LABEL = {saw:'saw it', self:'lived it', court:'heard it in court', hall:'heard it at the town hall', paper:'read it', told:'was told', rumor:'heard a rumour'};
const TOPIC_LABEL = {expansion:'expanding the town', nature:'protecting the wilderness', justice:'the justice system', constables:'the constables', courts:'the courts',
  council:'the town council', landlords:'landlords', rich:'the wealthy', poor:'helping the poor', safety:'safety in town', relief:'relief for the poor', taxes:'taxes'};
const BELIEF_TEXT = {
  expansion:['Expansion is destroying too much wilderness.','Pixel Town needs to expand.'], nature:['Land is there to be used.','The wilderness must be protected.'],
  justice:['The justice system is unfair.','Justice in Pixel Town is fair.'], courts:['The courts cannot be trusted.','The courts are fair.'],
  constables:['The constables abuse their power.','The constables treat people fairly.'], council:['The council is corrupt.','The council serves the town.'],
  landlords:['Landlords have too much power.','Landlords provide the town with homes.'], rich:['The rich get richer at everyone else\'s expense.','The wealthy earned their place.'],
  poor:['People should stand on their own feet.','The poor deserve more support.'], safety:['Crime is getting worse.','Pixel Town is a safe place.'],
  relief:['Handouts make people lazy.','Relief programs help families like mine.'], taxes:['Taxes are strangling the town.','Taxes pay for what the town needs.']
};
// the only opinion of a person is the relationship itself; everything else lives in mind.op
function cogOf(c){
  const m = mindOf(c);
  if (!m.mems){ Object.assign(m, {mems:[], op:{}, bel:[], tr:{}, kn:{}, legal:[], rep:0, jobs:[], crimeWins:0, crimeAversion:0, week:{}}); seedOpinions(c); }
  return m;
}
// old saves and newcomers: broad starting opinions inferred from values, class and past actions, never invented memories
function seedOpinions(c){
  const m = c.mind, op = m.op, v = x => c.values.includes(x), P = c.politics;
  if (v('Nature')){ op.nature = 45; op.expansion = -25; } if (v('Prosperity')){ op.expansion = (op.expansion||0) + 25; op.taxes = -20; }
  if (v('Community')){ op.poor = 40; op.relief = 30; } if (v('Order')){ op.constables = 25; op.justice = 15; } if (v('Freedom')){ op.constables = (op.constables||0) - 15; op.taxes = (op.taxes||0) - 15; }
  op.poor = (op.poor||0) - P.economicLeaning*25; op.taxes = (op.taxes||0) - P.economicLeaning*25;
  if (c.cls==='Poor'){ op.rich = -25; op.landlords = -20; op.relief = (op.relief||0) + 20; } if (c.cls==='Wealthy'){ op.rich = 30; op.taxes = (op.taxes||0) - 20; }
  if (c.agenda==='nature'){ op.nature = 60; op.expansion = -40; } if (c.agenda==='business'||c.agenda==='fortune') op.expansion = (op.expansion||0) + 25;
  (m.griev||[]).forEach(g=>{ if (g.kind==='law' && g.key) op['law:'+g.key] = -Math.round(40*g.s+20); });
  (S.schemes||[]).forEach(s=>{ if (!s.members.includes(c.id)) return; if (s.gkind==='law'){ const p = S.gov.proposals.find(p=>p.proposalId===s.target); if (p) op['law:'+p.key] = -60; } if (s.law) op['law:'+s.law] = 55; });
  if ((m.record||0)>0){ op.constables = (op.constables||0) - 20; }
  for (const k in op) op[k] = clamp(Math.round(op[k]), -100, 100);
  m.tr = {council:0.5, constables:0.55, courts:0.6, rumor:0.3};
}
function stubborn(c){ return clamp((c.traits.includes('Stubborn')?0.45:0) + (1-c.personality.openness)*0.35 + (1-mindOf(c).wit)*0.2, 0, 0.9); }
function opinionOf(c, topic){ if (topic.startsWith('p:')) return peekRel(c, topic.slice(2)).affinity; return cogOf(c).op[topic]||0; }
function shiftOpinion(c, topic, delta){
  if (!delta) return;
  if (topic.startsWith('p:')){ const id = topic.slice(2); if (id!==c.id && alive(id)){ const r = getRel(c, id); r.affinity = clamp(Math.round(r.affinity + delta), -100, 100); } return; }
  const m = cogOf(c), before = m.op[topic]||0;
  if (Math.sign(delta)===Math.sign(before)) delta *= Math.max(0.05, 1 - Math.abs(before)/105); // strong views grow slowly
  const after = clamp(Math.round(before + delta), -100, 100); m.op[topic] = after;
  if (S.week){ const w = S.week.opShift = S.week.opShift || {}; w[topic] = (w[topic]||0) + (after-before); }
}
function trustIn(c, src, from){
  const m = cogOf(c);
  if (src==='saw' || src==='self') return 1;
  if (src==='paper') return m.tr['press:'+from] ?? 0.55;
  if (src==='court') return m.tr.courts ?? 0.6;
  if (src==='hall') return m.tr.council ?? 0.5;
  if (src==='rumor') return Math.min(m.tr.rumor ?? 0.3, from ? peekRel(c, from).trust : 0.3);
  return from ? peekRel(c, from).trust : 0.4;
}
function nudgeTrust(c, key, d){ const m = cogOf(c); m.tr[key] = clamp((m.tr[key] ?? 0.5) + d, 0.02, 0.98); }
// record an experience: e = {ev, type, text, who, topics:{topic:direction}, imp, src, from, conf, fact:{id, who, conf}, emo}
function experience(c, e){
  if (!c || c.dead) return null;
  const m = cogOf(c), src = e.src || 'self', conf = clamp(e.conf ?? trustIn(c, src, e.from), 0.02, 1), imp = e.imp || 4;

// ---------- investigating ----------
function credibility(wid, judge){ const w = cById(wid); if (!w) return 0.4; const m = cogOf(w); let c = 0.7 + (m.rep||0)/250 - Math.min(0.3, legalScore(w)*0.1); if (judge) c += peekRel(judge, wid).affinity/400; return clamp(c, 0.15, 1); }

  cs.evidence.filter(e=>e.found).forEach(e=>add(e.pointsTo, e.strength*e.rel*1.3, e.kind));

  for (const id in cs.opportunity||{}) add(id, 0.15, 'was nearby');
  for (const id in cs.alibis){ if (cs.alibis[id]==='confirmed') add(id, -0.8, 'alibi confirmed'); if (cs.alibis[id]==='false') add(id, 0.35, 'alibi fell apart'); }

}
function workCase(cs, worker, skill){

    const shy = (o.traits.includes('Shy')?0.2:0) + (peekRel(o, w.claim).affinity>50 ? 0.5 : 0) + (1-trustIn(o,'hall'))*0.2 + (o.id===cs.truth.offender?1:0);
    if (rnd() < skill*0.9 - shy){ w.spoke = true; cs.statements.push({by:o.id, claim:w.claim, conf:w.conf, day:d});

      if (cs.sev>=3) chronicle(`${o.name} told ${worker.profession==='Investigator'?'investigators':'Constable '+surnameOf(worker)} they saw ${cById(w.claim).name} ${CRIME[cs.kind].verb}.`, 4, '👁', 'crime'); } });

  // physical evidence

  // only investigators dig into motive, whereabouts and alibis
  if (worker.profession==='Investigator'){
    cs.motive = cs.motive || {};
    cs.victims.map(alive).filter(Boolean).forEach(v=>{ for (const id in v.rel){ const r = v.rel[id]; if (!alive(id) || id===v.id) continue; if ((r.affinity < -40 || r.tags.includes('Rival')) && rnd() < skill) cs.motive[id] = Math.max(cs.motive[id]||0, 0.25); } });
    if ((cs.kind==='theft' || cs.kind==='burglary') && rnd() < skill*0.6) cs.present.forEach(id=>{ const p = alive(id); if (p && p.wallet<15) cs.motive[id] = Math.max(cs.motive[id]||0, 0.2); });

// ---------- arrests, constable justice, charges ----------

  caseLog(cs, text); chronicle(`${text}`, 6, '🚨', 'crime'); wj().arrests = (wj().arrests||0)+1;
  const alts = Object.keys(cs.suspects).filter(id=>id!==suspect.id).slice(0,2);
  publicEvent({type:'arrest', text, who:[suspect.id], topics:{safety:0.2}, imp:6, kind:'crime', alleged:true, fact:{id:cs.id, who:suspect.id, conf:0.6, kind:cs.kind, sev:cs.sev, alts}, at:suspect.home, r:3});
  experience(suspect, {type:'arrested', text:`I was arrested on suspicion of ${crimeName(cs)}.`, imp:9, src:'self', topics:{constables: suspect.id===cs.truth.offender ? -0.3 : -0.9, justice: suspect.id===cs.truth.offender ? 0 : -0.6}, emo:-0.7});

// before there is a magistrate, the constable decides guilt and fines on the spot

  const text = `${officer && officer.profession==='Constable' ? 'Constable '+surnameOf(officer) : 'The constables'} fined ${suspect.name} ${fine}¢ for ${crimeName(cs)}.`;
  caseLog(cs, text); chronicle(`${text}`, 6, '🚨', 'crime');

    const denies = !guilty || !suspect.traits.includes('Honest');
    if (c===suspect ? denies : ((k && k.who!==suspect.id && k.conf>0.4) || (friend && denies && !(k && k.who===suspect.id && k.conf>0.6) && rnd()<0.7))){ doubters++; experience(c, {ev:cs.id+':cj', type:'unjust', text:`${suspect.name} was fined for ${crimeName(cs)} without a trial${c===suspect?'':', and I don\'t think they did it'}.`, pub:`${suspect.name} was fined by the constables without a trial.`, topics:{constables:-0.8, justice:-0.8}, imp:c===suspect?9:6, src:c===suspect?'self':'told', conf:0.8}); } });

function recordLegal(c, cs, guilty, sentence){ cogOf(c).legal.push({day:dayOf(S.minute), charge:crimeName(cs), sev:cs.sev, guilty, verdict:cs.verdict, sentence, caseId:cs.id}); if (guilty) mindOf(c).record = (mindOf(c).record||0)+1; }

const Jmag = () => pros('Magistrate').length>0;

// ---------- trials ----------
function scheduleTrial(cs){
  const d = dayOf(S.minute);
  const st = scoreSuspects(cs); const def = cs.defendant; const e = (st.find(x=>x[0]===def)||[null,{score:0}])[1].score;
  if (e < 0.3){ cs.status = 'DISMISSED'; cs.closed = d; cs.verdict = 'DISMISSED'; const t = `The magistrate dismissed the ${cs.charges} charge against ${cById(def).name} for lack of evidence.`; caseLog(cs, t); chronicle(`${t}`, 6, '⚖️', 'crime'); publicEvent({type:'dismissed', text:t, who:[def], topics:{}, imp:5, kind:'crime'}); return; }

  caseLog(cs, `Trial set for ${WEEKDAYS[cs.trialDay%7]}.`);
}
function startTrials(){
  const d = dayOf(S.minute);
  J().cases.filter(cs=>cs.status==='AWAITING TRIAL' && cs.trialDay<=d).forEach(cs=>{
    const def = alive(cs.defendant); if (!def){ cs.status='DISMISSED'; cs.closed=d; cs.verdict='DISMISSED'; return; }
    const judge = assignOfficial(pros('Magistrate'), cs, 'Magistrate');
    if (!judge){ const L = S.gov.leader && alive(S.gov.leader); if (L && !conflictReason(L, cs) && (cs.waited||0)>=2){ cs.trial.judge = L.id; cs.trial.acting = true; caseLog(cs, `With the magistrate recused, ${L.name} sat as acting judge.`); } else { cs.trialDay = d+1; cs.waited = (cs.waited||0)+1; return; } }

    let defense = pros('Advocate').filter(a=>a!==prosecutor && !conflictReason(a, cs)).sort((a,b)=>mindOf(b).wit-mindOf(a).wit)[0] || null;
    if (defense){ const fee = Math.min(def.wallet, 25 + Math.round(mindOf(defense).wit*20)); if (fee>=10){ def.wallet -= fee; defense.wallet += fee; today(defense).inc += fee; } else if (S.treasury >= 10){ S.treasury -= 10; defense.wallet += 10; caseLog(cs, 'The town paid for the defence.'); } }

      if ((J2.traits.includes('Greedy') || J2.wallet<100) && rnd()<0.6){ const amt = 60 + Math.round(def.wallet*0.1); def.wallet -= amt; J2.wallet += amt; cs.trial.bribed = true;
        const c2 = commitCrime('corruption', J2, {hidden:true, loc:cs.trial.loc, text:`${J2.name} took a bribe from ${def.name}`}); c2.truth.payer = def.id; commitCrime('bribery', def, {hidden:true, loc:cs.trial.loc, text:`${def.name} bribed ${J2.name}`});

    const t = `The trial of ${def.name} for ${cs.charges} has begun${J2?` before ${cs.trial.acting?'acting judge':'Magistrate'} ${J2.name}`:''}${defense?`, defended by ${defense.name}`:', with no one to defend them'}.`;
    caseLog(cs, t); chronicle(`${t}`, 7, '⚖️', 'crime'); wj().trials = (wj().trials||0)+1;

}
function verdicts(){
  const d = dayOf(S.minute);
  J().cases.filter(cs=>cs.status==='IN TRIAL').forEach(cs=>{
    const def = alive(cs.defendant), judge = alive(cs.trial.judge); if (!def || !judge){ cs.status='DISMISSED'; cs.closed=d; cs.verdict='DISMISSED'; return; }
    const st = scoreSuspects(cs, judge); let E = (st.find(x=>x[0]===def.id)||[null,{score:0}])[1].score;
    const others = st.filter(x=>x[0]!==def.id).reduce((a,x)=>a+Math.max(0,x[1].score),0); E -= others*0.35; // doubt: evidence pointing elsewhere
    const P = alive(cs.trial.prosecutor), D = alive(cs.trial.defense);

    const strict = judge.values.includes('Order') || judge.traits.includes('Stubborn');

    cs.trial.strength = +p.toFixed(2);
    cs.verdict = guilty ? 'CONVICTED' : 'ACQUITTED'; cs.status = cs.verdict; cs.closed = d;
    let text;
    if (guilty){ const sent = sentence(cs, def); cs.sentence = sent; text = `${def.name} was convicted of ${cs.charges}. Sentence: ${sent}.`; recordLegal(def, cs, true, sent); }
    else { text = `${def.name} was acquitted of ${cs.charges}${cs.flagConflict?' after contradictory testimony weakened the case':''}.`; recordLegal(def, cs, false, 'acquitted'); }
    caseLog(cs, text); chronicle(text, 8, guilty?'✅':'❌', 'crime');
    wj()[guilty?"convictions":"acquittals"] = (wj()[guilty?"convictions":"acquittals"]||0)+1;
    const pe = publicEvent({type:guilty?'convicted':'acquitted', text, who:[def.id], topics:{}, imp:7, kind:'crime', fact: guilty ? {id:cs.id, who:def.id, conf:0.85, kind:cs.kind, sev:cs.sev} : null, at:cs.trial.loc, r:6});
    // what the verdict does to trust: people compare it with what they already believed
    S.citizens.forEach(c=>{ const k = cogOf(c).kn[cs.id]; if (!k) return; const agree = (k.who===def.id) === guilty;
      nudgeTrust(c, 'courts', (agree ? 0.04 : -0.06)*k.conf); shiftOpinion(c, 'justice', (agree ? 6 : -9)*k.conf);
      if (!guilty && k.who===def.id && k.conf>0.6) experience(c, {ev:pe.ev, type:'verdict', text:`${def.name} walked free, but I believe they did it.`, pub:text, topics:{courts:-0.6, safety:-0.3}, imp:6, src:'court', conf:0.9});
      if (guilty && k.who!==def.id && k.conf>0.5) experience(c, {ev:pe.ev, type:'verdict', text:`${def.name} was convicted, but I believe ${cById(k.who)?cById(k.who).name:'someone else'} did it.`, pub:text, topics:{courts:-0.8, justice:-0.6}, imp:7, src:'court', conf:0.9});
      if (guilty && k.who===def.id && !k.applied){ k.applied = true; shiftOpinion(c, 'p:'+def.id, -8*cs.sev/3); } });
    (cs.press||[]).forEach(pp=>S.citizens.forEach(c=>{ const key = 'press:'+pp.editor; if (cogOf(c).tr[key]==null && !cogOf(c).kn[cs.id]) return; nudgeTrust(c, key, (pp.who===def.id)===guilty ? 0.03 : -0.05); }));
    const innocent = def.id!==cs.truth.offender;
    experience(def, {type: guilty?'convicted':'acquitted', text: guilty ? `I was convicted of ${cs.charges}${innocent?', and I did not do it':''}.` : `I was acquitted of ${cs.charges}.`, imp:10, src:'self', topics: guilty ? (innocent ? {justice:-1, courts:-1, council:-0.5} : {courts:-0.2}) : {courts:0.4}, emo: guilty?-0.8:0.5});
    def.partner && alive(def.partner) && experience(alive(def.partner), {type:'family-trial', text:`My spouse ${def.name} was ${guilty?'convicted':'acquitted'} of ${cs.charges}.`, imp:8, src:'court', topics: guilty && !innocent ? {} : guilty ? {courts:-0.6} : {courts:0.3}, conf:0.95});

}
function sentence(cs, c){

  if (cs.amount && cs.victims[0] && alive(cs.victims[0])){ const r = Math.min(c.wallet, cs.amount); if (r>0){ c.wallet -= r; alive(cs.victims[0]).wallet += r; parts.push(`${r}¢ restitution`); } }

// ---------- the daily round of cases ----------
function justiceDaily(){

// the town breaks ground on its jail or courthouse once it has the money and a plot; retried daily while pending

// ---------- new everyday crimes: theft and assault ----------
function theftDaily(){

  S.citizens.forEach(c=>{
    if (!isAdult(c) || c.jail || c.away || c.traits.includes('Honest') || c.profession==='Constable' || JUSTICE_PROFS.includes(c.profession)) return;
    const need = c.wallet<10 ? 2.5 : c.wallet<25 ? 1 : (c.traits.includes('Greedy') && c.traits.includes('Cunning') ? 0.4 : 0);
    if (!need) return;
    const p = 0.0016 * need * (c.needs.hunger<35 ? 1.6 : 1) * (1 - riskPerception(c)) * (c.values.includes('Order') ? 0.3 : 1);
    if (rnd() > p) return;
    const victims = S.citizens.filter(v=>v!==c && isAdult(v) && v.wallet>120 && v.home!==c.home && peekRel(c,v.id).affinity<50);

}

}

// round off stair-stepped river and lake corners with a foam-edged arc

function litBuilding(b){ if (b.style==='hall') return false; return S.citizens.some(c=>c.rt.loc===b.id && !c.rt.path && c.rt.state!=='Sleeping'); }

function collectLights(vx, vy, vw, vh){
  const L=[]; const inV=(x,y,r)=> x+r>vx && y+r>vy && x-r<vx+vw && y-r<vy+vh;
  LAMPS.forEach(([x,y])=>{ const X=x*TILE+8, Y=y*TILE-6; if (inV(X,Y,60)) L.push([X,Y,56,0.95]); });
  BUILDINGS.forEach(b=>{ if (!b.windows || !litBuilding(b)) return; b.windows.forEach(([x,y,w,h])=>{ if (inV(x,y,40)) L.push([x+w/2,y+h,34,0.85]); }); if (b.lights) b.lights.forEach(([x,y])=>{ if (inV(x,y,50)) L.push([x,y,44,0.9,'rgba(255,150,60,0.25)']); }); });
  const smithy = BUILDINGS.find(b=>b.id==='loc_smithy'); if (smithy && litBuilding(smithy)) L.push([(smithy.x+smithy.w/2)*TILE,(smithy.y+smithy.h)*TILE,50,0.9,'rgba(255,120,40,0.3)']);
  if (S.festival){ for (let i=0;i<7;i++) L.push([(20.5+i*2)*TILE,15*TILE,44,0.9,'rgba(255,120,160,0.25)']); }
  S.citizens.forEach(c=>{ if (c.rt.path){ const X=c.rt.x*TILE+10, Y=c.rt.y*TILE+4; if (inV(X,Y,30)) L.push([X,Y,26,0.55]); } });
  return L;
}
function spawnParticles(dt, mod, season, vx, vy, vw, vh){
  const r = Math.random;
  BUILDINGS.forEach(b=>{ if (!b.chimney) return; const [x,y]=b.chimney; if (x<vx-20||x>vx+vw+20||y<vy-40||y>vy+vh+20) return;
    if (r()>dt*2.5 || !S.citizens.some(c=>c.rt.loc===b.id && !c.rt.path)) return;
    particles.push({x:x+r()*2-1, y, vx:5+r()*5, vy:-9-r()*5, life:2.6, max:2.6, col:r()<0.5?'#c8c8d0':'#a8a8b4', w:2, grow:1.2, a:0.55}); });
  const smith = BUILDINGS.find(b=>b.id==='loc_smithy');
  if (smith && litBuilding(smith) && r()<dt*8) particles.push({x:(smith.x+2.5)*TILE, y:(smith.y+smith.h)*TILE-10, vx:(r()-.5)*40, vy:-25-r()*25, life:0.5, max:0.5, col:'#ffb040'});
  const area = vw*vh/(400*250);
  if (S.weather==='Rain'||S.weather==='Storm'){ const n=(S.weather==='Storm'?520:300)*area; for (let i=0;i<n*dt;i++){ const x=vx+r()*(vw+60), y=vy-10+r()*vh*0.3; particles.push({kind:'rain', x, y, vx:-60, vy:300+r()*80, life:2, max:2, floor:y+20+r()*vh*0.9}); } }
  if (S.weather==='Snow'){ for (let i=0;i<70*area*dt;i++) particles.push({x:vx+r()*vw, y:vy-2, vx:(r()-.5)*12, vy:14+r()*12, life:14, max:14, col:r()<0.7?'#ffffff':'#dfe8f2', w:r()<0.3?2:1}); }
  const night = mod<300||mod>1230;
  if (night && season===1 && r()<dt*6) particles.push({x:vx+r()*vw, y:vy+r()*vh, vx:(r()-.5)*8, vy:(r()-.5)*8, life:3, max:3, col:'#e8ff80', a:0.9});
  if (season===2 && r()<dt*4) particles.push({x:vx+r()*vw, y:vy, vx:-10-r()*8, vy:12+r()*8, life:8, max:8, col:pick(['#e8a040','#c8702a','#d8b040','#b04a1e']), w:2, h:1});
  if (S.festival && mod>16*60 && mod<22*60 && r()<dt*8) particles.push({x:(20+r()*12)*TILE, y:24*TILE, vx:(r()-.5)*14, vy:-50-r()*40, life:1.6, max:1.6, col:pick(['#ff6a8a','#f2c14e','#7fd1ae','#8fb8ff']), w:2});

}

    const p = [num(pr,'openness',0.5,0,1), num(pr,'conscientiousness',0.5,0,1), num(pr,'extraversion',0.5,0,1), num(pr,'agreeableness',0.5,0,1), num(pr,'neuroticism',0.4,0,1)];
    const pol = [num(o.politics,'econ\\w*',0,-1,1), num(o.politics,'order',0,-1,1), num(o.politics,'civic',0.5,0,1)];
    let wallet = o.wallet ? parseInt(String(o.wallet).replace(/[^0-9]/g,''),10) : 150; if (isNaN(wallet)) wallet=150; wallet = clamp(wallet,0,5000);
    const hex = v => /^#[0-9a-f]{6}$/i.test(v||'') ? v.toLowerCase() : null;
    const skin = hex(o.skin) || SKIN_NAMES[(o.skin||'').toLowerCase()] || SKINS[hash(name)%SKINS.length];
    const hair = hex(o.hair) || HAIR_NAMES[(o.hair||'').toLowerCase()] || HAIRS[hash(name+'h')%HAIRS.length];
    const style = STYLES.includes((o.hairstyle||'').toLowerCase()) ? o.hairstyle.toLowerCase() : STYLES[hash(name+'s')%STYLES.length];
    const beard = /^(y|yes|true|1)$/i.test(o.beard||'');
    const findC = n => S.citizens.find(c=>c.name.toLowerCase()===n.toLowerCase());
    const friends = parseList(o.friends).map(n=>{ const c=findC(n); if (!c) warnings.push(`No villager called "${n}" (friends).`); return c; }).filter(Boolean);
    const rivals = parseList(o.rivals).map(n=>{ const c=findC(n); if (!c) warnings.push(`No villager called "${n}" (rivals).`); return c; }).filter(Boolean);
    let partner = o.partner ? findC(o.partner) : null; if (o.partner && !partner) warnings.push(`No villager called "${o.partner}" (partner).`); if (partner && partner.partner){ warnings.push(`${partner.name} is already married.`); partner=null; }
    let wit = null; if (o.intelligence){ const w = String(o.intelligence).toLowerCase(); wit = {genius:0.95, brilliant:0.9, clever:0.75, smart:0.75, sharp:0.7, average:0.5, simple:0.3, slow:0.2}[w.trim()] ?? parseFloat(w); if (isNaN(wit)){ warnings.push(`Intelligence "${o.intelligence}" not understood; using the default.`); wit=null; } else wit = clamp(wit>1?wit/100:wit, 0.05, 0.97); }
    const def = {name, age, prof, traits, values, agenda, p, pol, wallet, wit, bio: o.bio || `Arrived in Pixel Town with a story still untold.`, look: lookFor(prof, mapRand(hash(name)), skin, hair, style, beard), friends, rivals, partner};
    return {def, errors, warnings};
  });
}
function addTemplateCitizen(def){
  const d = Object.assign({}, def, {id: uniqueId('cit_'+def.name.toLowerCase().replace(/[^a-z]+/g,'_'))});
  const c = makeCitizen(d);
  if (def.wit!=null) mindOf(c).wit = +def.wit.toFixed(2);
  if (def.partner && !def.partner.partner){ c.partner=def.partner.id; def.partner.partner=c.id; [[c,def.partner],[def.partner,c]].forEach(([x,y])=>{ const R=getRel(x,y.id); R.affinity=85; R.trust=.9; R.tags=['Spouse','Family']; }); }
  def.friends.forEach(f=>{ [[c,f],[f,c]].forEach(([x,y])=>{ const R=getRel(x,y.id); R.affinity=55; R.trust=.65; R.tags=['Friend']; }); });
  def.rivals.forEach(f=>{ [[c,f],[f,c]].forEach(([x,y])=>{ const R=getRel(x,y.id); R.affinity=-50; R.trust=.2; R.tags=['Rival']; }); });
  settleNewcomer(c);
  if (c.partner){ c.home = cById(c.partner).home; indexCitizens(); c.plan = buildPlan(c, dayOf(S.minute)); c.rt.blockIdx=-1; }
  chronicle(`${c.name}, a ${profLabel(c.profession).toLowerCase()}, arrived on the King's Road${c.agenda?` hoping to ${AGENDAS[c.agenda].phrase}`:''}${c.partner?` to join ${cById(c.partner).name}`:''}.`, 6, '🧳', 'arrival');
  remember(c, 'I arrived in Pixel Town today. A new start.', 8);
  return c;
}
function citizenToTemplate(c){
  const agenda = c.agenda ? AGENDAS[c.agenda].label : '';
  const P = c.personality, Q = c.politics;
  const tagged = t => Object.entries(c.rel).filter(([id,r])=>r.tags.includes(t) && alive(id)).map(([id])=>cById(id).name).join(', ');
  return [`name: ${c.name}`, `age: ${c.age}`, `profession: ${c.profession}`, `traits: ${c.traits.join(', ')}`, `values: ${c.values.join(', ')}`, `agenda: ${agenda}`, `wallet: ${c.wallet}`, `intelligence: ${mindOf(c).wit}`,
    `personality: openness ${P.openness}, conscientiousness ${P.conscientiousness}, extraversion ${P.extraversion}, agreeableness ${P.agreeableness}, neuroticism ${P.neuroticism}`,
    `politics: economic ${Q.economicLeaning}, order ${Q.orderLeaning}, civic ${Q.civicEngagement}`,
    `skin: ${c.look.skin}`, `hair: ${c.look.hair}`, `hairstyle: ${c.look.style}`, `beard: ${c.look.beard?'yes':'no'}`,
    `friends: ${tagged('Friend')}`, `rivals: ${tagged('Rival')}`, `partner: ${c.partner && alive(c.partner) ? cById(c.partner).name : ''}`, `bio: ${c.bio}`].join('\n');
}

// ---------- camera input: drag to pan, wheel / pinch to zoom, tap to select ----------
const ptrs = new Map(); let drag=null, pinch=null, moved=false;
function screenToWorld(clientX, clientY){ const r=cv.getBoundingClientRect(); const {vx,vy}=viewRect(); return [vx + (clientX-r.left)*DPR/cam.z, vy + (clientY-r.top)*DPR/cam.z]; }
function clampCam(){ const {vx,vy,vw,vh}=viewRect(); cam.x=vx+vw/2; cam.y=vy+vh/2; }
function zoomAt(clientX, clientY, factor){
  const [wx,wy] = screenToWorld(clientX,clientY);
  cam.z = clampZ(cam.z*factor);
  const r=cv.getBoundingClientRect(); const vw=cv.width/cam.z, vh=cv.height/cam.z;
  cam.x = wx - (clientX-r.left)*DPR/cam.z + vw/2; cam.y = wy - (clientY-r.top)*DPR/cam.z + vh/2;
  clampCam();
}
cv.addEventListener('pointerdown', e=>{ try{ cv.setPointerCapture(e.pointerId); }catch(err){} ptrs.set(e.pointerId,{x:e.clientX,y:e.clientY}); moved=false;
  if (ptrs.size===1) drag={x:e.clientX,y:e.clientY,cx:cam.x,cy:cam.y}; else if (ptrs.size===2){ const [a,b]=[...ptrs.values()]; pinch={d:Math.hypot(a.x-b.x,a.y-b.y), z:cam.z, mx:(a.x+b.x)/2, my:(a.y+b.y)/2}; drag=null; } });
cv.addEventListener('pointermove', e=>{
  if (ptrs.has(e.pointerId)) ptrs.set(e.pointerId,{x:e.clientX,y:e.clientY});
  if (pinch && ptrs.size===2){ const [a,b]=[...ptrs.values()]; const d=Math.hypot(a.x-b.x,a.y-b.y); zoomAt(pinch.mx,pinch.my, clampZ(pinch.z*d/pinch.d)/cam.z); moved=true; return; }
  if (drag){ const dx=(e.clientX-drag.x), dy=(e.clientY-drag.y); if (Math.hypot(dx,dy)>5){ moved=true; cam.follow=false; $('zFollow').classList.remove('on'); cv.classList.add('dragging'); } if (moved){ cam.x = drag.cx - dx*DPR/cam.z; cam.y = drag.cy - dy*DPR/cam.z; clampCam(); } return; }
  hover(e);
});
function endPtr(e){ ptrs.delete(e.pointerId); if (ptrs.size<2) pinch=null; if (!ptrs.size){ if (!moved && drag) clickAt(e); drag=null; cv.classList.remove('dragging'); } }
cv.addEventListener('pointerup', endPtr); cv.addEventListener('pointercancel', endPtr);
cv.addEventListener('wheel', e=>{ e.preventDefault(); zoomAt(e.clientX,e.clientY, e.deltaY<0?1.15:1/1.15); }, {passive:false});
cv.addEventListener('mouseleave', ()=>$('tip').style.display='none');
$('zIn').onclick = ()=>{ if (R3.on){ R3.dist = clamp(R3.dist/1.3, 6, 140); return; } const r=cv.getBoundingClientRect(); zoomAt(r.left+r.width/2, r.top+r.height/2, 1.4); };
$('zOut').onclick = ()=>{ if (R3.on){ R3.dist = clamp(R3.dist*1.3, 6, 140); return; } const r=cv.getBoundingClientRect(); zoomAt(r.left+r.width/2, r.top+r.height/2, 1/1.4); };
$('zFit').onclick = ()=>{ if (R3.on){ R3.dist = 95; R3.pitch = 1.05; cam.x = WW/2; cam.y = WH/2; cam.follow=false; $('zFollow').classList.remove('on'); return; } cam.z = fitZ(); cam.x=WW/2; cam.y=WH/2; cam.follow=false; $('zFollow').classList.remove('on'); };
$('zFollow').onclick = ()=>{ if (!ui.sel){ $('tabs').querySelector('[data-p=people]').click(); return; } cam.follow=!cam.follow; $('zFollow').classList.toggle('on',cam.follow); if (cam.follow && cam.z<2.5*DPR) cam.z=clampZ(3*DPR); };
$('z3d').onclick = ()=>toggle3D();
$('zRotL').onclick = ()=>{ R3.yaw += Math.PI/4; };
$('zRotR').onclick = ()=>{ R3.yaw -= Math.PI/4; };
mini.addEventListener('click', e=>{ const r=mini.getBoundingClientRect(); cam.x=(e.clientX-r.left)/r.width*WW; cam.y=(e.clientY-r.top)/r.height*WH; cam.follow=false; clampCam(); });
function hitCitizen(wx,wy){ let best=null, bd=14; S.citizens.forEach(c=>{ if (!visibleCitizen(c)) return; const cx=c.rt.x*TILE+10, cy=c.rt.y*TILE+2; const d=Math.hypot(cx-wx,cy-wy); if (d<bd){bd=d;best=c;} }); return best; }
function hitBuilding(wx,wy){ return BUILDINGS.find(b=>wx>=b.x*TILE-2&&wx<(b.x+b.w)*TILE+2&&wy>=b.y*TILE-16&&wy<(b.y+b.h)*TILE); }
function hover(e){
  const [x,y]=screenToWorld(e.clientX,e.clientY); const tip=$('tip'); const c=hitCitizen(x,y); let html='';
  if (c) html=`<b>${esc(c.name)}</b> · ${esc(profLabel(c.profession))}<br>${esc(doingText(c))}<br><span class="muted">${esc(c.mood.emotion)} · ${c.wallet}¢</span>`;

    else if (BRIDGE_TILES.some(([bx,by])=>Math.floor(x/TILE)===bx&&Math.floor(y/TILE)===by)) html=`<b>The old river bridge</b><br>${S.bridge.closed?'Collapsed':Math.round(S.bridge.health)+'% sound'}`;
    else if (Math.abs(x/TILE-WELL[0]-1)<1.3 && Math.abs(y/TILE-WELL[1]-0.5)<1.5) html='<b>Town Well</b><br><span class="muted">Households fetch water here each morning</span>';
    else { const tx=Math.floor(x/TILE), ty=Math.floor(y/TILE); for (const k of ['loc_pasture','loc_farm','loc_east_grove','loc_town_square','loc_market']){ if (LOC[k].rects.some(([a,b2,c2,d2])=>tx>=a&&tx<=c2&&ty>=b2&&ty<=d2)){ html=`<b>${LOC[k].name}</b>${k==='loc_pasture'?`<br>${esc(herdStr(S.herd))}`:''}`; break; } }
      const tt=(MAP[ty]||[])[tx]; if (!html && tt===T.DOCK) html='<b>Lake Docks</b>'; if (!html && tt===T.WATER) html= ty>36?'<b>Mirror Lake</b>':'<b>River Wend</b>'; if (!html && tt===T.ROCK && ty<10) html='<b>Deepvein Hills</b>'; }
  }

  const sr=$('stage').getBoundingClientRect(); tip.innerHTML=html; tip.style.display='block';
  tip.style.left = Math.min(e.clientX-sr.left+14, sr.width-250)+'px'; tip.style.top=(e.clientY-sr.top+14)+'px';

function clickAt(e){ const [x,y]=screenToWorld(e.clientX,e.clientY); const c=hitCitizen(x,y); if (c){ ui.sel=c.id; if (ui.tab!=='people') $('tabs').querySelector('[data-p=people]').click(); else renderPeople(); } }

const music = {
  cfg: Object.assign({tracks:[], volume:0.5, on:false}, store.get(MUSIC_KEY)||{}),
  ac:null, master:null, chipGain:null, timer:null, nextT:0, step:0, phase:null, source:null, audio:null, oneOff:null, status:'',
  save(){ store.set(MUSIC_KEY, {tracks:this.cfg.tracks, volume:this.cfg.volume, on:this.cfg.on}); },
  currentPhase(){
    const p = S.gov.proposals.find(p=>p.status==='Voting'); if (p) return 'Town Hall';
    const mod=modOf(S.minute); if (S.festival && mod>=16*60 && mod<22*60) return 'Festival';
    return phaseOf(mod);
  },
  ensureAudio(){
    if (this.ac) return;
    const AC = window.AudioContext || window.webkitAudioContext; if (!AC) return;
    this.ac = new AC(); this.master = this.ac.createGain(); this.master.gain.value = this.cfg.volume; this.master.connect(this.ac.destination);
    this.chipGain = this.ac.createGain(); this.chipGain.gain.value = 0.0; this.chipGain.connect(this.master);

  toggle(){

  setVolume(v){ this.cfg.volume=v; this.save(); if (this.master) this.master.gain.value=v; if (this.audio) this.audio.volume=v; },
  trackFor(phase){ const t=this.cfg.tracks; const m=t.filter(x=>x.phase===phase); const any=t.filter(x=>x.phase==='Any'); const pool=m.length?m:any; if (pool.length) return pool[dayOf(S.minute)%pool.length]; return TOWN_SONG.id ? (this.townTrack = this.townTrack || {id:TOWN_SONG.id, title:TOWN_SONG.title, phase:'Any'}) : null; },
  update(){
    if (!this.cfg.on || this.oneOff) return;
    const ph = this.currentPhase();
    if (ph===this.phase) return;

    if (a.src!==src){ a.src = src; }
    a.play().then(()=>{ this.source={kind:'suno', tr}; this.status=`♪ Suno: "${tr.title}" (${ph})`; if (ui.tab==='music') this.renderPanel(); }).catch(()=>{ this.status='Tap "Music on" to allow playback.'; });

  const r = R3.c3.getBoundingClientRect(), pr = Math.min(window.devicePixelRatio||1, R3.mobile?1.25:1.75);
  const W = Math.max(200, Math.round(r.width)), H = Math.max(150, Math.round(r.height));
  if (R3.w!==W || R3.h!==H || R3.pr!==pr){ R3.w=W; R3.h=H; R3.pr=pr; R3.renderer.setPixelRatio(pr); R3.renderer.setSize(W, H, false); R3.camera.aspect = W/H; R3.camera.updateProjectionMatrix(); }
  if (R3.groundKey!==groundKey){ R3.groundKey = groundKey; R3.groundTex.needsUpdate = true; }
  const wk = `${S.worldVer||0}|${ART.season}|${BUILDINGS.length}`;
  if (wk!==R3.lastWorld){ R3.lastWorld = wk; r3World(); }
  const pk = `${wk}|${Math.floor(S.minute/60)}|${(S.deceased||[]).length}`;
  if (pk!==R3.lastProps){ R3.lastProps = pk; r3Props(); }
  // camera
  if (cam.follow && ui.sel){ const c = cById(ui.sel); if (c && !c.dead){ const p = citizenPos(c, frac); cam.x += (p.x*TILE+10-cam.x)*0.1; cam.y += (p.y*TILE+16-cam.y)*0.1; } }
  const k = R3.keys, spd = R3.dist*0.9*dt;
  if (k.q) R3.yaw += 1.6*dt; if (k.e) R3.yaw -= 1.6*dt;
  const fx = -Math.sin(R3.yaw), fz = -Math.cos(R3.yaw), rx = Math.cos(R3.yaw), rz = -Math.sin(R3.yaw);
  if (k.w||k.arrowup){ cam.x += fx*spd*TILE; cam.y += fz*spd*TILE; } if (k.s||k.arrowdown){ cam.x -= fx*spd*TILE; cam.y -= fz*spd*TILE; }
  if (k.d||k.arrowright){ cam.x += rx*spd*TILE; cam.y += rz*spd*TILE; } if (k.a||k.arrowleft){ cam.x -= rx*spd*TILE; cam.y -= rz*spd*TILE; }
  cam.x = clamp(cam.x, 0, WW); cam.y = clamp(cam.y, 0, WH);
  const tx = cam.x/TILE, tz = cam.y/TILE, d = R3.dist, cp = Math.cos(R3.pitch);
  R3.camera.position.set(tx + Math.sin(R3.yaw)*d*cp, d*Math.sin(R3.pitch), tz + Math.cos(R3.yaw)*d*cp);
  R3.camera.lookAt(tx, 0.6, tz);
  // light, weather, windows, lamps
  const dark = r3Sky(frac);
  r3Weather(dt);
  if (ts - R3.winT > 500){ R3.winT = ts; (R3.bldGroups||[]).forEach(g=>{ const m = g.userData.frontMat; if (m) m.emissiveIntensity = dark>0.12 && litBuilding(g.userData.b) ? 0.9*dark/0.68+0.25 : 0; }); }
  if (R3.glows) R3.glows.forEach(g=>{ g.visible = dark>0.08; g.material.opacity = Math.min(1, dark*1.6); });
  if (ts - R3.lampT > 400){ R3.lampT = ts; const near = LAMPS.map(([x,y])=>[x,y,Math.hypot(x-tx,y-tz)]).sort((a,b)=>a[2]-b[2]); R3.lampLights.forEach((l,i)=>{ const n = near[i]; if (!n || dark<0.08){ l.intensity = 0; return; } l.position.set(n[0]+0.72, 1.5, n[1]+0.2); l.intensity = 6*dark; }); }
  if (R3.boats) R3.boats.forEach((b,i)=>{ b.position.y = -0.1 + Math.sin(ts/700+i)*0.04; });
  R3.water.position.y = Math.sin(ts/1400)*0.015;
  r3Villagers(frac, ts, dark);
  R3.renderer.render(R3.scene, R3.camera);
}
// ---------- controls: drag to pan, right-drag or two fingers to turn, wheel or pinch to zoom, tap to pick ----------
function r3Controls(el){
  const ptrs = new Map(); let drag = null, pinch = null, moved = false;
  el.addEventListener('contextmenu', e=>e.preventDefault());
  el.addEventListener('pointerdown', e=>{ try { el.setPointerCapture(e.pointerId); } catch(err){} ptrs.set(e.pointerId, {x:e.clientX, y:e.clientY}); moved = false;
    if (ptrs.size===1) drag = {x:e.clientX, y:e.clientY, cx:cam.x, cy:cam.y, yaw:R3.yaw, pitch:R3.pitch, rot: e.button===2 || e.shiftKey || e.ctrlKey};
    else if (ptrs.size===2){ const [a,b] = [...ptrs.values()]; pinch = {d:Math.hypot(a.x-b.x,a.y-b.y), ang:Math.atan2(b.y-a.y,b.x-a.x), dist:R3.dist, yaw:R3.yaw, my:(a.y+b.y)/2, pitch:R3.pitch}; drag = null; } });
  el.addEventListener('pointermove', e=>{
    if (ptrs.has(e.pointerId)) ptrs.set(e.pointerId, {x:e.clientX, y:e.clientY});
    if (pinch && ptrs.size===2){ const [a,b] = [...ptrs.values()]; const d = Math.hypot(a.x-b.x,a.y-b.y), ang = Math.atan2(b.y-a.y,b.x-a.x);
      R3.dist = clamp(pinch.dist*pinch.d/Math.max(10,d), 6, 140); R3.yaw = pinch.yaw - (ang-pinch.ang); R3.pitch = clamp(pinch.pitch + (((a.y+b.y)/2)-pinch.my)*0.005, 0.3, 1.45); moved = true; return; }
    if (!drag) return;
    const dx = e.clientX-drag.x, dy = e.clientY-drag.y;
    if (Math.hypot(dx,dy) > 5){ moved = true; el.style.cursor = 'grabbing'; }
    if (!moved) return;
    if (drag.rot){ R3.yaw = drag.yaw - dx*0.008; R3.pitch = clamp(drag.pitch + dy*0.005, 0.3, 1.45); return; }
    cam.follow = false; $('zFollow').classList.remove('on');
    const s = R3.dist*0.0016*TILE * (900/Math.max(300, R3.h||600));
    const rx = Math.cos(R3.yaw), rz = -Math.sin(R3.yaw), fx = -Math.sin(R3.yaw), fz = -Math.cos(R3.yaw);
    cam.x = drag.cx - dx*s*rx + dy*s*fx/Math.max(0.35, Math.sin(R3.pitch)); cam.y = drag.cy - dx*s*rz + dy*s*fz/Math.max(0.35, Math.sin(R3.pitch));
  });
  const end = e=>{ ptrs.delete(e.pointerId); if (ptrs.size<2) pinch = null; if (!ptrs.size){ if (!moved && drag) r3Pick(e.clientX, e.clientY); drag = null; el.style.cursor = 'grab'; } };
  el.addEventListener('pointerup', end); el.addEventListener('pointercancel', end);
  el.addEventListener('wheel', e=>{ e.preventDefault(); R3.dist = clamp(R3.dist*(e.deltaY>0?1.12:1/1.12), 6, 140); }, {passive:false});
  window.addEventListener('keydown', e=>{ if (!R3.on || /input|textarea|select/i.test((document.activeElement||{}).tagName||'')) return; const k = e.key.toLowerCase(); if ('qewasd'.includes(k) || k.startsWith('arrow')){ R3.keys[k] = true; e.preventDefault(); } });
  window.addEventListener('keyup', e=>{ R3.keys[e.key.toLowerCase()] = false; });
}
function r3Pick(clientX, clientY){
  const r = R3.c3.getBoundingClientRect(), v = new THREE.Vector3(); let best = null, bd = 30;
  for (const [id,s] of R3.sprites){ if (!s.visible) continue; v.set(s.position.x, s.scale.y*0.5, s.position.z).project(R3.camera); if (v.z>1) continue;
    const sx = (v.x+1)/2*r.width + r.left, sy = (1-v.y)/2*r.height + r.top, d = Math.hypot(sx-clientX, sy-clientY); if (d<bd){ bd=d; best=id; } }
  if (best){ ui.sel = best; if (ui.tab!=='people') $('tabs').querySelector('[data-p=people]').click(); else renderPeople(); }
}

// ---------- main loop ----------
let catchingUp = false;
function frame(ts){
  if (!catchingUp){
    const target = Math.floor(clock.now());
    const backlog = target - S.minute;
    if (backlog > 2000){ catchUp(backlog, 'Pixel Town kept running while this tab was in the background.'); }
    else {
      let n=0; const t0=performance.now();
      while (S.minute < target && n < 400 && performance.now()-t0 < 12){ simTick(); n++; if (modOf(S.minute)%60===0) saveGame(); }
      if (S.minute < target-60) clock.rebase(S.minute);
      if (n) syncAnimals();
    }
    const frac = clamp(clock.now() - S.minute, 0, 1);
    updateAnimals(Math.min(0.1,(ts-lastFrameTs)/1000));
    if (R3.on && R3.ready) r3Render(frac, ts); else render(frac, ts);
    music.update();
    renderPanels(false);
  }
  requestAnimationFrame(frame);
}
function catchUp(minutes, reason, done){
  catchingUp = true;
  const cap = 7*DAY; const todo = Math.min(minutes, cap); const skipped = minutes - todo;
  const startLen = S.chronicle.length, startMin = S.minute; let doneN = 0;
  overlay(`<h3>While you were away…</h3><p>${esc(reason)}</p><p class="muted">Simulating ${Math.round(todo/60)} game hours (${(todo/DAY).toFixed(1)} days) for ${S.citizens.length} villagers…</p><div class="prog"><i id="progBar"></i></div>`);
  const chunk = () => {
    const t0 = performance.now();
    while (doneN < todo && performance.now()-t0 < 35){ simTick(); doneN++; }
    const pb=$('progBar'); if (pb) pb.style.width = (doneN/todo*100).toFixed(1)+'%';
    if (doneN < todo){ setTimeout(chunk, 0); return; }
    clock.rebase(S.minute); S.bubbles=[]; S.citizens.forEach(c=>c.rt.seg=null); syncAnimals(); saveGame(true);
    const news = S.chronicle.slice(startLen).filter(e=>e.imp>=6);
    overlay(`<h3>While you were away</h3><p>${(todo/DAY).toFixed(1)} game days passed in Pixel Town (${fmtStamp(startMin)} → ${fmtStamp(S.minute)}).${skipped>0?` The town slept through the rest: at most 7 game days are simulated while you're gone.`:''}</p>
      ${news.length?`<div>${news.slice(-25).map(e=>`<div class="ev ${e.imp>=7?'major':''}"><time>${esc(fmtStamp(e.t))}</time><span>${esc(e.icon)}</span><span>${esc(e.text)}</span></div>`).join('')}</div>`:'<p class="muted">Nothing major happened.</p>'}
      <div class="row" style="margin-top:12px"><button class="btn primary" id="ovClose">Back to town</button></div>`);
    $('ovClose').onclick = ()=>{ overlay(''); };
    catchingUp = false; ui.dirty=true; renderPanels(true); if (done) done();
  };
  setTimeout(chunk, 30);
}
function welcome(upgraded){
  overlay(`<h3>${upgraded?'Pixel Town has grown':'Welcome to Pixel Town'}</h3>
    ${upgraded?'<p>The town was rebuilt bigger: 50 villagers, ranchers and their animals, butchers, fishers on a new lake, a town well, and hi-bit art. A new chronicle starts today; your music settings were kept.</p>':''}
    <p>Fifty villagers live, work, trade, gossip and vote here on one shared clock: <b>1 real hour = 1 game day</b> (2.5 seconds per game minute).</p>
    <ul style="padding-left:18px;font-size:14px"><li>Drag to pan, scroll or pinch to zoom, and tap a villager to follow their life. Press <b>3D</b> (bottom right) to see the town in 3D: right-drag, two fingers or Q/E turn the camera.</li>
    <li>Everything that happens goes into the <b>Log</b>, and each game week gets a report in <b>Weekly</b>.</li>
    <li>The town keeps running while the page is closed (up to 7 game days are simulated when you return).</li>
    <li>Every 4 weeks the town elects a <b>leader</b> and a <b>council of 5</b>, who draft laws and sway votes (<b>Gov</b> tab).</li>
    <li>Homes, businesses and plots are bought and sold, and the town can vote to annex new territory (<b>Land</b> tab).</li>
    <li>Villagers are wealthy, upper, middle class or poor. The rich build palaces, hotels, apartment towers, bathhouses and theaters, rivals open competing shops, and you can build or demolish from the <b>Land</b> tab.</li>
    <li>Villagers marry, have children and pass away; newcomers arrive with their own agendas. Add your own in <b>People</b> using the villager template.</li>
    <li>Villagers think and feel: emotions and the people they care about drive their goals. They team up, fall in love (sometimes with the wrong person), take up careers the town is missing, play sport, make music, print a newspaper, and sometimes try to change the town outside the rules (<b>Society</b> tab).</li>
    <li>Turn on the soundtrack in <b>Music</b>, and add your own Suno songs there.</li></ul>
    <div class="row" style="margin-top:10px"><button class="btn primary" id="ovGo">Enter town</button><button class="btn" id="ovMusic">Enter with music ♪</button></div>`);
  $('ovGo').onclick = ()=>overlay('');
  $('ovMusic').onclick = ()=>{ overlay(''); if (!music.cfg.on) music.toggle(); };
}
function fmtAway(ms){ const m=Math.round(ms/60000); if (m<60) return `${m} minute${m===1?'':'s'}`; const h=Math.round(m/6)/10; if (h<48) return `${h} hours`; return `${Math.round(h/24)} days`; }
function boot(){
  buildMap();
  const sv = loadGame();
  let upgraded = false;
  if (sv){
    S = sv.state; RNG.s = S.rng || 1; S.bubbles = []; upgradeV3(S); fixPropTypes(); applyWorldChanges(); fixPropTypes(); indexCitizens();
    clock.speed = sv.clock.speed||1; clock.paused = !!sv.clock.paused;
    clock.gameAnchor = S.minute; clock.realAnchor = Date.now();
    if (!clock.paused){
      const away = Math.floor((Date.now() - sv.savedAt)/MS_PER_GAME_MIN) + Math.max(0, Math.floor(sv.clock.gameAt) - S.minute);

    }
  } else {

    S.citizens.forEach(c=>{ c.plan = buildPlan(c, 0); });
    chronicle('Pixel Town is founded. Fifty villagers wake up to their first spring morning.', 7, '🏡', 'founding');
    chronicle('Word around the tavern: the old river bridge creaks badly under a full cart.', 5, '🌉', 'infrastructure');
    clock.gameAnchor = S.minute; clock.realAnchor = Date.now();

    welcome(upgraded);

  resizeCanvas(); cam.x = 26*TILE; cam.y = 24*TILE; clampCam();
  renderPanels(true);

}
let resetting = false;
document.addEventListener('visibilitychange', ()=>{ if (document.hidden && !resetting) saveGame(true); });
window.addEventListener('pagehide', ()=>{ if (!resetting) saveGame(true); });
(function(){
  const f=document.createElement('div'); f.className='row'; f.style.cssText='margin-top:4px;font-size:12px';
  f.innerHTML=`<span class="muted">Deterministic fallback AI · autosaves in this browser · drag to pan, scroll to zoom</span><button class="btn" id="resetBtn" style="margin-left:auto;font-size:12px">Reset town</button>`;
  $('stage').appendChild(f);
  $('resetBtn').onclick=()=>{ if (confirm('Start Pixel Town over from day 1? The log will be erased. Export it first if you want to keep it.')){ resetting=true; store.del(SAVE_KEY); location.reload(); } };
})();
window.PT = { get S(){return S;}, simulate(n){ for (let i=0;i<n;i++) simTick(); clock.rebase(S.minute); S.bubbles=[]; S.citizens.forEach(c=>c.rt.seg=null); syncAnimals(); renderPanels(true); }, clock, cam, music, weekToMarkdown, liveWeekEntry };
boot();
