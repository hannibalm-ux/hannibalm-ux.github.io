<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Pixel Town</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&family=VT323&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#12131c; --panel:#1b1d2a; --panel-2:#23263a; --line:#33374f; --text:#e9e6da; --muted:#9a9cb3;
  --accent:#f2c14e; --accent-2:#7fd1ae; --bad:#e46a6a; --good:#7fd17f; --link:#8fb8ff;
}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--text);font:15px/1.45 system-ui,-apple-system,"Segoe UI",sans-serif}
button,select,input{font:inherit;color:inherit}
header{display:flex;flex-wrap:wrap;align-items:center;gap:10px 18px;padding:10px 16px;border-bottom:2px solid var(--line);background:var(--panel)}
h1{font:14px/1 "Press Start 2P",monospace;margin:0;color:var(--accent);letter-spacing:1px}
#clock{font:22px/1 VT323,monospace;display:flex;gap:14px;flex-wrap:wrap;align-items:baseline}
#clock b{color:var(--accent);font-weight:normal;font-size:26px}
.speed{display:flex;gap:4px;margin-left:auto;flex-wrap:wrap}
.speed button,.btn{background:var(--panel-2);border:2px solid var(--line);border-radius:4px;padding:4px 9px;cursor:pointer}
.speed button.on,.btn.on{border-color:var(--accent);color:var(--accent)}
.btn:hover,.speed button:hover{border-color:var(--muted)}
.btn.primary{background:var(--accent);color:#1a1405;border-color:var(--accent)}
main{display:grid;grid-template-columns:minmax(0,1fr) 400px;min-height:calc(100vh - 56px)}
#stage{position:relative;min-width:0;padding:12px 16px;display:flex;flex-direction:column;gap:8px}
#viewWrap{position:relative;width:100%;height:clamp(320px,66vh,820px);border:2px solid var(--line);border-radius:4px;overflow:hidden;background:#0b0c12}
#view{width:100%;height:100%;display:block;image-rendering:pixelated;cursor:grab;touch-action:none}
#view.dragging{cursor:grabbing}
#mini{position:absolute;top:8px;right:8px;width:209px;height:95px;border:2px solid rgba(255,255,255,.35);border-radius:3px;image-rendering:pixelated;cursor:pointer;background:#000}
.camctl{position:absolute;right:8px;bottom:8px;display:flex;gap:4px}
.camctl button{background:rgba(20,21,32,.85);border:1px solid rgba(255,255,255,.3);border-radius:4px;color:#fff;width:34px;height:34px;cursor:pointer;font-size:16px}
.camctl button.on{border-color:var(--accent);color:var(--accent)}
#tip{position:absolute;pointer-events:none;background:rgba(15,16,26,.94);border:1px solid var(--line);padding:5px 8px;border-radius:4px;font-size:13px;display:none;max-width:240px;z-index:3}
#ticker{font:19px/1.2 VT323,monospace;color:var(--muted);min-height:24px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
#ticker span{color:var(--accent)}
.stats{display:flex;flex-wrap:wrap;gap:8px}
.stat{background:var(--panel);border:1px solid var(--line);border-radius:4px;padding:6px 10px;min-width:104px}
.stat small{display:block;color:var(--muted);font-size:11px;text-transform:uppercase;letter-spacing:.5px}
.stat strong{font:22px/1.1 VT323,monospace}
aside{border-left:2px solid var(--line);background:var(--panel);display:flex;flex-direction:column;min-height:0;max-height:calc(100vh - 56px);position:sticky;top:0}
.tabs{display:flex;flex-wrap:wrap;border-bottom:2px solid var(--line)}
.tabs button{flex:1;background:none;border:0;border-bottom:3px solid transparent;padding:9px 4px;cursor:pointer;color:var(--muted);font:10px/1 "Press Start 2P",monospace}
.tabs button.on{color:var(--accent);border-bottom-color:var(--accent)}
.panel{display:none;overflow:auto;padding:12px 14px;flex:1}
.panel.on{display:block}
h2{font:11px/1.4 "Press Start 2P",monospace;color:var(--accent-2);margin:14px 0 8px}
h2:first-child{margin-top:0}
.muted{color:var(--muted)}
.ev{display:grid;grid-template-columns:62px 22px 1fr;gap:4px;padding:5px 0;border-bottom:1px dashed var(--line);font-size:14px}
.ev time{font:17px/1.1 VT323,monospace;color:var(--muted)}
.ev.major{color:#fff}.ev.major time{color:var(--accent)}
.week{border:1px solid var(--line);border-radius:6px;margin-bottom:12px;background:var(--panel-2)}
.week summary{cursor:pointer;padding:10px 12px;list-style:none}
.week summary::-webkit-details-marker{display:none}
.week summary b{font:10px/1.5 "Press Start 2P",monospace;color:var(--accent)}
.week .body{padding:0 12px 12px;font-size:14px}
.week ul{margin:4px 0 8px;padding-left:18px}
table{border-collapse:collapse;width:100%;font-size:13px}
td,th{padding:4px 5px;border-bottom:1px solid var(--line);text-align:left;vertical-align:middle}
th{color:var(--muted);font-weight:normal;font-size:11px;text-transform:uppercase}
td.num{text-align:right;font-variant-numeric:tabular-nums}
.up{color:var(--bad)}.down{color:var(--good)}
.cit{display:flex;gap:8px;align-items:center;padding:4px 6px;border-radius:4px;cursor:pointer;border:1px solid transparent}
.cit:hover{background:var(--panel-2)}
.cit.sel{border-color:var(--accent);background:var(--panel-2)}
.cit img{image-rendering:pixelated;width:30px;height:51px;flex:none}
.cit .who{flex:1;min-width:0}
.cit .who small{display:block;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.bar{height:7px;background:#0d0e16;border-radius:3px;overflow:hidden;margin:2px 0 6px}
.bar i{display:block;height:100%}
.needs{display:grid;grid-template-columns:70px 1fr 34px;gap:0 8px;font-size:12px;align-items:center}
.chip{display:inline-block;background:var(--panel-2);border:1px solid var(--line);border-radius:10px;padding:1px 8px;margin:2px 3px 2px 0;font-size:12px}
.law{border:1px solid var(--line);border-left:4px solid var(--accent-2);border-radius:4px;padding:8px 10px;margin-bottom:8px;background:var(--panel-2);font-size:14px}
.law.pending{border-left-color:var(--accent)}
.law.rej{border-left-color:var(--bad);opacity:.8}
.vote{font-size:13px;padding:3px 0;border-bottom:1px dashed var(--line)}
.Yes{color:var(--good)}.No{color:var(--bad)}.Abstain{color:var(--muted)}
.card{border:1px solid var(--line);border-radius:6px;padding:10px;margin-bottom:10px;background:var(--panel-2);font-size:14px}
.card pre{white-space:pre-wrap;font:13px/1.4 ui-monospace,monospace;background:#0f1018;padding:8px;border-radius:4px;margin:6px 0;max-height:160px;overflow:auto}
.row{display:flex;gap:6px;align-items:center;flex-wrap:wrap}
input[type=text],input[type=search],select{background:#0f1018;border:1px solid var(--line);border-radius:4px;padding:5px 7px}
input[type=text],input[type=search]{flex:1;min-width:120px}
a{color:var(--link)}
#overlay{position:fixed;inset:0;background:rgba(8,9,14,.82);display:none;align-items:center;justify-content:center;z-index:10;padding:16px}
#overlay .box{background:var(--panel);border:2px solid var(--accent);border-radius:8px;padding:18px 20px;max-width:560px;width:100%;max-height:85vh;overflow:auto}
#overlay h3{font:12px/1.5 "Press Start 2P",monospace;color:var(--accent);margin:0 0 10px}
.prog{height:10px;background:#0d0e16;border-radius:4px;overflow:hidden}.prog i{display:block;height:100%;background:var(--accent);width:0}
@media (max-width:980px){
  main{grid-template-columns:minmax(0,1fr)}
  aside{border-left:0;border-top:2px solid var(--line);max-height:none;position:static}
  .speed{margin-left:0}
  #stage{padding:10px 16px}
  #viewWrap{height:clamp(300px,58vh,640px)}
  #mini{width:132px;height:60px}
}
</style>
</head>
<body>
<header>
  <h1>PIXEL TOWN</h1>
  <div id="clock"></div>
  <div class="speed" id="speed"></div>
</header>
<main>
  <section id="stage">
    <div id="viewWrap">
      <canvas id="view"></canvas>
      <canvas id="mini" width="220" height="100" title="Minimap: tap to jump"></canvas>
      <div class="camctl">
        <button id="zOut" title="Zoom out">−</button>
        <button id="zIn" title="Zoom in">+</button>
        <button id="zFit" title="Show whole town">⤢</button>
        <button id="zFollow" title="Follow selected villager">◎</button>
        <button id="zRotL" title="Turn the camera left (Q)" style="display:none">⟲</button>
        <button id="zRotR" title="Turn the camera right (E)" style="display:none">⟳</button>
        <button id="z3d" title="Switch to the 3D view" style="width:auto;padding:0 8px;font-weight:bold">3D</button>
      </div>
    </div>
    <div id="tip"></div>
    <div id="ticker"></div>
    <div class="stats" id="stats"></div>
  </section>
  <aside>
    <div class="tabs" id="tabs">
      <button data-p="chron" class="on">Log</button>
      <button data-p="weeks">Weekly</button>
      <button data-p="people">People</button>
      <button data-p="market">Market</button>
      <button data-p="land">Land</button>
      <button data-p="laws">Gov</button>
      <button data-p="soc">Society</button>
      <button data-p="music">Music</button>
    </div>
    <div class="panel on" id="p-chron"></div>
    <div class="panel" id="p-weeks"></div>
    <div class="panel" id="p-people"><div id="pAdd"></div><div id="pList"></div></div>
    <div class="panel" id="p-market"></div>
    <div class="panel" id="p-land"></div>
    <div class="panel" id="p-laws"></div>
    <div class="panel" id="p-soc"></div>
    <div class="panel" id="p-music"></div>
  </aside>
</main>
<div id="overlay"><div class="box" id="overlayBox"></div></div>

<script>
'use strict';
/* =====================================================================
   Pixel Town — browser build of the Technical Design Document.
   One authoritative clock at 24x: 2.5 real s = 1 game minute.
   Deterministic per-minute pipeline: Time(100) → Governance(200) →
   Agents(300) → Economy(400). Laws are data pulled through lawQuery.
   Every decision uses the TDD's deterministic fallback path (no LLM).
   Art: hi-bit pixel art generated procedurally at load (hue-shifted
   ramps, ordered dithering, outlined sprites, 2D lighting).
   ===================================================================== */

// ---------- storage (may be unavailable) ----------
const store = {
  get(k){ try{ const v = localStorage.getItem(k); return v ? JSON.parse(v) : null; }catch(e){ return null; } },
  set(k,v){ try{ localStorage.setItem(k, JSON.stringify(v)); return true; }catch(e){ return false; } },
  del(k){ try{ localStorage.removeItem(k); }catch(e){} }
};
const SAVE_KEY = 'pixeltown.save.v2', OLD_SAVE_KEY = 'pixeltown.save.v1', MUSIC_KEY = 'pixeltown.music.v1';

// ---------- constants ----------
const TILE = 16, MW = 110, MH = 50, WW = MW*TILE, WH = MH*TILE, OLD_W = 80;
const MS_PER_GAME_MIN = 2500;
const DAY = 1440;
const SEASONS = ['Spring','Summer','Fall','Winter'];
const WEEKDAYS = ['Moonday','Tideday','Windsday','Thornsday','Fireday','Starday','Hallday'];
const T = {GRASS:0,PATH:1,WATER:2,BRIDGE:3,TREE:4,BUILD:5,FIELD:6,PLAZA:7,ROCK:8,OBJ:9,FLOWER:10,DOCK:11,SAND:12,PASTURE:13,FENCE:14};
const WALK = new Set([T.GRASS,T.PATH,T.BRIDGE,T.PLAZA,T.FIELD,T.FLOWER,T.DOCK,T.SAND,T.PASTURE]);
const clamp = (v,a,b) => v<a?a:v>b?b:v;
const pad2 = n => String(n).padStart(2,'0');

// ---------- seeded RNG (state lives in the save) ----------
const RNG = { s: 20260926,
  next(){ let t = (this.s = (this.s + 0x6D2B79F5) | 0); t = Math.imul(t ^ (t>>>15), t|1); t ^= t + Math.imul(t ^ (t>>>7), t|61); return ((t ^ (t>>>14))>>>0) / 4294967296; } };
const rnd = () => RNG.next();
const pick = arr => arr[Math.floor(rnd()*arr.length)];
function hash(str){ let h = 2166136261; for (let i=0;i<str.length;i++){ h ^= str.charCodeAt(i); h = Math.imul(h,16777619); } return h>>>0; }
function mapRand(seed){ let s = seed|0; return () => { let t = (s = (s + 0x6D2B79F5)|0); t = Math.imul(t^(t>>>15),t|1); t ^= t + Math.imul(t^(t>>>7),t|61); return ((t^(t>>>14))>>>0)/4294967296; }; }
function hashf(x,y,s){ let h = Math.imul(x|0,374761393) ^ Math.imul(y|0,668265263) ^ Math.imul((s|0)+1,2246822519); h = Math.imul(h^(h>>>13),1274126177); h ^= h>>>16; return (h>>>0)/4294967296; }

// ---------- color + pixel helpers ----------
const _rgb = {};
function rgb(hex){ if (_rgb[hex]) return _rgb[hex]; const n=parseInt(hex.slice(1),16); return _rgb[hex]=[n>>16,(n>>8)&255,n&255]; }
function toHex(r,g,b){ return '#'+((1<<24)+(clamp(Math.round(r),0,255)<<16)+(clamp(Math.round(g),0,255)<<8)+clamp(Math.round(b),0,255)).toString(16).slice(1); }
function shade(hex,f){ const [r,g,b]=rgb(hex); return toHex(r*f,g*f,b*f); }
function mix(a,b,t){ const A=rgb(a),B=rgb(b); return toHex(A[0]+(B[0]-A[0])*t,A[1]+(B[1]-A[1])*t,A[2]+(B[2]-A[2])*t); }
const _ramps = {};
// hue-shifted ramp: shadows drift toward violet, highlights toward warm yellow (hi-bit look)
function ramp(hex,n){ n=n||5; const k=hex+n; if (_ramps[k]) return _ramps[k]; const out=[];
  for (let i=0;i<n;i++){ const t=i/(n-1); let c=shade(hex,0.52+0.78*t); c = t<0.5 ? mix(c,'#2b1d4e',(0.5-t)*0.45) : mix(c,'#fff0c0',(t-0.5)*0.34); out.push(c); }
  return _ramps[k]=out; }
const BAY = [0,8,2,10,12,4,14,6,3,11,1,9,15,7,13,5];
function dith(l,x,y,n){ const t=clamp(l,0,0.9999)*(n-1); const b=Math.floor(t); return Math.min(n-1, b + ((t-b)*16 > BAY[((y&3)<<2)|(x&3)]+0.5 ? 1 : 0)); }
function mk(w,h){ const c=document.createElement('canvas'); c.width=w; c.height=h; return c; }
class Pix {
  constructor(w,h){ this.w=w; this.h=h; this.c=mk(w,h); this.g=this.c.getContext('2d'); this.img=this.g.createImageData(w,h); this.d=this.img.data; }
  set(x,y,hex,a){ x=Math.floor(x); y=Math.floor(y); if (x<0||y<0||x>=this.w||y>=this.h) return; a = a===undefined?255:a; const [r,g,b]=rgb(hex); const i=(y*this.w+x)*4, d=this.d;
    if (a<255 && d[i+3]>0){ const t=a/255; d[i]=d[i]*(1-t)+r*t; d[i+1]=d[i+1]*(1-t)+g*t; d[i+2]=d[i+2]*(1-t)+b*t; d[i+3]=Math.max(d[i+3],a); }
    else { d[i]=r; d[i+1]=g; d[i+2]=b; d[i+3]=a; } }
  alpha(x,y){ if (x<0||y<0||x>=this.w||y>=this.h) return 0; return this.d[(y*this.w+x)*4+3]; }
  rect(x,y,w,h,hex,a){ for (let j=0;j<h;j++) for (let i=0;i<w;i++) this.set(x+i,y+j,hex,a); }
  clear(x,y){ if (x<0||y<0||x>=this.w||y>=this.h) return; this.d[(y*this.w+x)*4+3]=0; }
  ellipse(cx,cy,rx,ry,hex,a){ for (let y=Math.floor(cy-ry);y<=cy+ry;y++) for (let x=Math.floor(cx-rx);x<=cx+rx;x++){ const dx=(x+.5-cx)/rx, dy=(y+.5-cy)/ry; if (dx*dx+dy*dy<=1) this.set(x,y,hex,a); } }
  line(x0,y0,x1,y1,hex){ const n=Math.max(Math.abs(x1-x0),Math.abs(y1-y0))||1; for (let i=0;i<=n;i++) this.set(Math.round(x0+(x1-x0)*i/n), Math.round(y0+(y1-y0)*i/n), hex); }
  // full dark outline around opaque pixels (like the reference sprite)
  outline(col){ col=col||'#1b1320'; const w=this.w,h=this.h,src=new Uint8ClampedArray(this.d); const A=(x,y)=> (x<0||y<0||x>=w||y>=h)?0:src[(y*w+x)*4+3];
    for (let y=0;y<h;y++) for (let x=0;x<w;x++){ if (A(x,y)>60) continue; if (A(x-1,y)>200||A(x+1,y)>200||A(x,y-1)>200||A(x,y+1)>200) this.set(x,y,col); } return this; }
  done(){ this.g.putImageData(this.img,0,0); return this.c; }
}
// sphere-lit blob with dithering; circles later in the list sit in front
function blob(p, circles, R, opt){
  opt=opt||{}; const lx=-0.55, ly=-0.8;
  let x0=1e9,y0=1e9,x1=-1e9,y1=-1e9; circles.forEach(c=>{ x0=Math.min(x0,c.x-c.r); y0=Math.min(y0,c.y-c.r); x1=Math.max(x1,c.x+c.r); y1=Math.max(y1,c.y+c.r); });
  for (let y=Math.floor(y0);y<=y1;y++) for (let x=Math.floor(x0);x<=x1;x++){
    let hit=null; for (const c of circles){ const dx=x+.5-c.x, dy=y+.5-c.y; if (dx*dx+dy*dy<=c.r*c.r) hit=[c,dx,dy]; }
    if (!hit) continue;
    const nx=hit[1]/hit[0].r, ny=hit[2]/hit[0].r, nz=Math.sqrt(Math.max(0,1-nx*nx-ny*ny));
    let l = 0.18 + 0.82*Math.max(0, -(nx*lx+ny*ly)*0.7 + nz*0.45);
    if (opt.noise) l += (hashf(x,y,opt.seed||0)-0.5)*opt.noise;
    p.set(x,y,R[dith(l+(opt.bias||0),x,y,R.length)]);
  }
}

// ---------- map ----------
const BUILDINGS = [
  {id:'bld_town_hall', name:'Town Hall',             x:23,y:9, w:7,h:5, style:'hall',   roof:'#3d5588'},
  {id:'loc_tavern',    name:'The Tipsy Lantern',     x:34,y:12,w:6,h:5, style:'tavern', roof:'#6a3020', sign:'mug'},
  {id:'loc_bakery',    name:'Marsh Bakery',          x:14,y:10,w:5,h:4, style:'house',  roof:'#c07a34', sign:'bread'},
  {id:'loc_clinic',    name:'Clinic',                x:7, y:10,w:5,h:4, style:'stone',  roof:'#a8403c', sign:'cross'},
  {id:'loc_carpentry', name:'Holt & Finch Carpentry',x:13,y:17,w:5,h:4, style:'house',  roof:'#7a5a32', sign:'saw'},
  {id:'loc_smithy',    name:'Brandt Smithy',         x:35,y:20,w:5,h:4, style:'stone',  roof:'#4a4e5c', sign:'anvil'},
  {id:'loc_butcher',   name:'Hock & Cleaver Butchery',x:35,y:26,w:5,h:4, style:'house', roof:'#8a2a2a', sign:'meat'},
  {id:'loc_fisher_hut',name:'Lakeside Fish Hut',     x:37,y:33,w:4,h:3, style:'hut',    roof:'#c8a458', sign:'fish'},
  {id:'loc_barn',      name:'Red Barn',              x:4, y:30,w:6,h:4, style:'barn',   roof:'#6a3a2a'},
  {id:'loc_mine',      name:'Deepvein Mine',         x:67,y:4, w:4,h:3, style:'mine'}
];
const HOUSE_SLOTS = [[2,2],[7,2],[12,2],[17,2],[22,2],[27,2],[32,2],[37,2],[42,2],[2,16],[8,17],[2,22],[8,23],[14,23],[11,28],[42,11],[42,17],[42,23],[42,29]];
const HOUSE_NAMES = ['Holt House','Finch House','Reed Farmhouse','Vale House','Stone House','Brandt House','Cole House','Ashby House'];
const HOUSE_ROOFS = ['#9b5d3a','#5d7b4a','#b0782e','#6a4a8a','#6b6b72','#8a3a3a','#3a6a7a','#4a6a3a','#b8683a','#7a5a9a','#5a6a8a','#9a4a5a','#4a7a6a'];
HOUSE_SLOTS.forEach(([x,y],i)=>BUILDINGS.push({id:'loc_house_'+pad2(i+1), name:HOUSE_NAMES[i]||'Cottage', x,y,w:4,h:4, style:'house', roof:HOUSE_ROOFS[i%HOUSE_ROOFS.length], house:true}));
BUILDINGS.forEach(b => b.door = [b.x + Math.floor(b.w/2), b.y + b.h]);
const STALLS = [[21,27],[25,27],[29,27]];
const WELL = [21,23], FOUNTAIN = [25,19];
const LOC = {};
BUILDINGS.forEach(b => { if (!b.id.startsWith('bld_')) LOC[b.id] = {id:b.id, name:b.name, indoor:true, door:b.door, b}; });
Object.assign(LOC, {
  loc_town_square: {id:'loc_town_square', name:'Town Square', rects:[[20,15,32,25]]},
  loc_town_hall:   {id:'loc_town_hall',   name:'Town Hall Steps', rects:[[20,15,32,18]]},
  loc_market:      {id:'loc_market',      name:'Market',      rects:[[20,26,32,26],[20,29,32,29]]},
  loc_farm:        {id:'loc_farm',        name:'Wheatfields', rects:[[18,34,34,46]]},
  loc_pasture:     {id:'loc_pasture',     name:'West Pasture', rects:[[3,36,15,47]]},
  loc_docks:       {id:'loc_docks',       name:'Lake Docks',  rects:[]},
  loc_east_grove:  {id:'loc_east_grove',  name:'East Grove',  rects:[[61,17,67,23]]},
  loc_well:        {id:'loc_well',        name:'Town Well',   rects:[[20,22,24,25]]},
  loc_school:      {id:'loc_school',      name:'Schoolhouse (Town Hall)', indoor:true, door:[26,14]}
});
Object.values(LOC).forEach(L=>{ if (!L.indoor) L.indoor=false; });
let LAMPS = [];
const MAP = [], TVAR = [];
let BRIDGE_TILES = [], DOCK_TILES = [], WATER_TILES = [], PUDDLES = [], RAIL_TILES = [], GRAVE_SLOTS = [], PLOTS = [];

// the frontier east of the old map edge: Highcrest hills to the north, Eastmarch meadows and a pond to the south
function buildFrontier(set, get, fr){

    const n = hashf(x>>2,y>>2,31)*0.6 + hashf(x,y,32)*0.4;
    if (y<=19){ const rock = (19-y)/19*0.55 + (hashf(x>>1,y>>1,33)-0.5)*0.5; if (rock>0.45) set(x,y,T.ROCK); else if (n>0.55) set(x,y,T.TREE); }
    else { const edge = x<OLD_W+4 ? 0.55 : 0; if (n>0.78-edge*0.3 || (edge && fr()<0.5)) set(x,y,T.TREE); else if (fr()<0.07) set(x,y,T.FLOWER); }
  }
  for (let y=29;y<=37;y++) for (let x=94;x<=104;x++){ const dx=(x-99)/5, dy=(y-33)/3.8; if (dx*dx+dy*dy<=1) set(x,y,T.WATER); else if (dx*dx+dy*dy<=1.6 && get(x,y)!==T.TREE) set(x,y,T.SAND); }
}
// buildable 4x4 plots, found by scanning each territory for clear ground
function computePlots(){

  TERRITORIES.forEach(tr=>{
    let n=0; const [x0,y0,x1,y1]=tr.rect;
    for (let y=y0+1;y<=y1-5 && n<caps[tr.id];y+=2) for (let x=x0+1;x<=x1-4 && n<caps[tr.id];x+=2){
      let ok=true;
      for (let j=-1;j<=4 && ok;j++) for (let i=-1;i<=4 && ok;i++){ const t=(MAP[y+j]||[])[x+i]; if (t===undefined){ ok=false; break; } if (j>=0&&j<4&&i>=0&&i<4){ if (!okFoot(t)) ok=false; } else if (t===T.BUILD||t===T.WATER||t===T.FENCE||t===T.OBJ||t===T.PLAZA||t===T.FIELD||t===T.DOCK||t===T.BRIDGE) ok=false; }
      if (ok && PLOTS.some(p=>Math.abs(p.x-x)<6 && Math.abs(p.y-y)<6)) ok=false;

}

function roadCost(x,y){
  const t = MAP[y][x];

}
function walkable(x,y){

}
function agentCost(x,y){

// A* with a binary heap; the goal tile may be a building door or otherwise blocked tile
function astar(sx,sy,tx,ty,cost){
  const N=MW*MH, g=new Float32Array(N).fill(Infinity), came=new Int32Array(N).fill(-1), closed=new Uint8Array(N);
  const hx=[], hf=[];

    const cur=pop(); if (closed[cur]) continue; closed[cur]=1;
    if (cur===goal){ const path=[]; let k=cur; while (k!==-1){ path.push([k%MW,Math.floor(k/MW)]); k=came[k]; } return path.reverse(); }
    const cx=cur%MW, cy=Math.floor(cur/MW);

      const nx=cx+(d===0?1:d===1?-1:0), ny=cy+(d===2?1:d===3?-1:0);

    }

}
const pathCache = new Map();
function findPath(sx,sy,tx,ty){
  const k = `${sx},${sy}>${tx},${ty}|${S.bridge.closed?1:0}`;
  if (pathCache.has(k)){ const p=pathCache.get(k); return p ? p.slice() : null; }

  if (pathCache.size>6000) pathCache.clear();
  pathCache.set(k, p||null);
  return p ? p.slice() : null;
}
const SPOTS = {};
function spotsFor(locId){
  if (SPOTS[locId]) return SPOTS[locId];
  const L = LOC[locId]; let out=[];
  if (L.tiles) out = L.tiles.slice();
  (L.rects||[]).forEach(([x0,y0,x1,y1])=>{ for (let y=y0;y<=y1;y++) for (let x=x0;x<=x1;x++) if (walkable(x,y)) out.push([x,y]); });

}

// ---------- calendar ----------
const dayOf = m => Math.floor(m/DAY);
const modOf = m => ((m%DAY)+DAY)%DAY;
const seasonOf = d => Math.floor(d/28)%4;
const yearOf = d => Math.floor(d/112)+1;
function phaseOf(mod){ return mod<300?'Night':mod<420?'Dawn':mod<1080?'Day':mod<1260?'Dusk':'Night'; }
function fmtClock(m){ const mod=modOf(m); return pad2(Math.floor(mod/60))+':'+pad2(mod%60); }
function fmtDate(d){ return `${WEEKDAYS[d%7]}, ${SEASONS[seasonOf(d)]} ${d%28+1}, Year ${yearOf(d)}`; }
function fmtStamp(m){ const d=dayOf(m); return `Day ${d+1} ${fmtClock(m)}`; }
const weekNo = d => Math.floor(d/7)+1;

function remember(c, text, imp, subj, kind){
  const rec = {id:'mem_'+String(++S.memCounter).padStart(6,'0'), kind:kind||'Observation', t:S.minute, imp, text, subj:subj||[]};
  const recs = c.memory.records; recs.push(rec);
  if (recs.length>40){ let wi=0; for (let i=1;i<recs.length-5;i++) if (recs[i].imp<recs[wi].imp) wi=i; recs.splice(wi,1); }
  c.memory.since += imp;
}

function activeLaws(){ return S.gov.proposals.filter(p=>p.status==='Enacted'); }
function effects(){ const out=[]; activeLaws().forEach(p=>p.effects.forEach(e=>out.push(e))); return out; }
function effTargets(e,g){ return e.targetGoodId===g || (e.targetCategory && GD[g].cat===e.targetCategory); }
const lawQuery = {
  priceMultiplier(g){ let m=1; effects().forEach(e=>{ if (e.effectType==='PriceMultiplier' && effTargets(e,g)) m*=e.magnitude; }); return m; },

function startBlock(c, b){
  c.rt.did = false;
  const [tx,ty] = spotFor(c, b.loc);
  c.rt.dest = b.loc;
  if (c.rt.x===tx && c.rt.y===ty){ c.rt.path=null; arrive(c,b); return; }
  const p = findPath(c.rt.x, c.rt.y, tx, ty);
  if (!p){ c.rt.path=null; c.rt.state='Idle'; return; }
  p.shift(); c.rt.path = p.length ? p : null; c.rt.state='Traveling'; c.rt.loc=null;
  if (!c.rt.path) arrive(c,b);
}
function step(c){
  c.rt.ox = c.rt.x; c.rt.oy = c.rt.y; const seg=[[c.rt.x,c.rt.y]];
  for (let i=0;i<2 && c.rt.path && c.rt.path.length;i++){
    const [nx,ny] = c.rt.path.shift();
    if (MAP[ny][nx]===T.BRIDGE && S.bridge.closed){ c.rt.path=null; break; }
    c.rt.x=nx; c.rt.y=ny; seg.push([nx,ny]);
  }
  c.rt.seg = seg;
  if (c.rt.path && !c.rt.path.length) c.rt.path = null;
}
function arrive(c, b){
  c.rt.ox=c.rt.x; c.rt.oy=c.rt.y;
  c.rt.loc = b.loc; c.rt.state = STATE_FOR[b.act]||'Idle'; c.rt.since = S.minute;
  if (b.act==='Eat' && !c.rt.did){ c.rt.did=true; if (modOf(S.minute)<10*60) tryReadPaper(c); doMeal(c,b); }
  if (b.target==='match' && !c.rt.did){ c.rt.did=true; const fee = c.profession==='Child' ? 1 : 3; if (c.wallet>=fee){ c.wallet-=fee; today(c).exp+=fee; S.matchGate=(S.matchGate||0)+fee; } }
  if (b.target==='protest' && !c.rt.did){ c.rt.did=true; S.bubbles.push({id:c.id, text:'✊', until:performance.now()+3000, gm:S.minute}); }
  if (b.act==='Trade' && b.target==='svc_medical_checkup' && !c.rt.did){ c.rt.did=true; clinicVisit(c); }
  if (b.act==='Chore' && !c.rt.did){ c.rt.did=true; c.needs.comfort=clamp(c.needs.comfort+6,0,100); }
  if (b.target && b.target.startsWith('svc_') && b.target!=='svc_hot_meal' && b.target!=='svc_medical_checkup' && !c.rt.did){ c.rt.did=true;
    const p = buyService(c, b.target, b.loc);
    if (p && hash(c.id+S.minute)%4===0) remember(c, b.target==='svc_show' ? `Saw a show at ${LOC[b.loc].name}. ${p.name} was on stage.` : `Had a long soak at ${LOC[b.loc].name}.`, 3, [p.id]);
    if (!p) setEmotion(c,'Bored',60);
  }
  if (b.act==='Socialize' && isTavern(b.loc) && !c.rt.did){
    c.rt.did=true;
    if (c.needs.hunger<70){ const p=buyService(c,'svc_hot_meal',b.loc); if (!p) eatSomething(c); }
    if (c.needs.fun<85 && buy(c,'good_ale',1)) consume(c,'good_ale');
  }
}
function doMeal(c,b){
  if (c.needs.hunger>85) return;
  if (b.target==='svc_hot_meal'){ const p=buyService(c,'svc_hot_meal',b.loc); if (p){ if (hash(c.id+S.minute)%9===0) remember(c, `Had a hot meal at ${LOC[b.loc]?LOC[b.loc].name:'the tavern'}. ${p.name} served it.`, 2, [p.id]); return; } }
  if (!eatSomething(c)) remember(c, c.wallet >= 30 ? 'Skipped a meal; the market had sold out of food.' : 'Skipped a meal; there was nothing I could afford.', 4);
}
function foodValue(g){ return S.goods[g].price / GD[g].need.hunger; }
function eatSomething(c){
  let ate=false;
  for (const g of FOODS) while (c.inventory[g] && c.needs.hunger<72){ consume(c,g); ate=true; }
  if (c.needs.hunger>=72) return ate;
  const order = FOODS.filter(g=>listed(g)>0).sort((a,b)=>foodValue(a)-foodValue(b));
  for (let k=0;k<3 && c.needs.hunger<72;k++){ let got=false; for (const g of order){ if (buy(c,g,1)){ consume(c,g); got=ate=true; break; } } if (!got) break; }
  if (!order.length) recordDemand('good_bread',1);
  // sold out at the market: those with money buy straight from a producer's own stock, at a premium
  if (c.needs.hunger<72 && c.wallet>=60) ate = buyDirect(c) || ate;
  stockPantry(c);
  return ate;
}
function pantrySize(c){ return FOODS.reduce((a,g)=>a+(c.inventory[g]||0),0); }
// villagers who can afford it keep a few days of food at home; the richer, the fuller the larder
function stockPantry(c){
  if (!isAdult(c) || c.wallet<120) return;
  const want = c.wallet>=1000 ? 6 : c.wallet>=400 ? 4 : 2;
  const order = ['good_eggs','good_vegetables','good_bread','good_meat','good_fish','good_milk'].filter(g=>listed(g)>4);
  for (const g of order){ if (pantrySize(c)>=want || c.wallet < 100) break; buy(c, g, 1); }
}
function buyDirect(c){
  for (const o of S.citizens){
    if (o===c || !isAdult(o)) continue;
    const keep = o.profession==='TavernKeeper' ? 2 : 0;
    const g = FOODS.find(g=>(o.inventory[g]||0) > (g==='good_bread' && o.profession==='Baker' ? 1 : keep));
    if (!g) continue;
    const price = Math.ceil(S.goods[g].price*1.5);
    if (c.wallet < price) return false;
    c.wallet -= price; o.wallet += price; today(c).exp += price; today(o).inc += price;
    o.inventory[g]--; if (!o.inventory[g]) delete o.inventory[g];
    c.inventory[g] = (c.inventory[g]||0)+1; consume(c, g);
    if (hash(c.id+S.minute)%6===0) remember(c, `The market was empty, so I paid ${o.name} ${price}¢ for ${GD[g].name.toLowerCase()} from their own stores.`, 3, [o.id]);
    return true;
  }
  return false;
}
function clinicVisit(c){
  const p = buyService(c,'svc_medical_checkup');
  if (p){ c.sick=0; chronicle(`Dr. ${p.name.split(' ')[1]} treated ${c.name}, who is on the mend.`, 4, '🩺', 'health'); remember(c, `${p.name} treated me at the clinic. I feel better already.`, 5, [p.id]); adjustRel(c,p,6); }
  else remember(c, 'I went to the clinic but could not get seen.', 4);
}
function charity(c){
  const donor = S.citizens.filter(d => d!==c && (d.traits.includes('Generous') || peekRel(d,c.id).affinity>60) && d.wallet>150 && d.age>=16 && peekRel(d,c.id).affinity>10).sort((a,b)=>peekRel(b,c.id).affinity-peekRel(a,c.id).affinity)[0];
  if (!donor) return;
  const amt = 20; donor.wallet -= amt; c.wallet += amt;
  chronicle(`${donor.name} gave ${c.name} ${amt} coins for food.`, 4, '🤝', 'social');
  remember(c, `${donor.name} gave me coins when I was hungry. I won't forget it.`, 7, [donor.id]);
  remember(donor, `I helped ${c.name} buy food.`, 4, [c.id]);
  adjustRel(c, donor, 14); adjustRel(donor, c, 5);
}
function activity(c, b, mod){
  const n=c.needs;
  switch (b.act){
    case 'Sleep': if (c.rt.state!=='Sleeping') c.rt.state='Sleeping'; break;
    case 'Work': work(c); break;
    case 'Socialize': n.social=clamp(n.social+0.32,0,100); n.fun=clamp(n.fun+0.14,0,100);
      if ((mod+hash(c.id))%20===0) socialize(c);
      if (c.traits.includes('Reckless') && isTavern(b.loc) && (mod%90===0) && n.fun<95 && buy(c,'good_ale',1)) consume(c,'good_ale');
      break;
    case 'Leisure': n.fun=clamp(n.fun+0.16,0,100); if (!LOC[b.loc].indoor && (mod+hash(c.id))%30===0) socialize(c); break;
    case 'Chore': if ((mod+hash(c.id))%15===0) socialize(c); break;
    case 'AttendTownHall': n.social=clamp(n.social+0.1,0,100); break;
  }
  if (c.rt.state==='Working' && b.act==='Work' && mod%60===17){
    if ((n.comfort<40 && c.wallet > S.goods.good_furniture.price*1.6) || (n.comfort<68 && c.wallet>450)){ if (buy(c,'good_furniture',1)){ consume(c,'good_furniture'); remember(c,'Bought a new piece of furniture for the house.',3,['good_furniture'],'Transaction'); } }
    else if (n.comfort<30 && !c.rt.did2){ c.rt.did2=true; if (buyService(c,'svc_home_repair')) remember(c,'Paid a carpenter to fix up the house.',3); }
  }
}
const PROD = {
  Farmer:{every:40, tool:true}, Rancher:{every:30, tool:true}, Fisher:{every:70, make:'good_fish', tool:true},
  Woodcutter:{every:55, make:'good_timber', tool:true}, Miner:{every:75, make:'good_ore', tool:true},
  Baker:{every:45, make:'good_bread'}, TavernKeeper:{every:60, make:'good_ale'}, Butcher:{every:90, make:'good_meat'},
  Blacksmith:{every:220, make:'good_tools', cap:3}, Carpenter:{every:150, make:'good_furniture', cap:3}, Journalist:{every:80, make:'good_newspaper', cap:10},
  Unemployed:{every:95, make:'good_timber'}
};
function useTool(c, every){
  c.tool = Math.max(0, c.tool - 0.012);
  if (c.tool>=10) return every;
  if (S.minute-(c.lastTry.tools||-999)>180){ c.lastTry.tools=S.minute;
    if (buy(c,'good_tools',1)){ c.inventory.good_tools--; if (!c.inventory.good_tools) delete c.inventory.good_tools; c.tool=100; remember(c,'Bought a new set of iron tools.',3,['good_tools'],'Transaction'); }
    else if (!c.lastTry.toolLog){ c.lastTry.toolLog=1; remember(c,'My tools are worn out and I can\'t replace them.',5); } }
  return every*2;
}
function isTavern(bid){ return bizType(bid)==='tavern'; }
function work(c){
  if (c.rt.loc && c.rt.loc.startsWith('site_')){ c.needs.energy = clamp(c.needs.energy-0.02,0,100); return; }
  if (c.strikeUntil && dayOf(S.minute) < c.strikeUntil) return;
  if (c.jail || (c.service && c.rt.loc==='loc_town_square')) return;
  if (c.profession==='Musician'){ busk(c); return; }
  if (c.profession==='Athlete'){ c.workAcc++; c.needs.energy = clamp(c.needs.energy-0.02,0,100); return; }
  const P = PROD[c.profession]; if (!P) return;
  const season = seasonOf(dayOf(S.minute));
  let every = P.every;
  if (c.profession==='Farmer') every*=perk('farm'); if (c.profession==='Fisher') every*=perk('fish'); if (c.profession==='Miner') every*=perk('mine');
  if (c.profession==='Farmer'){ if (S.weather==='Snow') every*=2; if (S.weather==='Rain') every*=0.85; if (season===3) every*=1.4; }
  if (c.profession==='Fisher'){ if (S.weather==='Rain') every*=0.8; if (S.weather==='Snow') every*=1.4; if (season===3) every*=1.2; }
  if (P.tool) every = useTool(c, every);
  if (c.profession==='TavernKeeper' && MEAL_INGREDIENTS.reduce((a,g)=>a+(c.inventory[g]||0),0) < 4 && S.minute-(c.lastTry.ingr||-999)>=30){
    c.lastTry.ingr=S.minute; const g = MEAL_INGREDIENTS.filter(g=>listed(g)>0).sort((a,b)=>foodValue(a)-foodValue(b))[0]; if (g) buy(c,g,3);
  }
  if (c.profession==='Rancher') return ranch(c, every);
  const make = c.profession==='Farmer' ? (hash(c.id+S.minute)%100<60?'good_wheat':'good_vegetables') : P.make;
  const def = GD[make];
  if (P.cap && listed(make) >= P.cap*S.citizens.filter(o=>o.profession===c.profession).length) return;
  if (listed(make, c.id) >= 24) return;
  if (def.recipe){
    for (const g in def.recipe){
      if ((c.inventory[g]||0) < def.recipe[g]){
        if (S.minute-(c.lastTry[g]||-999) >= 30){ c.lastTry[g]=S.minute; buy(c, g, def.recipe[g]*(g==='good_livestock'?1:2)); }
        if ((c.inventory[g]||0) < def.recipe[g]) return;
      }
    }
  }
  c.workAcc++;
  c.needs.energy = clamp(c.needs.energy-0.015,0,100);
  if (c.workAcc < every) return;
  c.workAcc = 0;
  if (def.recipe) for (const g in def.recipe){ c.inventory[g]-=def.recipe[g]; if (c.inventory[g]<=0) delete c.inventory[g]; }
  c.inventory[make] = (c.inventory[make]||0)+(def.yield||1);
  const keep = make==='good_bread' ? 2 : 0;
  if (c.inventory[make] > keep) list(c, make, c.inventory[make]-keep);
}
function ranch(c, every){
  c.workAcc++; c.herdAcc = (c.herdAcc||0)+1;
  const h = S.herd;
  if (c.workAcc >= every){ c.workAcc=0;
    const make = (hash(c.id+S.minute)%2 && h.cow>0) ? 'good_milk' : (h.chicken>0 ? 'good_eggs' : null);
    if (make && listed(make,c.id)<24){ c.inventory[make]=(c.inventory[make]||0)+1; list(c,make,1); }
  }
  if (c.herdAcc >= 200){ c.herdAcc=0;
    const r = hash(c.id+S.minute)%100; const k = r<30?'chicken':r<58?'sheep':r<82?'pig':'cow';
    if (k==='chicken' ? h.chicken<30 : h.cow+h.sheep+h.pig<46){ h[k]++;
      if (k==='cow' && hash(c.id+S.minute+'c')%2===0) chronicle(`A calf was born in the west pasture. ${c.name} named it ${pick(['Buttercup','Clover','Dot','Bramble','Pudding','Maple','Biscuit'])}.`, 3, '🐄', 'farm'); }
  }
  const big = h.cow+h.sheep+h.pig;
  if (big - listed('good_livestock') > 10 && S.minute-(c.lastTry.ls||-999)>60){ c.lastTry.ls=S.minute; c.inventory.good_livestock=(c.inventory.good_livestock||0)+1; list(c,'good_livestock',1); }
}
function adjustRel(a, b, delta){
  const r = getRel(a,b.id); const before = r.affinity;
  r.affinity = clamp(Math.round(r.affinity+delta), -100, 100);
  r.trust = clamp(r.trust + (delta>0?0.01:-0.02), 0, 1);
  r.familiarity = clamp(r.familiarity+0.02,0,1); r.last = S.minute;
  if (before<50 && r.affinity>=50 && !r.tags.includes('Friend') && !r.tags.includes('Family')){
    r.tags.push('Friend'); r.tags = r.tags.filter(t=>t!=='Rival');
    const rb = getRel(b,a.id); if (rb.affinity>=35 && !rb.tags.includes('Friend')){ rb.tags.push('Friend'); rb.tags=rb.tags.filter(t=>t!=='Rival'); chronicle(`${a.name} and ${b.name} have become friends.`, 4, '🤝', 'social'); S.week.rels.push(`${a.name} & ${b.name} became friends`); remember(a,`${b.name} has become a real friend.`,6,[b.id]); remember(b,`${a.name} has become a real friend.`,6,[a.id]); }
  }
  if (before>-50 && r.affinity<=-50 && !r.tags.includes('Rival')){
    r.tags.push('Rival'); r.tags = r.tags.filter(t=>t!=='Friend');
    chronicle(`${a.name} now considers ${b.name} a rival.`, 5, '⚔️', 'social'); S.week.rels.push(`${a.name} turned against ${b.name}`);
    remember(a,`I can't stand ${b.name} anymore.`,6,[b.id]);
  }
}
function placeName(loc){ const n = LOC[loc] ? LOC[loc].name : 'town'; return n.startsWith('The ') ? n : 'the '+n; }
function romance(a,b){
  const ra=getRel(a,b.id), rb=getRel(b,a.id);
  if (a.partner || b.partner) return;
  if (ra.tags.includes('Family') || a.age<18 || b.age<18) return;
  const romantic = a.traits.includes('Romantic') || b.traits.includes('Romantic');
  const seeking = romantic || a.agenda==='love' || b.agenda==='love' || a.agenda==='family' || b.agenda==='family' || (a.age>=20 && a.age<=50 && hash(a.id+b.id)%5===0);
  if (seeking && ra.affinity>72 && !ra.tags.includes('Crush') && Math.abs(a.age-b.age)<=12){ ra.tags.push('Crush'); chronicle(`${a.name} has a crush on ${b.name}.`, 4, '💘', 'romance'); remember(a,`I think I'm falling for ${b.name}.`,7,[b.id]); }
  if (ra.tags.includes('Crush') && rb.tags.includes('Crush') && ra.affinity>85 && rb.affinity>80 && !a.courting && !b.courting){
    a.courting=b.id; b.courting=a.id; a.courtingSince=b.courtingSince=S.minute;
    chronicle(`${a.name} and ${b.name} are courting! The whole tavern is talking about it.`, 7, '💞', 'romance'); S.week.rels.push(`${a.name} & ${b.name} started courting`);
    remember(a,`${b.name} and I are together now.`,9,[b.id]); remember(b,`${a.name} and I are together now.`,9,[a.id]);
  }
}

const BIZ_OWNER = {loc_tavern:'cit_greta_cole', loc_bakery:'cit_pell_marsh', loc_clinic:'cit_iris_vance', loc_carpentry:'cit_mara_holt', loc_smithy:'cit_hugo_brandt', loc_butcher:'Butcher', loc_fisher_hut:'Fisher', loc_barn:'Rancher', loc_mine:'town'};
const PLOT_VALUE = {t_core:160, t_grove:120, t_south:140, t_east:130, t_high:110};
const POP_CAP = 110, BUILD_DAYS = 4;
const isAdult = c => c.age>=16 && c.profession!=='Child';
const alive = id => { const c=cById(id); return c && !c.dead ? c : null; };
const surnameOf = c => c.name.split(' ').slice(1).join(' ') || c.name;

// ---------- properties ----------
// what can be built on a plot; homes house people, businesses make money
const BUILD_TYPES = {
  house:     {label:'House',           kind:'home',     cost:170, days:4, style:'house',   cap:5,  value:320},
  palace:    {label:'Palace',          kind:'home',     cost:950, days:8, style:'palace',  cap:4,  value:1400},
  apartments:{label:'Apartment block', kind:'home',     cost:600, days:7, style:'tall',    cap:12, value:900},
  hotel:     {label:'Hotel',           kind:'business', cost:700, days:7, style:'hotel',   lodging:12, staff:'Hotelier', value:1000},
  bathhouse: {label:'Bathhouse',       kind:'business', cost:500, days:6, style:'bath',    staff:'Bathkeeper', svc:'svc_bath', value:700},
  theater:   {label:'Theater',         kind:'business', cost:650, days:6, style:'theater', staff:'Showman', svc:'svc_show', value:900},
  tavern:    {label:'Tavern',          kind:'business', cost:320, days:5, style:'tavern',  trade:'TavernKeeper', svc:'svc_hot_meal', sign:'mug', value:600},
  bakery:    {label:'Bakery',          kind:'business', cost:260, days:4, style:'house',   trade:'Baker', sign:'bread', value:450},
  workshop:  {label:'Workshop',        kind:'business', cost:260, days:4, style:'house',   trade:'Carpenter', sign:'saw', value:450},
  forge:     {label:'Forge',           kind:'business', cost:300, days:4, style:'stone',   trade:'Blacksmith', sign:'anvil', value:500},
  jail:      {label:'Town Jail',       kind:'civic',    cost:260, days:5, style:'stone',   sign:'bars', value:500},
  court:     {label:'Town Court',      kind:'civic',    cost:360, days:6, style:'hall',    sign:'scales', value:700},
  arena:     {label:'Sports arena',    kind:'business', cost:550, days:6, style:'arena',   value:800},
  press:     {label:'Gazette office',  kind:'business', cost:260, days:4, style:'house',   trade:'Journalist', sign:'news', value:420},
  butchery:  {label:'Butchery',        kind:'business', cost:260, days:4, style:'house',   trade:'Butcher', sign:'meat', value:420}
};
const TRADE_BIZ = {Baker:'bakery', Carpenter:'workshop', Blacksmith:'forge', Butcher:'butchery', TavernKeeper:'tavern', Journalist:'press'};
const BIZ_ORIG = {loc_tavern:'tavern', loc_bakery:'bakery', loc_carpentry:'workshop', loc_smithy:'forge', loc_butcher:'butchery', loc_clinic:'clinic', loc_fisher_hut:'fishhut', loc_barn:'barn', loc_mine:'mine'};
const PROTECTED = new Set(['loc_tavern','bld_town_hall','loc_mine','loc_barn','loc_fisher_hut','loc_clinic']);
BUILDINGS.forEach(b=>{ if (BIZ_ORIG[b.id]) b.biz = BIZ_ORIG[b.id]; if (b.house){ b.cap = 5; b.type='house'; } });
const CLASSES = ['Wealthy','Upper','Middle','Poor'];
const CLASS_COL = {Wealthy:'#f2c14e', Upper:'#8fb8ff', Middle:'#7fd1ae', Poor:'#c8a0a0'};
function homeBuildings(){ return BUILDINGS.filter(b=>b.house); }
function propOf(bid){ return S.props[bid] || Object.values(S.props).find(p=>p.bid===bid); }
function plotOf(p){ return PLOTS.find(x=>x.id===p.plot); }
function propName(pr){ if (pr.kind==='plot'){ const pl=plotOf(pr); const t=TERRITORIES.find(t=>t.id===pr.terr); return `Plot ${String(pr.plot).replace('plot_','')} (${t?t.name:'town'})`; } const b=BUILDINGS.find(b=>b.id===pr.bid); return b?b.name:pr.id; }
function residentsOf(bid){ return (HOUSEHOLDS[bid]||[]).map(cById).filter(c=>c && !c.dead); }
function bizType(bid){ const L = LOC[bid]; return L && L.b ? L.b.biz || null : null; }
function bizList(type){ return BUILDINGS.filter(b=>b.biz===type); }
function capOf(b){ return b.cap || (b.house?5:0); }
function isLodging(bid){ return bid==='loc_tavern' || bizType(bid)==='hotel'; }
function lodgingCap(bid){ return bid==='loc_tavern' ? 8 : 12; }
function lodgers(){ return S.citizens.filter(c=>isLodging(c.home) && c.work!==c.home); }
function lodgingFor(n){ n=n||1; const opts = BUILDINGS.filter(b=>isLodging(b.id)).map(b=>({id:b.id, free:lodgingCap(b.id)-residentsOf(b.id).filter(c=>c.work!==b.id).length})).filter(x=>x.free>=n).sort((a,b)=>(a.id==='loc_tavern')-(b.id==='loc_tavern')); return opts[0] ? opts[0].id : 'loc_tavern'; }
function lodgingName(bid){ return bid==='loc_tavern' ? 'a room at the Tipsy Lantern' : `a room at ${LOC[bid].name}`; }
function initProperties(st){
  const props = {};
  BUILDINGS.forEach(b=>{
    if (b.id.startsWith('bld_')) return;
    if (b.house){ const res = st.citizens.filter(c=>c.home===b.id).sort((a,b2)=>b2.age-a.age); props[b.id] = {id:b.id, kind:'home', type:'house', bid:b.id, owner: res[0] ? res[0].id : 'town', value:320, forSale:false, ask:0}; }
    else { let o = BIZ_OWNER[b.id]||'town'; if (o!=='town' && !o.startsWith('cit_')){ const w = st.citizens.find(c=>c.profession===o); o = w ? w.id : 'town'; } props[b.id] = {id:b.id, kind:'business', type:b.biz||null, bid:b.id, owner:o, value:BIZ_VALUE[b.id]||400, forSale:false, ask:0}; }
  });
  PLOTS.forEach(pl=>{ props[pl.id] = {id:pl.id, kind:'plot', plot:pl.id, terr:pl.terr, owner:'town', value:PLOT_VALUE[pl.terr], forSale:true, ask:PLOT_VALUE[pl.terr]}; });
  return props;
}
function ownerName(id){ if (String(id).startsWith('team:')){ const t=teamById(id); return t ? t.name : 'a co-op'; } return id==='town' ? 'the town' : (cById(id) ? cById(id).name : id); }
function propsOf(c){ return Object.values(S.props).filter(p=>p.owner===c.id); }
function claimed(tid){ return !!S.terr[tid]; }
function payTo(ownerId, amt){ if (amt<=0) return; if (ownerId==='town'){ S.treasury+=amt; return; } if (String(ownerId).startsWith('team:')){ const t=teamById(ownerId); if (t) t.funds+=amt; else S.treasury+=amt; return; } const o=alive(ownerId); if (!o){ S.treasury+=amt; return; } o.wallet+=amt; today(o).inc+=amt; }
function prosperity(){ const ad=S.citizens.filter(isAdult); const avg = ad.reduce((a,c)=>a+c.wallet,0)/Math.max(1,ad.length); return clamp(0.7 + avg/450 + S.citizens.length/220, 0.6, 1.9); }
function baseValue(p){ if (p.kind==='plot') return PLOT_VALUE[p.terr]||150; if (p.type && BUILD_TYPES[p.type] && !BIZ_VALUE[p.bid]) return BUILD_TYPES[p.type].value; return p.kind==='home' ? 320 : (BIZ_VALUE[p.bid]||400); }
function revalue(){ const k = prosperity(); Object.values(S.props).forEach(p=>{ p.value = Math.round(baseValue(p)*k/10)*10; }); }
function listProp(p, ask, why){ if (p.forSale) return; p.forSale=true; p.ask=Math.max(20,Math.round(ask)); if (why) chronicle(`${propName(p)} is up for sale at ${p.ask}¢ (${why}).`, 4, '🪧', 'land'); }
function poolFunds(c, need){ const sp = c.partner && alive(c.partner); if (sp && c.wallet < need){ const take = Math.min(sp.wallet, need - c.wallet); sp.wallet -= take; c.wallet += take; } }
function transferProp(p, buyer, price, extra){
  const seller = p.owner;
  poolFunds(buyer, price + (extra||0));
  buyer.wallet -= price; today(buyer).exp += price; payTo(seller, price);
  p.owner = buyer.id; p.forSale=false; p.ask=0;
  S.land.sales.unshift({day:dayOf(S.minute), prop:p.id, name:propName(p), from:ownerName(seller), to:buyer.name, price}); S.land.sales = S.land.sales.slice(0,40);
  S.week.sales.push(`${buyer.name} bought ${propName(p)} for ${price}¢`);
  chronicle(`${buyer.name} bought ${propName(p)} from ${ownerName(seller)} for ${price}¢.`, 6, '🏠', 'land');
  remember(buyer, `I bought ${propName(p)}. It's mine now.`, 7);
}
function householdOf(c){ const movers = [c]; const sp = c.partner && alive(c.partner); if (sp && sp.home===c.home) movers.push(sp); S.citizens.forEach(k=>{ if (k.profession==='Child' && k.home===c.home && k.parents.includes(c.id) && !movers.includes(k)) movers.push(k); }); return movers; }
function moveHousehold(c, bid){ const movers = householdOf(c); movers.forEach(m=>{ m.home = bid; }); indexCitizens(); return movers; }
function wantsHome(c){ if (projects().some(p=>(p.build.returners||[]).includes(c.id) || p.build.by===c.id && BUILD_TYPES[p.build.type].kind==='home')) return false; const b = LOC[c.home] && LOC[c.home].b; return isLodging(c.home) || (b && residentsOf(c.home).length > capOf(b)) || c.agenda==='family' && residentsOf(c.home).length>=3; }

// ---------- social class: wealthy, upper, middle, poor (by net worth, relative to the town) ----------
function netWorth(c){ let w = c.wallet; for (const p of Object.values(S.props)) if (p.owner===c.id) w += p.value; return w; }
function updateClasses(){
  const ad = S.citizens.filter(isAdult); if (!ad.length) return;
  const ws = ad.map(netWorth).sort((a,b)=>a-b); const q = f=>ws[Math.min(ws.length-1, Math.floor(f*ws.length))];
  const p90=q(0.9), p65=q(0.65), p20=q(0.2);
  ad.forEach(c=>{ const w=netWorth(c); c.worth=w; const was=c.cls;
    c.cls = w>=Math.max(1500,p90) && c.wallet>=300 ? 'Wealthy' : w>=Math.max(600,p65) ? 'Upper' : (w<Math.max(100,p20) || w<60) ? 'Poor' : 'Middle';
    if (was && was!==c.cls && (c.cls==='Wealthy' || was==='Wealthy')){ chronicle(c.cls==='Wealthy' ? `${c.name} has joined the ranks of the wealthy (worth ${w}¢).` : `${c.name} is no longer among the wealthy.`, 5, c.cls==='Wealthy'?'💎':'📉', 'class'); remember(c, c.cls==='Wealthy'?'I am one of the richest people in Pixel Town now.':'I have lost my place among the rich.', 7); }
    if (was==='Middle' && c.cls==='Poor') remember(c, 'Money is tight. I have fallen on hard times.', 6);
  });
  S.citizens.filter(c=>!isAdult(c)).forEach(k=>{ const par=k.parents.map(alive).filter(Boolean)[0]; k.cls = par ? par.cls : 'Poor'; k.worth = k.wallet; });
}
function classCounts(){ const n={Wealthy:0,Upper:0,Middle:0,Poor:0}; S.citizens.filter(isAdult).forEach(c=>{ n[c.cls||'Middle']++; }); return n; }

// ---------- the land market ----------
function landDaily(){
  const d = dayOf(S.minute);
  updateClasses();
  // rent: tenants pay their home's owner; lodgers pay the inn or hotel's owner; hotel owners pay their staff
  BUILDINGS.forEach(b=>{
    const pr = propOf(b.id); if (!pr) return;
    if (b.house) residentsOf(b.id).forEach(r=>{ if (!isAdult(r) || r.id===pr.owner || (r.partner && r.partner===pr.owner) || mindOf(r).squat===b.id) return; const rent = Math.min(lawQuery.rentCap(), b.style==='tall' ? 4 : 3); if (r.wallet>=rent){ r.wallet-=rent; today(r).exp+=rent; payTo(pr.owner, rent); const w = cogOf(r).week; w.rent = (w.rent||0)+rent; w.landlord = pr.owner; } });
    if (isLodging(b.id)) residentsOf(b.id).forEach(r=>{ if (!isAdult(r) || r.work===b.id || r.id===pr.owner) return; const rent = b.id==='loc_tavern' ? 4 : 6; if (r.wallet>=rent){ r.wallet-=rent; today(r).exp+=rent; payTo(pr.owner, rent); } });
  });
  Object.values(S.props).filter(p=>p.kind==='business').forEach(p=>{ S.citizens.forEach(w=>{ if (w.work!==p.bid || w.id===p.owner || !isAdult(w)) return;
    const staff = BUILD_TYPES[p.type] && BUILD_TYPES[p.type].staff===w.profession;
    if (staff){ const o = alive(p.owner); if (o && o.wallet>=8){ o.wallet-=8; w.wallet+=8; today(w).inc+=8; } else if (p.owner==='town' && S.treasury>=8){ S.treasury-=8; w.wallet+=8; } else if (teamById(p.owner) && teamById(p.owner).funds>=8){ teamById(p.owner).funds-=8; w.wallet+=8; } }
    else if (w.wallet>=3){ w.wallet-=3; today(w).exp+=3; payTo(p.owner,3); } }); });
  // travelers on the King's Road stay at the hotels; cheaper hotels get more guests
  const hotels = bizList('hotel');
  if (hotels.length){ const guests = 1 + Math.floor(S.citizens.length/30) + Math.floor(rnd()*3) + (S.festival?3:0);
    const wts = hotels.map(b=>1/bizMod(b.id)), tw = wts.reduce((a,x)=>a+x,0);
    hotels.forEach((b,i)=>{ const g = Math.round(guests*wts[i]/tw); const pr = propOf(b.id); if (!pr || !g) return; const st = (S.biz[b.id] = S.biz[b.id] || {mod:1,cust:0}); st.cust += g;
      const coins = Math.round(g*8*bizMod(b.id)); payTo(pr.owner, coins); S.week.hotelGuests = (S.week.hotelGuests||0) + g; }); }
  // sellers
  Object.values(S.props).forEach(p=>{
    if (p.forSale || p.status==='construction' || p.status==='rubble') return;
    if (p.kind==='plot'){ if (p.owner==='town' && claimed(p.terr)) listProp(p, p.value); return; }
    const o = p.owner==='town' ? null : alive(p.owner);
    const vacant = p.kind==='home' && residentsOf(p.bid).length===0;
    if (!o){ if (vacant || p.owner==='town' && p.kind==='home' && p.type==='house') listProp(p, p.value); return; }
    const livesThere = o.home===p.bid;
    if (o.wallet<25 && !livesThere) listProp(p, p.value*0.85, `${o.name} needs the coin`);
    else if (o.agenda==='fortune' && propsOf(o).length>=2 && !livesThere && rnd()<0.04) listProp(p, p.value*1.25, `${o.name} is cashing in`);
    else if (vacant && !livesThere && rnd()<0.1) listProp(p, p.value);
  });
  // buyers: at most two deals a day
  let deals = 0;
  const forSale = Object.values(S.props).filter(p=>p.forSale && (p.kind!=='plot' || claimed(p.terr))).sort((a,b)=>a.ask-b.ask);
  for (const p of forSale){
    if (deals>=2) break;
    const funds = c => c.wallet + (c.partner && alive(c.partner) ? alive(c.partner).wallet*0.5 : 0);
    const buyers = S.citizens.filter(c=>c.age>=18 && isAdult(c) && c.id!==p.owner && funds(c) >= p.ask + 60 + (p.kind==='plot'?BUILD_TYPES.house.cost:0)).filter(c=>{
      if (p.kind==='home'){ const vac = residentsOf(p.bid).length===0; return (vac && wantsHome(c)) || c.agenda==='fortune' || (c.traits.includes('Ambitious') && c.wallet>p.ask*2.5); }
      if (p.kind==='business') return c.agenda==='business' || c.agenda==='fortune' || c.work===p.bid || (c.traits.includes('Greedy')||c.traits.includes('Cunning')) && c.wallet>p.ask*2;
      if (projects().some(pp=>pp.build.by===c.id)) return false;
      return (c.agenda==='business' && TRADE_BIZ[c.profession] && bizList(TRADE_BIZ[c.profession]).length<3 && !propsOf(c).some(q=>q.kind==='business')) || wantsHome(c) || (c.agenda==='family' && !propsOf(c).some(q=>q.kind==='home' || q.kind==='plot'));
    }).sort((a,b)=>b.wallet-a.wallet);
    const buyer = buyers[0]; if (!buyer || rnd()>0.4) continue;
    const type = p.kind==='plot' ? ((buyer.agenda==='business' && TRADE_BIZ[buyer.profession] && buyer.wallet>=BUILD_TYPES[TRADE_BIZ[buyer.profession]].cost+p.ask) ? TRADE_BIZ[buyer.profession] : 'house') : null;
    transferProp(p, buyer, p.ask, type ? BUILD_TYPES[type].cost : 0); deals++;
    if (p.kind==='home' && residentsOf(p.bid).length===0 && wantsHome(buyer)){ const m = moveHousehold(buyer, p.bid); chronicle(`${m.map(x=>x.name.split(' ')[0]).join(', ')} moved into ${propName(p)}.`, 5, '📦', 'land'); }
    if (p.kind==='plot') startConstruction(p, buyer, type);
  }
  // construction, rubble clearing, rentals, developers
  Object.values(S.props).forEach(p=>{ if (p.status==='construction' && d>=p.build.until) finishConstruction(p); if (p.status==='rubble' && d>=p.rubbleUntil){ p.status='plot'; bumpWorld(); } });
  rentVacancies();
  developDaily();
  // public housing when newcomers crowd the inns
  const lod = lodgers().length;
  const busy = projects().some(p=>p.build.by==='town');
  const plot = freePlotsList().filter(p=>p.owner==='town').sort((a,b)=>a.value-b.value)[0];
  if (!busy && plot){
    if (lod>=6 && S.treasury >= BUILD_TYPES.apartments.cost + 250) startConstruction(plot, null, 'apartments');
    else if (lod>=3 && S.treasury >= BUILD_TYPES.house.cost + 250) startConstruction(plot, null, 'house');
  }
  if (d%7===0){ revalue(); priceWars();
    // businesses left without anyone behind the counter hire again
    BUILDINGS.forEach(b=>{ const bt = BUILD_TYPES[b.biz]; if (!bt || !b.id.startsWith('loc_b_')) return; const prof = bt.staff || bt.trade; if (prof && !S.citizens.some(c=>c.work===b.id && c.profession===prof)){ const pr=propOf(b.id); const o = pr && alive(pr.owner); if (o && o.profession===prof && !(o.work && o.work.startsWith('loc_b_') && LOC[o.work])) o.work = b.id; else hireStaff(b.id, prof, o||null); } }); }
}
function projects(){ return Object.values(S.props).filter(p=>p.status==='construction'); }
function freePlotsList(){ return Object.values(S.props).filter(p=>p.kind==='plot' && claimed(p.terr) && p.status!=='construction' && p.status!=='rubble' && (p.owner==='town' || p.forSale)); }
// where a developer could build: land they already own, else the cheapest plot on the market
function siteFor(c, cost){
  const own = Object.values(S.props).find(p=>p.owner===c.id && p.kind==='plot' && p.status!=='construction' && p.status!=='rubble');
  if (own) return {p:own, buy:false};
  const oldHouse = Object.values(S.props).find(p=>p.owner===c.id && p.kind==='home' && p.type==='house' && residentsOf(p.bid).length===0 && !PROTECTED.has(p.bid));
  if (oldHouse) return {p:oldHouse, buy:false, demolish:true};
  const pl = freePlotsList().filter(p=>p.owner!==c.id).sort((a,b)=>(a.ask||a.value)-(b.ask||b.value))[0];
  if (pl && c.wallet >= (pl.ask||pl.value) + cost + 100) return {p:pl, buy:true};
  const old = Object.values(S.props).filter(p=>p.forSale && p.kind==='home' && p.type==='house' && p.owner!==c.id && residentsOf(p.bid).length===0 && !PROTECTED.has(p.bid)).sort((a,b)=>a.ask-b.ask)[0];
  if (old && c.wallet >= old.ask + cost + 100) return {p:old, buy:true, demolish:true};
  return null;
}
function developOn(site, c, type){
  const p = site.p;
  if (site.buy){ if (!p.forSale) listProp(p, p.value); transferProp(p, c, p.ask, BUILD_TYPES[type].cost); }
  if (site.demolish) demolish(p, `${c.name} is clearing it for a ${BUILD_TYPES[type].label.toLowerCase()}`);
  startConstruction(p, c, type);
}
function developDaily(){
  const active = projects();
  const busyOwner = id => active.some(p=>p.build.by===id);
  // the wealthy tear down their houses and build palaces
  S.citizens.filter(c=>isAdult(c) && c.cls==='Wealthy' && !busyOwner(c.id)).forEach(c=>{
    const hp = propOf(c.home); const b = LOC[c.home] && LOC[c.home].b;
    if (!hp || hp.owner!==c.id || hp.kind!=='home' || !b || b.style!=='house' || PROTECTED.has(b.id)) return;
    if (c.wallet < BUILD_TYPES.palace.cost + 250 || rnd()>0.05) return;
    rebuild(hp, 'palace', c);
  });
  if (projects().length>=3) return;
  // investors fill gaps in the market
  const lod = lodgers().length, crowded = homeBuildings().filter(b=>residentsOf(b.id).length>capOf(b)).length;
  const hotelFull = bizList('hotel').every(b=>residentsOf(b.id).length>=lodgingCap(b.id)-1);
  const want = [];
  const rich = S.citizens.filter(c=>c.cls==='Wealthy'||c.cls==='Upper').length, poor = S.citizens.filter(c=>c.cls==='Poor').length;
  const vacant = homeBuildings().filter(b=>residentsOf(b.id).length===0).length;
  const nOf = t => bizList(t).length + projects().filter(p=>p.build.type===t).length;
  const hs = bizList('hotel'), busyHotel = hs.length && hs.every(b=>((S.biz[b.id]||{}).cust||0) >= 18);
  if (!nOf('hotel') && S.citizens.length>=40) want.push('hotel');
  if ((lod>=4 && hotelFull || busyHotel) && nOf('hotel')<3) want.push('hotel');
  if (lod>=3 || crowded>=3 || (poor>=12 && vacant===0 && nOf('apartments')+homeBuildings().filter(b=>b.style==='tall').length<2)) want.push('apartments');
  if (nOf('bathhouse') < (rich>=14?2:1) && rich>=6) want.push('bathhouse');
  if (nOf('theater') < (rich>=16?2:1) && S.citizens.length>=40 && rich>=6) want.push('theater');
  if (S.citizens.filter(c=>c.profession==='Athlete').length>=4 && !nOf('arena') && rich>=4) want.push('arena');
  if (want.length){
    const investors = S.citizens.filter(c=>isAdult(c) && (c.cls==='Wealthy'||c.cls==='Upper') && (c.agenda==='fortune'||c.agenda==='business'||['Greedy','Cunning','Ambitious'].some(t=>c.traits.includes(t))) && !busyOwner(c.id)).sort((a,b)=>(b.worth||0)-(a.worth||0));

function priceWars(){

function deathChance(c){

function removeCitizen(c, kind, cause){

function lifeDaily(){
  const d = dayOf(S.minute);

  S.citizens.slice().forEach(c=>{ if (rnd() < deathChance(c)) die(c, c.sick>=3 ? 'a long illness' : c.age>=70 ? 'old age' : ['Miner','Woodcutter','Fisher'].includes(c.profession) && c.age<50 ? 'an accident at work' : 'a failing heart'); });
  // emigration: villagers who stay miserable for days pack up and leave

    if (!isAdult(c)) return;
    const unsafe = opinionOf(c,'safety') < -60 && cogOf(c).bel.some(b=>b.topic==='safety' && b.pos<0 && b.str>0.5);
    c.unhappy = (c.mood.valence < -0.45 || (c.mood.valence < -0.2 && c.wallet<10) || (unsafe && c.mood.valence < 0.1)) ? (c.unhappy||0)+1 : Math.max(0,(c.unhappy||0)-2);
    if (c.office || c.unhappy<10 || rnd()>0.12 || S.citizens.length<40) return;
    const kids = S.citizens.filter(k=>k.profession==='Child' && k.parents.includes(c.id) && !k.parents.some(pid=>pid!==c.id && alive(pid)));
    const quote = pick(['There\'s nothing left for me here.','I\'ll try my luck in the river cities.','Maybe the next town will be kinder.','I can\'t make ends meet in Pixel Town.']);

    S.week.departures.push(c.name);

  const mood = S.citizens.reduce((a,c)=>a+c.mood.valence,0)/Math.max(1,S.citizens.length);

// ---------- elections: a leader every 4 weeks, and a council of 5 ----------
function platformFor(c){
  let best='works', bs=-9;
  for (const k in PLATFORMS){ const P=PLATFORMS[k]; let sc = c.values.filter(v=>P.plus.includes(v)).length + (P.econ||0)*c.politics.economicLeaning + (P.order||0)*c.politics.orderLeaning + (AGENDA_PLATFORM[c.agenda]===k?1.5:0) + (hash(c.id+k)%100)/400; if (sc>bs){ bs=sc; best=k; } }
  return best;
}
function candidacyScore(c){
  return c.politics.civicEngagement + (c.traits.includes('Ambitious')?0.5:0) + (c.traits.includes('Charismatic')?0.4:0) + (c.agenda==='office'?1:0) + (c.agenda==='trouble'?0.3:0) + (c.office?0.4:0)
    + Math.min(0.6, c.wallet/1500) - legalScore(c)*0.3 - (c.jail?5:0) - (c.traits.includes('Shy')?0.5:0) - (c.agenda==='quiet'?0.8:0) + (hash(c.id+dayOf(S.minute))%100)/330;
}
function openCampaign(){
  const d = dayOf(S.minute);
  const pool = S.citizens.filter(c=>isAdult(c) && c.age>=21).sort((a,b)=>candidacyScore(b)-candidacyScore(a));
  const leader = pool.slice(0,3), council = pool.slice(0,10);
  S.gov.campaign = {day: d + (6 - d%7), leader: leader.map(c=>({id:c.id, platform:platformFor(c)})), council: council.map(c=>({id:c.id, platform:platformFor(c)}))};
  chronicle(`Election season! Running for leader: ${leader.map(c=>`${c.name} ("${PLATFORMS[platformFor(c)].title}")`).join(', ')}. ${council.length} villagers are standing for the council. Polls close on ${WEEKDAYS[6]} at 18:00.`, 7, '🗳️', 'gov');
  leader.concat(council).forEach(c=>remember(c, 'I am standing for election.', 6));
}
function voterScore(v, k, platform){
  const P = PLATFORMS[platform]; const r = peekRel(v,k.id);
  const aff = v===k ? 1.5 : r.affinity/100;
  let align = v.values.filter(x=>P.plus.includes(x)).length*0.5 + (P.econ||0)*v.politics.economicLeaning*0.5 + (P.order||0)*v.politics.orderLeaning*0.5;
  if (v.agenda && AGENDA_PLATFORM[v.agenda]===platform) align += 0.5;
  const CA = {Poor:{feed:.4, low_tax:-.2}, Wealthy:{low_tax:.4, feed:-.2, grow:.2}, Upper:{low_tax:.2, grow:.1}}[v.cls];
  if (CA && CA[platform]) align += CA[platform];
  const charisma = (k.traits.includes('Charismatic')?0.3:0) + k.personality.extraversion*0.3;
  const mood = S.citizens.reduce((a,c)=>a+c.mood.valence,0)/S.citizens.length;
  const incumbent = k.office ? (v.agenda==='trouble' ? -0.4 : mood*0.4) : 0;
  const rival = r.tags.includes('Rival') ? -0.6 : 0;
  const PT_OP = {feed:['poor','relief'], low_tax:['taxes'], land:['nature'], order:['safety','constables'], grow:['expansion'], freedom:['constables']}[platform] || [];
  PT_OP.forEach(t=>{ let o = opinionOf(v, t)/100; if (t==='safety' || (t==='constables' && platform==='order')) o = platform==='order' ? -opinionOf(v,'safety')/100*0.6 + opinionOf(v,'constables')/200 : o; if (platform==='freedom' && t==='constables') o = -o; if (platform==='low_tax') o = -o; align += o*0.4; });
  align -= scandalOf(v, k.id)*0.8;
  return 0.35*aff + 0.35*clamp(align,-1,1) + 0.2*charisma + 0.1*incumbent + rival + (hash(v.id+k.id+S.minute)%100)/600;
}
function holdElection(){
  const C = S.gov.campaign; S.gov.campaign = null;
  const voters = S.citizens.filter(c=>isAdult(c) && !c.jail);
  const lc = C.leader.filter(x=>alive(x.id)), cc = C.council.filter(x=>alive(x.id));
  if (!lc.length) return;
  const lv = {}; lc.forEach(x=>lv[x.id]=0);
  voters.forEach(v=>{ const best = lc.map(x=>[x, voterScore(v, cById(x.id), x.platform)]).sort((a,b)=>b[1]-a[1])[0]; lv[best[0].id]++; });
  const leaderId = Object.entries(lv).sort((a,b)=>b[1]-a[1])[0][0];

  voters.forEach(v=>{ cc.filter(x=>x.id!==leaderId).map(x=>[x, voterScore(v, cById(x.id), x.platform)]).sort((a,b)=>b[1]-a[1]).slice(0,3).forEach(([x])=>cv[x.id]++); });

  S.gov.platforms = Object.fromEntries(C.council.concat(C.leader).map(x=>[x.id,x.platform]));
  cById(leaderId).office='Leader'; council.forEach(id=>cById(id).office='Councillor');
  const L = cById(leaderId), plat = PLATFORMS[S.gov.platforms[leaderId]].title;

    leaderTally: Object.entries(lv).sort((a,b)=>b[1]-a[1]).map(([id,n])=>({name:cById(id).name, votes:n, platform:PLATFORMS[S.gov.platforms[id]].title})),
    council: council.map(id=>({name:cById(id).name, votes:cv[id], platform:PLATFORMS[S.gov.platforms[id]].title}))};
  S.gov.elections.unshift(rec); S.gov.elections = S.gov.elections.slice(0,12);
  chronicle(`${L.name} ${prevLeader===leaderId?'was re-elected':'was elected'} Leader of Pixel Town with ${lv[leaderId]} of ${voters.length} votes, promising "${plat}". The new council: ${council.map(id=>cById(id).name).join(', ')}.`, 9, '🗳️', 'gov');
  S.week.election = rec;
  publicEvent({type:'election', text:`${L.name} was elected Leader promising "${plat}".`, who:[leaderId], topics:{}, imp:6, kind:'gov', at:'loc_town_hall', r:8});
  S.bubbles.push({id:leaderId, text:'★ LEADER', until:performance.now()+6000, gm:S.minute});
  voters.forEach(v=>remember(v, `${L.name} is our new leader.`, v.id===leaderId?10:3, [leaderId]));
  setEmotion(L,'Proud',DAY*2);
}
function politicsDaily(){
  const d = dayOf(S.minute);
  if (d%28===2 && !S.gov.campaign) openCampaign();

  if (S.gov.leader && alive(S.gov.leader) && S.treasury>=10){ S.treasury-=10; payTo(S.gov.leader,10); }

function officials(){ return [S.gov.leader].concat(S.gov.council).filter(id=>id && alive(id)).map(cById); }
// council and leader draft laws from their platforms; returns {key, proposer} or null
function councilPick(){
  const offs = officials(); if (!offs.length) return null;
  const wk = weekNo(dayOf(S.minute));
  const order = offs.slice(0,1).concat(offs.slice(1).sort((a,b)=>hash(a.id+wk)-hash(b.id+wk)));
  const activeKeys = new Set(S.gov.proposals.filter(p=>['Enacted','Passed'].includes(p.status)).map(p=>p.key));
  let best=null;
  for (const o of order){
    const plat = PLATFORMS[(S.gov.platforms||{})[o.id] || platformFor(o)];
    for (const k of plat.laws){
      if (k==='annex'){ const a = annexCandidate(0.3); if (a && a.score>0.45 && !(best && best.s>=a.score)) best={key:'annex', t:a.t, proposer:o, s:a.score}; continue; }
      if (activeKeys.has(k) || (S.gov.cooldown[k] && dayOf(S.minute)-S.gov.cooldown[k] < 7)) continue;
      const s = CANDIDATES[k].trigger() + 0.3 + rnd()*0.1;
      if (s>0.5 && !(best && best.s>=s)) best={key:k, proposer:o, s};
    }
    if (best) break;
  }
  return best;
}

function feel(c, e, amt, thought){ const m=mindOf(c); m.emo[e]=clamp(m.emo[e]+amt,0,1); if (thought) think(c, thought); }
